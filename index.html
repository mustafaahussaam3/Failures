function insertAtCursor(el,text){
  if(!el)return;
  const start=typeof el.selectionStart==='number'?el.selectionStart:el.value.length;
  const end=typeof el.selectionEnd==='number'?el.selectionEnd:el.value.length;
  el.value=el.value.slice(0,start)+text+el.value.slice(end);
  const pos=start+text.length;
  try{el.focus({preventScroll:true});el.setSelectionRange(pos,pos);}catch{el.focus();}
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
function wireEmojiBars(root=document){
  root.querySelectorAll('.emoji-bar button').forEach(btn=>btn.onclick=(e)=>{
    e.preventDefault();e.stopPropagation();
    const bar=btn.closest('.emoji-bar');
    const targetId=bar?bar.dataset.emojiTarget:'';
    insertAtCursor(document.getElementById(targetId),btn.dataset.emoji||btn.textContent);
  });
}

function normalizePriority(p){p=String(p||'normal').toLowerCase();return ['urgent','high','normal','low'].includes(p)?p:'normal';}
function priorityLabel(p){p=normalizePriority(p);return p==='urgent'?'URGENT':p==='high'?'HIGH':p==='low'?'LOW':'NORMAL';}
function cleanRequiredStages(list){
  const raw=Array.isArray(list)?list:String(list||'').split(/[ ,|]+/);
  const seen=new Set(),out=[];
  raw.forEach(x=>{const k=String(x||'').toLowerCase().trim();if(TASK_STAGE_ORDER.includes(k)&&!seen.has(k)){seen.add(k);out.push(k);}});
  return out;
}
function defaultRequiredStagesForTeam(team){
  team=String(team||'gen').toLowerCase();
  if(team==='sw')return ['software'];
  if(team==='emb')return ['embedded'];
  if(team==='mech')return ['mechanical'];
  if(team==='elec')return ['electrical'];
  return ['embedded','software','test'];
}
function taskRequiredStages(t){
  t=t||{};
  let req=cleanRequiredStages(t.requiredStages||t.workStages||t.stagesRequired);
  if(!req.length){
    const legacy=('embeddedDone' in t)||('softwareDone' in t)||('testDone' in t);
    req=legacy?['embedded','software','test']:defaultRequiredStagesForTeam(t.team);
  }
  return req.length?req:['software'];
}
function taskRequires(t,stage){return taskRequiredStages(t).includes(stage);}
function taskStageDone(t,stage){const m=TASK_STAGE_META[stage];return !!(m&&t&&t[m.flag]);}
function taskPhase(t){
  const req=taskRequiredStages(t);
  if(req.every(st=>taskStageDone(t,st)))return 'done';
  if(req.includes('test')){
    const before=req.filter(st=>st!=='test');
    if((before.length===0||before.every(st=>taskStageDone(t,st)))&&!taskStageDone(t,'test'))return 'test';
  }
  return 'open';
}
function taskPhaseLabel(t){const ph=taskPhase(t);return ph==='done'?'DONE':ph==='test'?'TEST':'OPEN';}
function taskSort(a,b){
  const pa=PRIORITY_ORDER[normalizePriority(a.priority)]??2,pb=PRIORITY_ORDER[normalizePriority(b.priority)]??2;
  return (pa-pb)||((b.at||0)-(a.at||0));
}
function stagePatchForTask(t,done){
  const patch={};
  taskRequiredStages(t).forEach(st=>{patch[TASK_STAGE_META[st].flag]=done;});
  return patch;
}
function workPicker(id,selected){
  const req=cleanRequiredStages(selected);
  return `<div class="work-picker" id="${esc(id)}">${TASK_STAGE_ORDER.map(st=>{const m=TASK_STAGE_META[st];return `<label><input type="checkbox" value="${st}" ${req.includes(st)?'checked':''}> ${m.icon} ${esc(m.label)}</label>`;}).join('')}</div>`;
}
function readWorkPicker(id){return Array.from(document.querySelectorAll(`#${id} input:checked`)).map(x=>x.value).filter(v=>TASK_STAGE_ORDER.includes(v));}
function normalizeTask(t){
  t=t||{};
  t.priority=normalizePriority(t.priority);
  t.requiredStages=taskRequiredStages(t);
  TASK_STAGE_ORDER.forEach(st=>{
    const m=TASK_STAGE_META[st];
    if(t[m.flag]===undefined)t[m.flag]=false;
    if(t[m.at]===undefined)t[m.at]=null;
    if(t[m.by]===undefined)t[m.by]='';
  });
  if(t.done)t.requiredStages.forEach(st=>{t[TASK_STAGE_META[st].flag]=true;});
  if(t.idsAdded===undefined)t.idsAdded=!!(t.failureCanId||t.correctiveCanId);
  const done=t.requiredStages.length>0 && t.requiredStages.every(st=>!!t[TASK_STAGE_META[st].flag]);
  t.done=done;
  t.status=done?'DONE':(t.status==='NOT YET STARTED'?'NOT YET STARTED':'IN-PROGRESS');
  return t;
}

function normalizeCommunity(p){
  p=p||{};
  p.type=COMMUNITY_TYPES.includes(String(p.type||'').toLowerCase())?String(p.type).toLowerCase():'message';
  p.priority=normalizePriority(p.priority||'normal');
  p.team=['sw','emb','gen','mech','elec'].includes(p.team)?p.team:'gen';
  p.replies=Array.isArray(p.replies)?p.replies:[];
  p.done=!!p.done;
  p.pinned=!!p.pinned;
  return p;
}
function communitySort(a,b){return ((b.pinned?1:0)-(a.pinned?1:0))||((b.at||0)-(a.at||0));}

function cleanMemberName(n){return String(n||'').replace(/\band\b/gi,',').split(',').map(x=>x.trim()).filter(Boolean);}

function isSavedMember(name){const k=String(name||'').trim().toLowerCase();return !!k && teamMembers.some(m=>m.toLowerCase()===k);}
function memberActivityCount(name){
  const k=String(name||'').trim().toLowerCase();if(!k)return 0;
  let c=0;
  tasks.forEach(t=>{if(String(t.by||'').toLowerCase()===k)c++;if(String(t.assignee||'').toLowerCase()===k)c++;});
  community.forEach(p=>{if(String(p.by||'').toLowerCase()===k)c++;if(String(p.assignee||'').toLowerCase()===k)c++;(p.replies||[]).forEach(r=>{if(String(r.by||'').toLowerCase()===k)c++;});});
  notifications.forEach(n=>{if(String(n.by||'').toLowerCase()===k)c++;});
  return c;
}

/* team inference: embedded vs software from the technical column */
function teamOf(f){
  const t=(f.embedded_ui||'').toLowerCase();
  const hasEmb = t.includes('embedded') && /embedded:\s*\S/.test((f.embedded_ui||'').toLowerCase());
  const hasUI = /ui:\s*\S/.test((f.embedded_ui||'').toLowerCase());
  if(f.team) return f.team; // manual override
  if(hasEmb&&hasUI) return 'both';
  if(hasUI) return 'sw';
  if(hasEmb) return 'emb';
  return 'both';
}

async function initData(){
  if(CONFIGURED){
    try{
      const app=initializeApp(firebaseConfig);
      DB=getFirestore(app);
      const auth=getAuth(app);
      // sign in anonymously so security rules can require auth
      await signInAnonymously(auth);
      await new Promise(res=>{const off=onAuthStateChanged(auth,u=>{if(u){off();res();}});});
      failuresCol=collection(DB,'failures');
      tasksCol=collection(DB,'tasks');
      metaCol=collection(DB,'meta');
      notificationsCol=collection(DB,'notifications');
      needsCol=collection(DB,'needs');
      communityCol=collection(DB,'community');
      // seed if empty
      const snap=await getDocs(failuresCol);
      if(snap.empty){
        await seedFirestore();
      }else{
        await refreshFirestoreSeedIfNeeded(snap);
      }
      onSnapshot(failuresCol,s=>{
        failures=s.docs.map(d=>({_docid:d.id,...d.data()}));
        sortFailures();
        setSync(true);render();
      },err=>{setSync(false);console.error(err);});
      onSnapshot(tasksCol,s=>{
        tasks=s.docs.map(d=>normalizeTask({_docid:d.id,...d.data()}));
        render();
      });
      onSnapshot(needsCol,s=>{
        needs=s.docs.map(d=>({_docid:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
        render();
      },err=>{console.error(err);});
      onSnapshot(communityCol,s=>{
        community=s.docs.map(d=>normalizeCommunity({_docid:d.id,...d.data()})).sort(communitySort).slice(0,500);
        render();
      },err=>{console.error(err);});
      onSnapshot(doc(metaCol,'defineFile'),d=>{
        if(d.exists())defineText=d.data().text||'';
        if(view==='define')render();
      },err=>{console.error(err);});
      onSnapshot(doc(metaCol,'teamMembers'),d=>{
        teamMembers=normalizeMemberList(d.exists()?(d.data().names||[]):lsLoad('viper_team_members',[]));
        lsSave('viper_team_members',teamMembers);
        if(view==='community'||view==='setup')render();
      },err=>{console.error(err);});
      onSnapshot(notificationsCol,s=>{
        notifications=s.docs.map(d=>({_docid:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,100);

/* ---------- CAN DEFINE HELPERS ---------- */
function makeDefineName(f){
  const raw=((f&&f.event)||'TASK').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return (raw||'TASK').slice(0,48);
}
function usedCanIds(){
  const used=new Set();
  const txt=(defineText||DEFAULT_DEFINE||'');
  [...txt.matchAll(/^\s*#define\s+[A-Z0-9_]+\s+\(?\s*(\d+)\s*\)?/gm)].forEach(m=>used.add(parseInt(m[1],10)));
  tasks.forEach(t=>{['failureCanId','correctiveCanId'].forEach(k=>{const n=parseInt(t[k],10);if(!isNaN(n))used.add(n);});});
  return used;
}
function nextCanPair(){
  const used=usedCanIds();
  for(let n=600;n<998;n+=2){
    if(!used.has(n)&&!used.has(n+1))return {failure:n,corrective:n+1};
  }
  let mx=599;used.forEach(v=>{if(v>mx)mx=v;});
  const n=(mx%2===0)?mx+2:mx+1;
  return {failure:n,corrective:n+1};
}
function defineLinesForTask(t){
  const name=(t.defineName||'TASK').toUpperCase().replace(/[^A-Z0-9_]+/g,'_').replace(/^_+|_+$/g,'')||'TASK';
  const fid=parseInt(t.failureCanId,10)||0;
  const cid=parseInt(t.correctiveCanId,10)||0;
  return {name,lines:[`#define ${name}_FAILURE${' '.repeat(Math.max(1,48-(name.length+8)))}${fid}`,`#define ${name}_CORRECTIVE${' '.repeat(Math.max(1,45-(name.length+11)))}${cid}`]};
}
async function upsertDefineForTask(t){
  if(!t||!t.defineName||!t.failureCanId||!t.correctiveCanId)return;
  let text=defineText||DEFAULT_DEFINE||'';
  const {name,lines}=defineLinesForTask(t);
  function upsertLine(suffix,line){
    const re=new RegExp(`^\\s*#define\\s+${name}_${suffix}\\s+.*$`,'m');
    if(re.test(text))text=text.replace(re,line);
    else text=text.replace(/\n#endif\s*$/,'')+`\n${line}\n#endif`;
  }
  upsertLine('FAILURE',lines[0]);
  upsertLine('CORRECTIVE',lines[1]);
  await saveDefine(text);
}
function taskProgressState(patch,t){
  const merged=Object.assign({},t,patch);
  const req=cleanRequiredStages(('requiredStages' in patch)?patch.requiredStages:taskRequiredStages(t));
  const done=req.length>0 && req.every(st=>!!merged[TASK_STAGE_META[st].flag]);
  return {done,status:done?'DONE':'IN-PROGRESS',requiredStages:req};
}
function taskDoneFromProgress(patch,t){
  return taskProgressState(patch,t).done;
}

/* ---------- FAILURE -> TASK (with status sync) ---------- */
function taskForFailure(fid){return tasks.find(t=>t.failureId===fid);}
async function convertFailureToTask(fid,assignee='',teamOverride='',options={}){
  if(!myName){promptName();return;}
  const f=failures.find(x=>x.id===fid);if(!f)return;
  if(taskForFailure(fid)){toast('Already on the task board');return;}
  const inferred=teamOf(f);
  const taskTeam=teamOverride || ((inferred==='sw'||inferred==='emb')?inferred:'gen');
  const who=(assignee||f.assignee||'').trim();
  const alreadyDone=f.status==='DONE';
  const obj={
    id:'ft_'+fid.replace(/\./g,'_'),
    failureId:fid,
    text:`[${fid}] ${f.event}`,
    team:taskTeam,
    requiredStages:cleanRequiredStages(options.requiredStages||['embedded','software','test']),
    assignee:who,
    priority:normalizePriority(options.priority||'normal'),
    status:alreadyDone?'DONE':'IN-PROGRESS',
    done:alreadyDone,
    embeddedDone:alreadyDone,
    softwareDone:alreadyDone,
    mechanicalDone:alreadyDone,
    electricalDone:alreadyDone,
    testDone:alreadyDone,
    embeddedDoneAt:null,softwareDoneAt:null,mechanicalDoneAt:null,electricalDoneAt:null,testDoneAt:null,
    progressNotes:'',
    idsAdded:false,
    defineName:makeDefineName(f),
    failureCanId:'',
    correctiveCanId:'',
    by:myName,at:Date.now()
  };
  await addTask(obj);
  await updateFailure(fid,{assignee:who,status:alreadyDone?'DONE':'IN-PROGRESS',updatedBy:myName,updatedAt:Date.now()});
  toast('Assigned and added to Tasks ✓');
}
// changing a linked task's status updates the failure everywhere
async function setLinkedTaskStatus(taskId,newStatus){
  const t=tasks.find(x=>x.id===taskId);if(!t)return;
  const now=Date.now();
  const patch={status:newStatus,done:(newStatus==='DONE')};
  if(newStatus==='DONE'){
    Object.assign(patch,stagePatchForTask(t,true));
    taskRequiredStages(t).forEach(st=>{const m=TASK_STAGE_META[st];if(!t[m.flag]){patch[m.at]=now;patch[m.by]=myName||'Team member';}});
    if(!t.done){patch.doneAt=now;patch.doneBy=myName||'Team member';}
  }
  if(newStatus!=='DONE'){
    patch.done=false;
    if(t.done || newStatus==='NOT YET STARTED'){
      taskRequiredStages(t).forEach(st=>{const m=TASK_STAGE_META[st];patch[m.flag]=false;patch[m.at]=null;patch[m.by]='';});
    }
  }
  await updateTask(t.id,patch);
  if(t.failureId){
    const f=failures.find(x=>x.id===t.failureId);
    if(f&&f.status!==newStatus)await updateFailure(t.failureId,{status:newStatus});
  }
}
async function updateTaskProgress(taskId,patch){
  const t=tasks.find(x=>x.id===taskId);if(!t)return;
  const now=Date.now();
  const nextRequired=cleanRequiredStages(('requiredStages' in patch)?patch.requiredStages:taskRequiredStages(t));
  if(!nextRequired.length){toast('Select at least one required work section');return;}
  patch.requiredStages=nextRequired;
  // Hide and remove non-required work from progress and summaries.
  TASK_STAGE_ORDER.forEach(st=>{
    const m=TASK_STAGE_META[st];
    if(!nextRequired.includes(st)){patch[m.flag]=false;patch[m.at]=null;patch[m.by]='';}
  });
  const stageNotes=[];
  TASK_STAGE_ORDER.forEach(st=>{
    const m=TASK_STAGE_META[st];
    if(m.flag in patch){
      if(nextRequired.includes(st) && patch[m.flag] && !t[m.flag]){patch[m.at]=now;patch[m.by]=myName||'Team member';stageNotes.push(m.label);}
      if(!patch[m.flag]){patch[m.at]=null;patch[m.by]='';}
    }
  });
  const state=taskProgressState(patch,t);
  patch.done=state.done;
  patch.status=state.status;
  if(state.done && !t.done){patch.doneAt=now;patch.doneBy=myName||'Team member';}
  if(!state.done && t.done){patch.doneAt=null;patch.doneBy='';}
  await updateTask(taskId,patch);
  const nt=Object.assign({},t,patch);
  for(const label of stageNotes){
    await addNotification(`${label} task finished`,`${nt.text}${nt.assignee?`
Assigned to: ${nt.assignee}`:''}`, 'task');
  }
  if(nt.idsAdded)await upsertDefineForTask(nt);
  if(t.failureId){
    await updateFailure(t.failureId,{status:patch.status,updatedBy:myName,updatedAt:Date.now()});
  }
}
async function addIdsToTask(taskId){
  if(!myName){promptName();return;}
  const t=tasks.find(x=>x.id===taskId);if(!t)return;
  const f=t.failureId?failures.find(x=>x.id===t.failureId):null;
  const pair=nextCanPair();
  const patch={
    idsAdded:true,
    defineName:t.defineName||makeDefineName(f||{event:t.text}),
    failureCanId:t.failureCanId||pair.failure,
    correctiveCanId:t.correctiveCanId||pair.corrective,
    updatedBy:myName,updatedAt:Date.now()
  };
  await updateTask(t.id,patch);
  await upsertDefineForTask(Object.assign({},t,patch));
  toast('IDs added to task and DEFINE ✓');
}
// editing a failure's status updates its linked task
async function syncTaskFromFailure(fid){
  const t=taskForFailure(fid);if(!t)return;
  const f=failures.find(x=>x.id===fid);if(!f)return;
  if(t.status!==f.status){
    const done=f.status==='DONE';
    await updateTask(t.id,{status:f.status,done,embeddedDone:done?true:t.embeddedDone,softwareDone:done?true:t.softwareDone,testDone:done?true:t.testDone});
  }
}

/* ---------- PROGRESS ---------- */
function counts(){
  const c={total:0,DONE:0,'IN-PROGRESS':0,DEFINED:0,'NOT YET STARTED':0};
  failures.forEach(f=>{c.total++;c[f.status]=(c[f.status]||0)+1;});
  return c;
}
function renderProgress(){
  const c=counts();
  const done=c.DONE||0,prog=c['IN-PROGRESS']||0,def=c.DEFINED||0,tot=c.total||1;
  const pct=Math.round(done/tot*100);
  $('#progLabel').textContent=`${done} of ${tot} complete · ${prog} in progress`;
  $('#progPct').textContent=pct+'%';
  $('#barDone').style.width=(done/tot*100)+'%';
  $('#barProg').style.width=(prog/tot*100)+'%';
  $('#barDef').style.width=(def/tot*100)+'%';
}

/* ---------- FAILURES VIEW ---------- */
function renderFailures(){
  const activeSearch=document.activeElement&&document.activeElement.id==='searchBox'?document.activeElement:null;
  const keepSearchFocus=!!activeSearch;
  const keepSearchStart=keepSearchFocus?activeSearch.selectionStart:null;
  const keepSearchEnd=keepSearchFocus?activeSearch.selectionEnd:null;
  const c=counts();
  let list=failures.filter(f=>{
    if(filterCat!=='all'&&f.category!==filterCat)return false;
    if(filterStatus==='TASK'&&!taskForFailure(f.id))return false;
    if(filterStatus!=='all'&&filterStatus!=='TASK'&&f.status!==filterStatus)return false;
    if(search){const q=search.toLowerCase();
      if(!(f.event.toLowerCase().includes(q)||f.id.includes(q)||(f.cause||'').toLowerCase().includes(q)))return false;}
    return true;
  });
  const catCounts={};CATEGORIES.forEach(k=>catCounts[k]=0);
  failures.forEach(f=>catCounts[f.category]=(catCounts[f.category]||0)+1);

  let html=`<div class="search"><span class="si">⌕</span>
    <input id="searchBox" placeholder="Search failures, ID, cause…" value="${esc(search)}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div>`;

  html+=`<div class="statrow">
    ${sfBtn('all','ALL',c.total)}
    ${sfBtn('DONE','DONE',c.DONE||0)}
    ${sfBtn('IN-PROGRESS','IN-PROG',c['IN-PROGRESS']||0)}
    ${sfBtn('DEFINED','DEFINED',c.DEFINED||0)}
    ${sfBtn('NOT YET STARTED','NOT STARTED',c['NOT YET STARTED']||0)}
    ${sfBtn('TASK','TASK',tasks.filter(t=>t.failureId).length)}
  </div>`;

  html+=`<div class="chips">
    <span class="chip ${filterCat==='all'?'active':''}" data-cat="all">All <span class="ct">${failures.length}</span></span>`;

    html+=`<span class="chip ${filterCat===cat?'active':''}" data-cat="${cat}">${cat} <span class="ct">${catCounts[cat]}</span></span>`;});
  html+=`</div>`;

  if(!list.length){
    html+=`<div class="empty"><div class="big">⌀</div>No failures match.<br>Try clearing filters.</div>`;
  }else{
    html+=`<div class="swipe-hint">← Swipe a card left to add it as a Task</div>`;

    list.forEach(f=>{
      const team=teamOf(f);

      html+=`<div class="card-wrap" data-id="${esc(f.id)}">
        <div class="card-action">＋ TASK</div>
        <div class="card s-${statusClass(f.status)}" data-open="${esc(f.id)}">

          <span class="cid">${esc(f.id)}</span>
          <span class="cev">${esc(f.event)}</span>
        </div>
        <div class="cmeta">
          <span class="badge b-cat">${esc(f.category)}</span>
          <span class="badge b-st ${statusBadge(f.status)}">${esc(f.status)}</span>
          <span class="b-team ${team==='both'?'both':team}">${teamLbl}</span>
          ${f.assignee?`<span class="badge b-cat">👤 ${esc(f.assignee)}</span>`:''}
          ${isTask?`<span class="badge b-tasked">▣ TASK</span>`:''}
        </div>

    searchBox.addEventListener('focus',()=>setTimeout(()=>{const sb=$('#searchBox');if(sb)sb.scrollIntoView({block:'nearest'});},300));
    if(keepSearchFocus){
      requestAnimationFrame(()=>{
        const sb=$('#searchBox');if(!sb)return;
        const start=Math.min(search.length, keepSearchStart==null?search.length:keepSearchStart);
        const end=Math.min(search.length, keepSearchEnd==null?start:keepSearchEnd);
        try{sb.focus({preventScroll:true});sb.setSelectionRange(start,end);}catch{sb.focus();}
      });

  }

  main.querySelectorAll('.sfilter').forEach(b=>b.onclick=()=>{filterStatus=b.dataset.s;renderFailures();});
  main.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>openSheet(c.dataset.open));
  setupSwipe();
}
/* swipe-left on a failure card => convert to task */
function setupSwipe(){
  main.querySelectorAll('.card-wrap').forEach(wrap=>{
    const card=wrap.querySelector('.card');
    let startX=0,startY=0,dx=0,active=false,decided=false,horizontal=false;
    card.addEventListener('touchstart',e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY;dx=0;active=true;decided=false;horizontal=false;card.style.transition='none';},{passive:true});
    card.addEventListener('touchmove',e=>{
      if(!active)return;const t=e.touches[0];const mx=t.clientX-startX,my=t.clientY-startY;
      if(!decided){if(Math.abs(mx)>8||Math.abs(my)>8){decided=true;horizontal=Math.abs(mx)>Math.abs(my);}}
      if(!horizontal)return;
      e.preventDefault();
      dx=Math.min(0,mx);
      card.style.transform=`translateX(${Math.max(dx,-130)}px)`;
    },{passive:false});
    card.addEventListener('touchend',()=>{
      if(!active)return;active=false;card.style.transition='transform .2s';card.style.transform='translateX(0)';
      if(dx<-80)convertFailureToTask(wrap.dataset.id);
    });
  });
}
function sfBtn(s,lbl,n){return `<button class="sfilter ${filterStatus===s?'active':''}" data-s="${s}">${lbl} <b>${n}</b></button>`;}

function splitEmb(s){
  // split "Embedded: ... UI: ..." into two
  s=s||'';
  const ui=s.search(/UI:/i);
  if(ui>=0){
    return {emb:s.slice(0,ui).replace(/^Embedded:/i,'').trim(),ui:s.slice(ui).replace(/^UI:/i,'').trim()};
  }
  return {emb:s.replace(/^Embedded:/i,'').trim(),ui:''};
}

/* ---------- TASKS VIEW ---------- */
function renderTasks(){
  const stageFilters=TASK_STAGE_ORDER;
  const priorityFilters=['urgent','high','normal','low'];
  const legacy=lsLoad('viper_task_filter','all');
  let workFilter=lsLoad('viper_task_work_filter',null);
  let priorityFilter=lsLoad('viper_task_priority_filter',null);
  let stateFilter=lsLoad('viper_task_state_filter',null);

  if(!workFilter){
    workFilter=stageFilters.includes(legacy)?legacy:'all';
    lsSave('viper_task_work_filter',workFilter);
  }
  if(!priorityFilter){
    priorityFilter=priorityFilters.includes(legacy)?legacy:'all';
    lsSave('viper_task_priority_filter',priorityFilter);
  }
  if(!stateFilter){
    stateFilter=legacy==='done'?'done':'notdone';
    lsSave('viper_task_state_filter',stateFilter);
  }
  if(!stageFilters.includes(workFilter) && workFilter!=='all')workFilter='all';
  if(!priorityFilters.includes(priorityFilter) && priorityFilter!=='all')priorityFilter='all';
  if(!['all','done','notdone'].includes(stateFilter))stateFilter='notdone';

  const workButtons=[['all','ALL WORK'],['embedded','EMBEDDED'],['software','SOFTWARE'],['mechanical','MECHANICAL'],['electrical','ELECTRICAL'],['test','TEST']];
  const priorityButtons=[['all','ALL PRIORITY'],['urgent','URGENT'],['high','HIGH'],['normal','NORMAL'],['low','LOW']];
  const stateButtons=[['notdone','NOT DONE'],['done','DONE'],['all','ALL STATE']];
  const buttonRow=(title,id,items,current,attr)=>`<div style="margin-bottom:10px"><div style="font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.8px;text-transform:uppercase;margin:0 0 5px 3px">${title}</div><div class="task-filter" id="${id}">${items.map(([k,l])=>`<button data-${attr}="${k}" class="${current===k?'on':''}">${l}</button>`).join('')}</div></div>`;

  let html=`<div class="banner"><h3>TASK BOARD</h3>
    <p>Use the three filters together: choose a work section, then priority, then Done/Not Done. For example, <b>Embedded + Urgent + Not Done</b> shows urgent tasks where Embedded work is required and still unchecked.</p></div>`;

  html+=buttonRow('Work section filter','taskWorkFilter',workButtons,workFilter,'twf');
  html+=buttonRow('Priority filter','taskPriorityFilter',priorityButtons,priorityFilter,'tpf');
  html+=buttonRow('Completion filter','taskStateFilter',stateButtons,stateFilter,'tsf');

  html+=`<div class="week-card" style="margin-bottom:14px">
    <div class="add-row">
      <input class="fin" id="taskInput" placeholder="New task…">
      <select id="taskTeam" style="flex:0 0 112px"><option value="gen">General</option><option value="sw">Software</option><option value="emb">Embedded</option><option value="mech">Mechanical</option><option value="elec">Electrical</option></select>
      <select id="taskPriority" style="flex:0 0 104px"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select>
    </div>
    <label style="display:block;font-family:var(--mono);font-size:10px;color:var(--txt3);text-transform:uppercase;margin-bottom:4px">Required work sections</label>
    ${workPicker('taskWork',['embedded','software','test'])}
    <button class="btn btn-save" id="taskAdd" style="width:100%">+ ADD TASK</button>
  </div>`;

  const all=tasks.map(normalizeTask).sort(taskSort);
  const priorityOk=t=>priorityFilter==='all'||normalizePriority(t.priority)===priorityFilter;
  const workOk=t=>workFilter==='all'||taskRequires(t,workFilter);
  const completionOk=t=>{
    if(workFilter!=='all' && stageFilters.includes(workFilter)){
      if(stateFilter==='done')return taskStageDone(t,workFilter);
      if(stateFilter==='notdone')return !taskStageDone(t,workFilter);
      return true;
    }
    if(stateFilter==='done')return taskPhase(t)==='done';
    if(stateFilter==='notdone')return taskPhase(t)!=='done';
    return true;
  };
  let vis=all.filter(t=>priorityOk(t)&&workOk(t)&&completionOk(t)).sort(taskSort);

  const workLabel=workFilter==='all'?'All work':TASK_STAGE_META[workFilter].label;
  const priorityLabelText=priorityFilter==='all'?'All priorities':priorityLabel(priorityFilter);
  const stateLabelText=stateFilter==='notdone'?'Not Done':stateFilter==='done'?'Done':'All states';
  html+=`<div class="cfgnote" style="margin:0 0 12px"><b>Active filters:</b> ${esc(workLabel)} / ${esc(priorityLabelText)} / ${esc(stateLabelText)} — <b>${vis.length}</b> result${vis.length===1?'':'s'}.</div>`;

  if(workFilter!=='all' && stageFilters.includes(workFilter)){
    const m=TASK_STAGE_META[workFilter];
    const stageUndone=vis.filter(t=>!taskStageDone(t,workFilter)).sort(taskSort);
    const stageDone=vis.filter(t=>taskStageDone(t,workFilter)).sort(taskSort);
    const renderStageGroup=(title,items,empty)=>{
      html+=`<div class="taskcol"><h3>${title} <span class="n">${items.length}</span></h3>`;
      if(!items.length)html+=`<div class="empty" style="padding:20px">${empty}</div>`;
      items.forEach(t=>html+=taskCard(t));
      html+=`</div>`;
    };
    if(stateFilter==='done'){
      renderStageGroup(`${esc(m.label.toUpperCase())} DONE`,stageDone,`No ${esc(m.label)} tasks done for this filter.`);
    }else if(stateFilter==='notdone'){
      renderStageGroup(`${esc(m.label.toUpperCase())} NOT DONE`,stageUndone,`No unchecked ${esc(m.label)} tasks for this filter.`);
    }else{
      renderStageGroup(`${esc(m.label.toUpperCase())} NOT DONE`,stageUndone,`No unchecked ${esc(m.label)} tasks for this filter.`);
      renderStageGroup(`${esc(m.label.toUpperCase())} DONE`,stageDone,`No ${esc(m.label)} tasks done for this filter.`);
    }
  }else{
    const open=vis.filter(t=>!t.done && taskPhase(t)==='open');
    const test=vis.filter(t=>!t.done && taskPhase(t)==='test');
    const done=vis.filter(t=>taskPhase(t)==='done');
    if(stateFilter!=='done'){
      html+=`<div class="taskcol"><h3>OPEN <span class="n">${open.length}</span></h3>`;
      if(!open.length)html+=`<div class="empty" style="padding:20px">No open tasks for this filter.</div>`;
      open.forEach(t=>html+=taskCard(t));
      html+=`</div>`;
      html+=`<div class="taskcol"><h3>TEST <span class="n">${test.length}</span></h3>`;
      if(!test.length)html+=`<div class="empty" style="padding:20px">No tasks waiting for test for this filter.</div>`;
      test.forEach(t=>html+=taskCard(t));
      html+=`</div>`;
    }
    if(stateFilter!=='notdone'){
      html+=`<div class="taskcol"><h3>DONE <span class="n">${done.length}</span></h3>`;
      if(!done.length)html+=`<div class="empty" style="padding:20px">No done tasks for this filter.</div>`;
      done.forEach(t=>html+=taskCard(t));
      html+=`</div>`;
    }
  }
  main.innerHTML=html;

  main.querySelectorAll('#taskWorkFilter button').forEach(b=>b.onclick=()=>{lsSave('viper_task_work_filter',b.dataset.twf);renderTasks();});
  main.querySelectorAll('#taskPriorityFilter button').forEach(b=>b.onclick=()=>{lsSave('viper_task_priority_filter',b.dataset.tpf);renderTasks();});
  main.querySelectorAll('#taskStateFilter button').forEach(b=>b.onclick=()=>{lsSave('viper_task_state_filter',b.dataset.tsf);renderTasks();});
  const teamSel=$('#taskTeam');
  if(teamSel)teamSel.onchange=()=>{
    const defaults=defaultRequiredStagesForTeam(teamSel.value);
    TASK_STAGE_ORDER.forEach(st=>{const cb=document.querySelector(`#taskWork input[value="${st}"]`);if(cb)cb.checked=defaults.includes(st);});
  };
  $('#taskAdd').onclick=async()=>{
    if(!myName){promptName();return;}
    const v=$('#taskInput').value.trim();if(!v){toast('Enter a task');return;}
    const requiredStages=readWorkPicker('taskWork');if(!requiredStages.length){toast('Select at least one work section');return;}
    const obj={id:'t'+Date.now()+Math.random().toString(36).slice(2,6),text:v,
      team:$('#taskTeam').value,requiredStages,priority:normalizePriority($('#taskPriority').value),
      done:false,status:'IN-PROGRESS',embeddedDone:false,softwareDone:false,mechanicalDone:false,electricalDone:false,testDone:false,progressNotes:'',
      embeddedDoneAt:null,softwareDoneAt:null,mechanicalDoneAt:null,electricalDoneAt:null,testDoneAt:null,
      idsAdded:false,defineName:makeDefineName({event:v}),failureCanId:'',correctiveCanId:'',by:myName,at:Date.now()};
    await addTask(obj);
    toast('Task added ✓');
  };
  $('#taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#taskAdd').click();});
  main.querySelectorAll('[data-toggle]').forEach(c=>c.onclick=(e)=>{e.stopPropagation();
    const t=tasks.find(x=>x.id===c.dataset.toggle);if(!t)return;
    updateTaskProgress(t.id,stagePatchForTask(t,!t.done));
  });
  main.querySelectorAll('[data-pdone]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const [id,k]=b.dataset.pdone.split('|');const t=tasks.find(x=>x.id===id);if(!t)return;
    const patch={};patch[k]=!t[k];updateTaskProgress(id,patch);
  });
  main.querySelectorAll('[data-addids]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();addIdsToTask(b.dataset.addids);});
  main.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(confirm('Delete this task?'))removeTask(b.dataset.tdel);});
  main.querySelectorAll('[data-tstatus]').forEach(sel=>sel.onchange=(e)=>{e.stopPropagation();setLinkedTaskStatus(sel.dataset.tstatus,sel.value);});
  main.querySelectorAll('[data-topen]').forEach(card=>card.onclick=()=>openTaskSheet(card.dataset.topen));
}

function taskCard(t){
  t=normalizeTask(t);
  const team=(['sw','emb','gen','mech','elec'].includes(t.team))?t.team:'gen';
  const lbl=team==='sw'?'SW':team==='emb'?'EMB':team==='mech'?'MECH':team==='elec'?'ELEC':'GEN';
  const pri=normalizePriority(t.priority);
  const f=t.failureId?failures.find(x=>x.id===t.failureId):null;
  const sp=f?splitEmb(f.embedded_ui):{emb:'',ui:''};
  const phase=taskPhase(t);
  const req=taskRequiredStages(t);
  const workTags=req.map(st=>{const m=TASK_STAGE_META[st];const done=taskStageDone(t,st);return `<span class="work-tag ${done?'done':'need'}">${m.short} ${done?'✓':'○'}</span>`;}).join('');
  const progress=req.map(st=>{const m=TASK_STAGE_META[st];const done=taskStageDone(t,st);return `<div class="pbar ${done?'done':''}" data-pdone="${esc(t.id)}|${m.flag}"><b>${esc(m.label.toUpperCase())} DONE</b><span>${done?'✓':'○'}</span></div>`;}).join('');
  return `<div class="taskcard ${t.done?'done':''} pri-${pri}" data-topen="${esc(t.id)}">
    <div class="tcheck" data-toggle="${esc(t.id)}">✓</div>
    <div class="tbody">
      <div class="tt">${esc(t.text)}</div>
      <div class="tmeta">
        <span class="pill ${esc(team)}">${lbl}</span>
        <span class="priority-pill ${pri}">${priorityLabel(pri)}</span>
        <span class="task-phase ${phase}">${taskPhaseLabel(t)}</span>
        ${t.failureId?`<select class="task-status" data-tstatus="${esc(t.id)}">${STATUSES.map(s=>`<option ${((t.status||'IN-PROGRESS')===s)?'selected':''}>${s}</option>`).join('')}</select>`:''}
        ${t.assignee?`<span class="who">👤 ${esc(t.assignee)}</span>`:''}
        <span class="who">${esc(t.by||'')}</span>
      </div>
      <div class="work-tags">${workTags}</div>
      <div class="task-progress">${progress}</div>
      ${t.idsAdded?`<div class="task-can"><span>${esc(t.defineName||'NO_NAME')}</span><span>FAIL: ${esc(t.failureCanId||'—')}</span><span>CORR: ${esc(t.correctiveCanId||'—')}</span></div>`:`<button class="id-add-btn" data-addids="${esc(t.id)}">+ ADD IDS TO DEFINE</button>`}
      ${f?`<details class="task-failure-data"><summary>LINKED FAILURE DATA · ${esc(f.category)} · ${esc(f.status)}</summary><div class="mini">
        ${f.cause?`<div><b>Cause</b>${esc(previewText(f.cause,260))}</div>`:''}
        ${f.effect?`<div><b>Effect</b>${esc(previewText(f.effect,260))}</div>`:''}
        ${f.corrective?`<div><b>Corrective</b>${esc(previewText(f.corrective,320))}</div>`:''}
        ${sp.emb?`<div><b>Embedded</b>${esc(previewText(sp.emb,220))}</div>`:''}
        ${sp.ui?`<div><b>UI / Software</b>${esc(previewText(sp.ui,220))}</div>`:''}
      </div></details>`:''}
      ${t.progressNotes?`<div class="task-notes">${esc(t.progressNotes)}</div>`:''}
    </div>
    <button class="tdel" data-tdel="${esc(t.id)}">✕</button>
  </div>`;
}

function openTaskSheet(id){
  const t=normalizeTask(tasks.find(x=>x.id===id));if(!t)return;
  const f=t.failureId?failures.find(x=>x.id===t.failureId):null;
  const sp=f?splitEmb(f.embedded_ui):{emb:'',ui:''};
  const fld=(l,v)=>`<div class="field"><label>${l}</label><div class="val ${v?'':'muted'}">${v?esc(v):'— not defined —'}</div></div>`;
  const req=taskRequiredStages(t);
  const doneCtrls=req.map(st=>{const m=TASK_STAGE_META[st];return `<div class="ctrl"><label>${esc(m.label)} Done</label><select id="td_${st}"><option value="false" ${!t[m.flag]?'selected':''}>No</option><option value="true" ${t[m.flag]?'selected':''}>Yes</option></select></div>`;}).join('');

      <div class="field"><label>DEFINE Name</label><input class="fin" id="tdDefine" value="${esc(t.defineName||makeDefineName(f||{event:t.text}))}" placeholder="ENGINE_FIRE"></div>
      <div class="idgrid">

       <button class="id-add-btn" id="tdAddIds">+ ADD IDS TO DEFINE</button>`;

  $('#sheetContent').innerHTML=`
    <div class="sh-head"><div class="top">
      <span class="cid">TASK</span><h2>${esc(t.text)}</h2>
      <button class="sh-close" id="shClose">✕</button></div></div>
    <div class="sh-body">
      ${f?`<div class="field"><label>Linked Failure</label><div class="val"><b>${esc(f.id)}</b> — ${esc(f.event)}<br><br><b>Category:</b> ${esc(f.category)}<br><b>Status:</b> ${esc(f.status)}</div></div>`:''}
      <div class="ctrlgrid">
        <div class="ctrl"><label>Assigned To</label><input class="fin" id="tdAssignee" value="${esc(t.assignee||'')}"></div>
        <div class="ctrl"><label>Priority</label><select id="tdPriority"><option value="urgent" ${normalizePriority(t.priority)==='urgent'?'selected':''}>Urgent</option><option value="high" ${normalizePriority(t.priority)==='high'?'selected':''}>High</option><option value="normal" ${normalizePriority(t.priority)==='normal'?'selected':''}>Normal</option><option value="low" ${normalizePriority(t.priority)==='low'?'selected':''}>Low</option></select></div>
        <div class="ctrl"><label>Team</label><select id="tdTeam"><option value="gen" ${t.team==='gen'?'selected':''}>General</option><option value="sw" ${t.team==='sw'?'selected':''}>Software</option><option value="emb" ${t.team==='emb'?'selected':''}>Embedded</option><option value="mech" ${t.team==='mech'?'selected':''}>Mechanical</option><option value="elec" ${t.team==='elec'?'selected':''}>Electrical</option></select></div>
      </div>
      <div class="field"><label>Required Work Sections</label>${workPicker('tdWork',req)}<div class="cfgnote" style="margin-top:0">Unchecked sections will disappear from the task card and will not be counted in weekly summaries.</div></div>
      <div class="ctrlgrid">${doneCtrls}</div>
      <div class="field"><label>Task Text</label><input class="fin" id="tdText" value="${esc(t.text||'')}"></div>
      <div class="field"><label>Progress Notes</label><textarea class="fin" id="tdNotes" placeholder="Write progress, blockers, next step…">${esc(t.progressNotes||'')}</textarea></div>
      ${idsBlock}
      ${f?`<div class="banner" style="margin-top:14px"><h3>FULL FAILURE DATA</h3><p>This is copied into the task details so you do not need to return to the Failures page.</p></div>
        ${fld('Cause',f.cause)}
        ${fld('Effect / Indications',f.effect)}
        ${fld('Corrective Action',f.corrective)}
        ${fld('Result',f.result)}
        ${fld('Embedded Behaviour',sp.emb)}
        ${fld('UI / Software Behaviour',sp.ui)}
        ${fld('If Actions Not Taken',f.ifnot)}
        ${fld('Notes',f.notes)}
        ${f.dev?fld('Developer Notes',f.dev):''}
        ${f.cust?fld('Customer Notes',f.cust):''}`:''}
      <div class="sh-actions">
        <button class="btn btn-cancel" id="tdCancel">CANCEL</button>
        <button class="btn btn-save" id="tdSave">SAVE TASK</button>
      </div>

  function preview(){
    if(!t.idsAdded || !$('#tdPreview'))return;
    const tmp={defineName:$('#tdDefine').value,failureCanId:$('#tdFailCan').value,correctiveCanId:$('#tdCorrCan').value};
    const dl=defineLinesForTask(tmp).lines.join('\n');
    $('#tdPreview').innerHTML=`<pre style="white-space:pre-wrap;margin:0;font-family:var(--mono);font-size:10px;color:var(--txt)">${esc(dl)}</pre>`;
  }
  if(t.idsAdded){['tdDefine','tdFailCan','tdCorrCan'].forEach(i=>$('#'+i).addEventListener('input',preview));preview();}
  $('#overlay').classList.add('open');$('#sheet').classList.add('open');
  $('#shClose').onclick=closeSheet;$('#tdCancel').onclick=closeSheet;
  if($('#tdAddIds'))$('#tdAddIds').onclick=async()=>{await addIdsToTask(id);closeSheet();};
  $('#tdSave').onclick=async()=>{
    if(!myName){promptName();return;}
    const requiredStages=readWorkPicker('tdWork');if(!requiredStages.length){toast('Select at least one required work section');return;}
    const patch={
      text:$('#tdText').value.trim()||t.text,
      assignee:$('#tdAssignee').value.trim(),
      priority:normalizePriority($('#tdPriority').value),
      team:$('#tdTeam').value,
      requiredStages,
      progressNotes:$('#tdNotes').value,
      updatedBy:myName,updatedAt:Date.now()
    };
    TASK_STAGE_ORDER.forEach(st=>{const m=TASK_STAGE_META[st];const el=$(`#td_${st}`);patch[m.flag]=el?el.value==='true':!!t[m.flag];});
    if(t.idsAdded){
      patch.idsAdded=true;
      patch.defineName=$('#tdDefine').value.trim();
      patch.failureCanId=$('#tdFailCan').value;
      patch.correctiveCanId=$('#tdCorrCan').value;
    }
    await updateTaskProgress(t.id,patch);
    closeSheet();toast(t.idsAdded?'Task and DEFINE saved ✓':'Task saved ✓');
  };
}

function sameMember(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();}
function memberActivityDetails(name){
  const member=String(name||'').trim();
  const now=new Date();
  const ws=weekStartSunday(now).getTime(), we=weekEndSaturday(new Date(ws)).getTime();
  const acts=[];
  const assignedTasks=tasks.map(normalizeTask).filter(t=>sameMember(t.assignee,member));
  const createdTasks=tasks.map(normalizeTask).filter(t=>sameMember(t.by,member));
  tasks.map(normalizeTask).forEach(t=>{
    if(sameMember(t.assignee,member))acts.push({kind:'task',at:t.at||0,title:'Assigned task',body:t.text,meta:`${priorityLabel(t.priority)} · ${taskPhaseLabel(t)} · ${taskRequiredStages(t).map(st=>TASK_STAGE_META[st].short).join('/')}`,taskId:t.id});
    if(sameMember(t.by,member))acts.push({kind:'task',at:t.at||0,title:'Created task',body:t.text,meta:`${priorityLabel(t.priority)} · ${taskPhaseLabel(t)}`,taskId:t.id});
    TASK_STAGE_ORDER.forEach(st=>{const m=TASK_STAGE_META[st];if(taskRequires(t,st)&&sameMember(t[m.by],member))acts.push({kind:'stage',at:t[m.at]||0,title:`${m.icon} ${m.label} done`,body:t.text,meta:`Completed by ${member}${t.assignee?` · Assigned to ${t.assignee}`:''}`,taskId:t.id});});
    if(sameMember(t.doneBy,member))acts.push({kind:'stage',at:t.doneAt||0,title:'Task fully done',body:t.text,meta:`All required work sections completed`,taskId:t.id});
  });
  community.map(normalizeCommunity).forEach(p=>{
    if(sameMember(p.by,member))acts.push({kind:p.type==='blocker'?'blocker':'community',at:p.at||0,title:`${communityTypeIcon(p.type)} ${communityTypeLabel(p.type)} posted`,body:p.title+(p.body?`\n${previewText(p.body,220)}`:''),meta:`${(p.team||'gen').toUpperCase()} · ${priorityLabel(p.priority)}${p.assignee?` · assigned to ${p.assignee}`:''}`,communityId:p.id});
    if(sameMember(p.assignee,member))acts.push({kind:p.type==='blocker'?'blocker':'community',at:p.at||0,title:'Assigned community item',body:p.title+(p.body?`\n${previewText(p.body,220)}`:''),meta:`${communityTypeLabel(p.type)} · ${p.done?'Closed':'Open'}${p.due?` · Due ${p.due}`:''}`,communityId:p.id});
    (p.replies||[]).forEach(r=>{if(sameMember(r.by,member))acts.push({kind:'reply',at:r.at||0,title:'Reply / status update',body:r.text||'',meta:`On: ${p.title||'Community post'}`,communityId:p.id});});
  });
  const completedStages=acts.filter(a=>a.kind==='stage' && a.title!=='Task fully done');
  const thisWeek=acts.filter(a=>(a.at||0)>=ws&&(a.at||0)<=we);
  const openAssigned=assignedTasks.filter(t=>!t.done);
  return {member,acts:acts.sort((a,b)=>(b.at||0)-(a.at||0)),assignedTasks,createdTasks,completedStages,thisWeek,openAssigned,doneAssigned:assignedTasks.filter(t=>t.done),communityPosts:community.filter(p=>sameMember(p.by,member)),replies:community.reduce((sum,p)=>sum+(p.replies||[]).filter(r=>sameMember(r.by,member)).length,0),weekStart:ws,weekEnd:we};
}
function memberActivityItem(a){
  const time=a.at?notifTime(a.at):'No time recorded';
  return `<div class="member-act ${esc(a.kind)}"><div class="member-act-title">${esc(a.title)}</div><div class="member-act-meta">${esc(time)} · ${esc(a.meta||'')}</div>${a.body?`<div class="member-act-body">${esc(a.body)}</div>`:''}<div class="member-act-actions">${a.taskId?`<button class="primary" data-ma-task="${esc(a.taskId)}">OPEN TASK</button>`:''}${a.communityId?`<button class="primary" data-ma-community="${esc(a.communityId)}">OPEN POST</button>`:''}</div></div>`;
}
function memberTaskMini(t){
  t=normalizeTask(t);const req=taskRequiredStages(t).map(st=>{const m=TASK_STAGE_META[st];return `${m.short}${taskStageDone(t,st)?'✓':'○'}`;}).join(' · ');

}

    <div class="member-section-title">Open assigned tasks</div><div class="member-act-list">${d.openAssigned.length?d.openAssigned.map(memberTaskMini).join(''):`<div class="empty" style="padding:14px">No open assigned tasks.</div>`}</div>
    <div class="member-section-title">Recent activity timeline</div><div class="member-act-list">${d.acts.length?d.acts.slice(0,80).map(memberActivityItem).join(''):`<div class="empty" style="padding:14px">No saved activity for this member yet.</div>`}</div>
  </div>`;
  $('#overlay').classList.add('open');$('#sheet').classList.add('open');
  $('#maClose').onclick=closeSheet;
  $('#sheetContent').querySelectorAll('[data-ma-task]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openTaskSheet(b.dataset.maTask);});
  $('#sheetContent').querySelectorAll('[data-ma-community]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openCommunitySheet(b.dataset.maCommunity);});
}

/* ---------- WEEKLY UPDATE VIEW ---------- */
function weekStartSunday(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d;}
function weekEndSaturday(start){const d=new Date(start);d.setDate(d.getDate()+6);d.setHours(23,59,59,999);return d;}
function fmtDate(d){return d.toLocaleDateString([], {month:'short',day:'2-digit',year:'numeric'});}
function getWeekOffset(){return Number(lsLoad('viper_week_offset',0)||0);}
function weeklyItems(start,end){return [...notifications].filter(n=>(n.at||0)>=start.getTime()&&(n.at||0)<=end.getTime()).sort((a,b)=>(a.at||0)-(b.at||0));}
const WEEK_STAGES=TASK_STAGE_META;
function inRange(ts,start,end){return !!ts && ts>=start.getTime() && ts<=end.getTime();}
function taskStageSummary(stage,start,end){
  const cfg=WEEK_STAGES[stage];
  const all=tasks.map(normalizeTask).filter(t=>taskRequires(t,stage));
  const done=all.filter(t=>!!t[cfg.flag]);
  const weekDone=all.filter(t=>inRange(t[cfg.at],start,end));
  const waiting=all.filter(t=>!t[cfg.flag]);
  return {cfg,total:all.length,done,doneCount:done.length,weekDone,weekCount:weekDone.length,waiting,waitingCount:waiting.length,pct:all.length?Math.round(done.length/all.length*100):0};
}
function weeklyTaskWorkDoneSummary(start,end){
  const stageData=TASK_STAGE_ORDER.map(stage=>Object.assign({stage},taskStageSummary(stage,start,end)));
  const total=stageData.reduce((sum,s)=>sum+s.weekCount,0);
  const completions=[];
  stageData.forEach(s=>{
    s.weekDone.forEach(t=>completions.push({
      stage:s.stage,cfg:s.cfg,task:t,at:t[s.cfg.at]||0,by:t[s.cfg.by]||t.by||'Team'
    }));
  });
  completions.sort((a,b)=>(b.at||0)-(a.at||0));
  return {stageData,total,completions};
}
function stageFormulaText(stageData){
  const parts=stageData.filter(s=>s.weekCount>0).map(s=>`${s.cfg.label} ${s.weekCount}`);
  return parts.length?parts.join(' + '):'No task work completed this week yet';
}
function openWeeklyDoneSheet(startMs,endMs){
  const start=new Date(startMs),end=new Date(endMs);
  const sum=weeklyTaskWorkDoneSummary(start,end);
  const formula=stageFormulaText(sum.stageData);
  $('#sheetContent').innerHTML=`<div class="sh-head"><div class="top"><span class="cid">WEEK</span><h2>Task Work Done This Week</h2><button class="sh-close" id="shClose">✕</button></div></div><div class="sh-body">
    <div class="banner"><h3>TOTAL TASK WORK DONE</h3><p>This total is calculated from every checked work section this week. Example: Embedded 5 + Software 4 = 9 total completed work items.</p></div>
    <div class="week-stage-grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
      <div class="week-stage-card" style="cursor:default"><div class="week-stage-title"><span>Total</span><span>${esc(fmtDate(start))}</span></div><div class="week-stage-big">${sum.total}</div><div class="week-stage-sub">${esc(formula)}</div></div>
      <div class="week-stage-card test" style="cursor:default"><div class="week-stage-title"><span>Sections</span><span>${TASK_STAGE_ORDER.length}</span></div><div class="week-stage-big">${sum.stageData.filter(s=>s.weekCount>0).length}</div><div class="week-stage-sub">sections updated this week</div></div>
    </div>
    <div class="banner"><h3>SECTION BREAKDOWN</h3><p>Press the section cards on the Weekly page for each individual section summary.</p></div>
    <div class="week-stage-grid" style="margin-bottom:14px">${sum.stageData.map(s=>`<div class="week-stage-card ${s.cfg.cls}" style="cursor:default"><div class="week-stage-title"><span>${s.cfg.icon} ${s.cfg.label}</span><span>${s.weekCount}</span></div><div class="week-stage-big">${s.weekCount}</div><div class="week-stage-sub">done this week · ${s.doneCount}/${s.total} total done</div></div>`).join('')}</div>
    <div class="banner"><h3>COMPLETION LOG</h3><p>Every Embedded, Software, Mechanical, Electrical, or Test checkbox completed in this week.</p></div>
    <div class="task-summary-list">${sum.completions.length?sum.completions.map(x=>`<div class="task-summary-item"><div class="name">${x.cfg.icon} ${esc(x.cfg.label)} Done — ${esc(x.task.text||'Task')}</div><div class="meta"><span>${esc(priorityLabel(x.task.priority))}</span><span>${esc(taskPhaseLabel(x.task))}</span><span>👤 ${esc(x.task.assignee||'Unassigned')}</span><span>${esc(notifTime(x.at))}</span><span>By: ${esc(x.by||'Team')}</span></div></div>`).join(''):`<div class="empty" style="padding:16px">No task work completed during this selected week.</div>`}</div>
  </div>`;
  $('#overlay').classList.add('open');$('#sheet').classList.add('open');$('#shClose').onclick=closeSheet;
}
function stageCard(stage,start,end){
  const s=taskStageSummary(stage,start,end), c=s.cfg;

    <div class="week-stage-title"><span>${c.icon} ${c.label} Section</span><span>${s.pct}%</span></div>

function taskSummaryItem(t,stage){
  const cfg=WEEK_STAGES[stage];const pri=priorityLabel(t.priority);const ass=t.assignee||'Unassigned';const by=t[cfg.by]||t.by||'Team';
  return `<div class="task-summary-item"><div class="name">${esc(t.text||'Task')}</div><div class="meta"><span>${esc(pri)}</span><span>${esc(taskPhaseLabel(t))}</span><span>👤 ${esc(ass)}</span>${t[cfg.at]?`<span>${esc(cfg.label)}: ${notifTime(t[cfg.at])}</span>`:''}<span>By: ${esc(by)}</span></div></div>`;
}
function openWeeklyStageSheet(stage,startMs,endMs){
  const start=new Date(startMs),end=new Date(endMs);const s=taskStageSummary(stage,start,end), c=s.cfg;
  const doneList=s.done.sort(taskSort), weekList=s.weekDone.sort((a,b)=>(b[c.at]||0)-(a[c.at]||0)), waitList=s.waiting.sort(taskSort);
  $('#sheetContent').innerHTML=`<div class="sh-head"><div class="top"><span class="cid">${esc(c.label.toUpperCase())}</span><h2>${esc(c.label)} Task Summary</h2><button class="sh-close" id="shClose">✕</button></div></div><div class="sh-body">

      <div class="week-stage-card ${c.cls}" style="cursor:default"><div class="week-stage-title"><span>This week</span><span>${esc(fmtDate(start))}</span></div><div class="week-stage-big">${s.weekCount}</div><div class="week-stage-sub">Finished between Sunday and Saturday</div></div>
    </div>
    <div class="banner"><h3>DONE THIS WEEK</h3><p>Tasks marked as ${esc(c.label)} Done during this selected week.</p></div>
    <div class="task-summary-list">${weekList.length?weekList.map(t=>taskSummaryItem(t,stage)).join(''):`<div class="empty" style="padding:16px">No ${esc(c.label)} tasks finished this week.</div>`}</div>
    <div class="banner" style="margin-top:14px"><h3>STILL OPEN / NEEDED</h3><p>Tasks that still need ${esc(c.label)} work.</p></div>
    <div class="task-summary-list">${waitList.length?waitList.map(t=>taskSummaryItem(t,stage)).join(''):`<div class="empty" style="padding:16px">No pending ${esc(c.label)} tasks.</div>`}</div>
    <div class="banner" style="margin-top:14px"><h3>ALL ${esc(c.label.toUpperCase())} COMPLETED</h3><p>Complete list used for the ${s.doneCount}/${s.total} counter.</p></div>
    <div class="task-summary-list">${doneList.length?doneList.map(t=>taskSummaryItem(t,stage)).join(''):`<div class="empty" style="padding:16px">No completed ${esc(c.label)} tasks yet.</div>`}</div>
  </div>`;
  $('#overlay').classList.add('open');$('#sheet').classList.add('open');$('#shClose').onclick=closeSheet;
}
function renderWeekly(){
  const offset=getWeekOffset();
  const now=new Date();
  const start=weekStartSunday(now);start.setDate(start.getDate()+(offset*7));
  const end=weekEndSaturday(start);
  const items=weeklyItems(start,end);
  const byType=items.reduce((a,n)=>{const k=n.type||'update';a[k]=(a[k]||0)+1;return a;},{});
  const openNeeds=needs.filter(n=>!n.done).length;
  const allTasks=tasks.map(normalizeTask);
  const waitingForTest=allTasks.filter(t=>taskRequires(t,'test')&&taskPhase(t)==='test').length;
  const urgentOpen=allTasks.filter(t=>!t.done && normalizePriority(t.priority)==='urgent').length;
  const unassignedOpen=allTasks.filter(t=>!t.done && !String(t.assignee||'').trim()).length;
  const weekWork=weeklyTaskWorkDoneSummary(start,end);
  const doneThisWeek=weekWork.total;
  let html=`<div class="banner"><h3>WEEKLY UPDATE</h3><p>Automatic team log from <b>Sunday to Saturday</b>. It now includes task-stage completion for Embedded, Software, Mechanical, Electrical, and Test.</p></div>`;
  html+=`<div class="week-nav"><button id="wkPrev">◀ PREVIOUS WEEK</button><button id="wkThis">THIS WEEK</button><button id="wkNext">NEXT WEEK ▶</button></div>`;
  html+=`<div class="week-card"><div class="week-head"><h3>WEEK SUMMARY</h3><span class="week-range">${esc(fmtDate(start))} → ${esc(fmtDate(end))}</span></div>
    <div class="statgrid" style="margin-bottom:0">
      <div class="scard amber"><div class="big">${items.length}</div><div class="lbl">Updates</div></div>
      <div class="scard blue"><div class="big">${byType.task||0}</div><div class="lbl">Task changes</div></div>
      <div class="scard green" id="wkDoneTotal" style="cursor:pointer"><div class="big">${doneThisWeek}</div><div class="lbl">Task work done this week</div></div>
      <div class="scard grey"><div class="big">${openNeeds}</div><div class="lbl">Open needs</div></div>
    </div></div>`;
  html+=`<div class="week-card"><div class="week-head"><h3>TASK STAGE SUMMARY</h3><span class="week-range">Click any section</span></div>
    <div class="week-stage-grid">${TASK_STAGE_ORDER.map(st=>stageCard(st,start,end)).join('')}</div>
    <div class="week-insights"><div class="week-insight"><b>${waitingForTest}</b><span>Waiting for test</span></div><div class="week-insight"><b>${urgentOpen}</b><span>Urgent open tasks</span></div><div class="week-insight"><b>${unassignedOpen}</b><span>Open without assignee</span></div><div class="week-insight"><b>${allTasks.filter(t=>!t.done).length}</b><span>Total open tasks</span></div></div>
  </div>`;
  html+=`<div class="week-card"><div class="week-head"><h3>FAILURE PROGRESS NOW</h3><span class="week-range">Current status</span></div>
    <div class="statgrid" style="margin-bottom:0">
      <div class="scard green"><div class="big">${failures.filter(f=>f.status==='DONE').length}</div><div class="lbl">Done</div></div>
      <div class="scard amber"><div class="big">${failures.filter(f=>f.status==='IN-PROGRESS').length}</div><div class="lbl">In progress</div></div>
      <div class="scard blue"><div class="big">${failures.filter(f=>f.status==='DEFINED').length}</div><div class="lbl">Defined</div></div>
      <div class="scard grey"><div class="big">${failures.filter(f=>f.status==='NOT YET STARTED').length}</div><div class="lbl">Not started</div></div>
    </div></div>`;
  html+=`<div class="week-card"><div class="week-head"><h3>CHANGE LOG</h3><span class="week-range">${items.length} item(s)</span></div>`;
  if(!items.length){html+=`<div class="empty" style="padding:25px 10px">No updates recorded for this week yet.</div>`;}
  else html+=`<div class="timeline">${items.map(n=>`<div class="tline ${esc(n.type||'update')}"><div class="tl-title">${esc(n.title||'Update')}</div><div class="tl-msg">${esc(n.message||'')}</div><div class="tl-meta">${esc(n.by||'Team')} • ${notifTime(n.at)}</div></div>`).join('')}</div>`;
  html+=`</div><button class="btn btn-edit" id="wkCopy" style="width:100%;margin-top:4px">COPY WEEKLY REPORT</button>`;
  main.innerHTML=html;
  $('#wkPrev').onclick=()=>{lsSave('viper_week_offset',offset-1);renderWeekly();};
  $('#wkThis').onclick=()=>{lsSave('viper_week_offset',0);renderWeekly();};
  $('#wkNext').onclick=()=>{lsSave('viper_week_offset',offset+1);renderWeekly();};
  main.querySelectorAll('[data-wstage]').forEach(c=>c.onclick=()=>openWeeklyStageSheet(c.dataset.wstage,start.getTime(),end.getTime()));
  const wkDoneCard=$('#wkDoneTotal');
  if(wkDoneCard)wkDoneCard.onclick=()=>openWeeklyDoneSheet(start.getTime(),end.getTime());
  $('#wkCopy').onclick=async()=>{
    const stageLines=TASK_STAGE_ORDER.map(st=>{const s=taskStageSummary(st,start,end),m=TASK_STAGE_META[st];return `${m.label}: ${s.doneCount}/${s.total} (${s.weekCount} this week)`;});
    const formula=stageFormulaText(weekWork.stageData);

  };
}

/* ---------- NEEDS / PURCHASE VIEW ---------- */
async function addNeed(obj){
  if(useLocal){needs.unshift(obj);persistLocal();render();}
  else{await setDoc(doc(needsCol,obj.id),obj);}
  await addNotification('Need added',`${obj.item}${obj.qty?`\nQty: ${obj.qty}`:''}${obj.notes?`\n${obj.notes}`:''}`,'need');
}
async function updateNeed(id,patch){
  const n=needs.find(x=>x.id===id);const oldDone=n?!!n.done:false;if(n)Object.assign(n,patch);
  if(useLocal){persistLocal();render();}
  else{await updateDoc(doc(needsCol,n._docid||id),patch);}
  await addNotification(patch.done&&!oldDone?'Need purchased':'Need updated',`${n?n.item:id}`,'need');
}
async function removeNeed(id){
  const n=needs.find(x=>x.id===id);
  if(useLocal){needs=needs.filter(x=>x.id!==id);persistLocal();render();}
  else{await deleteDoc(doc(needsCol,n._docid||id));}
  await addNotification('Need deleted',n?n.item:id,'need');
}
function renderNeeds(){
  let html=`<div class="banner"><h3>NEEDS / PURCHASE LIST</h3><p>Add anything the team needs to purchase or prepare. Mark it as purchased when done; every change is added to notifications and weekly update.</p></div>`;
  html+=`<div class="week-card">
    <div class="add-row"><input class="fin" id="needItem" placeholder="Item needed…"><input class="fin" id="needQty" placeholder="Qty" style="flex:0 0 72px"></div>

    <div class="add-row"><select id="needPriority" class="fin"><option value="normal">Normal</option><option value="high">High priority</option></select><button class="btn btn-save" id="needAdd" style="flex:0 0 120px">+ ADD</button></div>
  </div>`;
  const open=needs.filter(n=>!n.done), done=needs.filter(n=>n.done);

  if(!open.length)html+=`<div class="empty" style="padding:20px">No open purchase needs.</div>`;
  open.forEach(n=>html+=needCard(n));
  html+=`</div>`;
  if(done.length){html+=`<div class="taskcol"><h3>PURCHASED <span class="n">${done.length}</span></h3>`;done.forEach(n=>html+=needCard(n));html+=`</div>`;}
  main.innerHTML=html;
  $('#needAdd').onclick=async()=>{

    toast('Need added ✓');
  };
  main.querySelectorAll('[data-needdone]').forEach(b=>b.onclick=async(e)=>{e.stopPropagation();const n=needs.find(x=>x.id===b.dataset.needdone);if(n)await updateNeed(n.id,{done:!n.done,updatedBy:myName,updatedAt:Date.now()});});
  main.querySelectorAll('[data-needdel]').forEach(b=>b.onclick=async(e)=>{e.stopPropagation();if(confirm('Delete this need?'))await removeNeed(b.dataset.needdel);});
  main.querySelectorAll('[data-needopen]').forEach(c=>c.onclick=()=>openNeedSheet(c.dataset.needopen));
}
function needCard(n){return `<div class="need-card ${n.done?'done':''}" data-needopen="${esc(n.id)}"><div class="need-top"><div class="tcheck" data-needdone="${esc(n.id)}">✓</div><div class="need-body"><div class="need-title">${esc(n.item)}</div>${n.notes?`<div class="need-notes">${esc(n.notes)}</div>`:''}<div class="need-meta"><span class="need-pill ${n.priority==='high'?'high':''}">${n.priority==='high'?'HIGH':'NORMAL'}</span>${n.qty?`<span class="need-pill">QTY: ${esc(n.qty)}</span>`:''}<span class="need-pill ${n.done?'done':''}">${n.done?'PURCHASED':'OPEN'}</span><span class="need-pill">${esc(n.by||'Team')}</span></div></div><button class="tdel" data-needdel="${esc(n.id)}">✕</button></div></div>`;}

  let html=`<div class="statgrid">
    <div class="scard green"><div class="big">${c.DONE||0}</div><div class="lbl">Done</div></div>
    <div class="scard amber"><div class="big">${c['IN-PROGRESS']||0}</div><div class="lbl">In Progress</div></div>
    <div class="scard blue"><div class="big">${c.DEFINED||0}</div><div class="lbl">Defined</div></div>
    <div class="scard grey"><div class="big">${c['NOT YET STARTED']||0}</div><div class="lbl">Not Started</div></div>
  </div>`;

  html+=`<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--txt2);margin:8px 0 12px">PROGRESS BY CATEGORY</h3>`;
  CATEGORIES.forEach(cat=>{
    const items=failures.filter(f=>f.category===cat);if(!items.length)return;
    const d=items.filter(f=>f.status==='DONE').length;
    const p=items.filter(f=>f.status==='IN-PROGRESS').length;
    const df=items.filter(f=>f.status==='DEFINED').length;
    const n=items.length;
    html+=`<div class="catbar">
      <div class="ctop"><span style="color:${CAT_COLOR[cat]}">${cat}</span>
        <span class="cn">${d}/${n} done</span></div>
      <div class="cseg">
        <i style="width:${d/n*100}%;background:var(--green)"></i>
        <i style="width:${p/n*100}%;background:var(--amber)"></i>
        <i style="width:${df/n*100}%;background:var(--blue)"></i>
      </div>
    </div>`;
  });

  // team split
  const sw=failures.filter(f=>teamOf(f)==='sw').length;
  const emb=failures.filter(f=>teamOf(f)==='emb').length;
  const both=failures.filter(f=>teamOf(f)==='both').length;
  html+=`<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--txt2);margin:20px 0 12px">WORK SPLIT</h3>
   <div class="statgrid">
    <div class="scard blue"><div class="big">${sw}</div><div class="lbl">Software only</div></div>
    <div class="scard" style="--c:#b58cff"><div class="big" style="color:#b58cff">${emb}</div><div class="lbl">Embedded only</div></div>
    <div class="scard green"><div class="big">${both}</div><div class="lbl">Both teams</div></div>
    <div class="scard amber"><div class="big">${tasks.filter(t=>!t.done).length}</div><div class="lbl">Open tasks</div></div>
   </div>`;
  main.innerHTML=html;
}

/* ---------- DEFINE VIEW ---------- */
function renderDefine(){
  const lines=(defineText||DEFAULT_DEFINE).split('\n').length;
  main.innerHTML=`
  <div class="banner"><h3>SHARED DEFINE FILE</h3>
    <p>Edit the shared <b>define.h</b> content here. In live Firebase mode, everyone will see the latest saved version. In local mode, it is saved only on this device/browser.</p></div>
  <div class="cfgnote" style="margin-top:0;margin-bottom:10px"><b>${lines}</b> lines loaded · source: <b>${useLocal?'local browser':'shared Firebase'}</b></div>
  <textarea class="fin" id="defineBox" spellcheck="false" style="width:100%;min-height:58vh;font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre;overflow:auto;resize:vertical;">${esc(defineText||DEFAULT_DEFINE)}</textarea>
  <div class="sh-actions" style="margin-top:10px">
    <button class="btn btn-cancel" id="defReset">RESET DEFAULT</button>
    <button class="btn btn-edit" id="defCopy">COPY</button>
    <button class="btn btn-save" id="defSave">SAVE DEFINE</button>
  </div>`;
  $('#defSave').onclick=async()=>{
    if(!myName){promptName();return;}
    await saveDefine($('#defineBox').value);
    toast('Define saved ✓');
    renderDefine();
  };
  $('#defCopy').onclick=async()=>{
    try{await navigator.clipboard.writeText($('#defineBox').value);toast('Copied ✓');}
    catch{toast('Copy not available');}
  };
  $('#defReset').onclick=async()=>{
    if(confirm('Reset define.h to the default content in this file?')){
      await saveDefine(DEFAULT_DEFINE);toast('Define reset ✓');renderDefine();
    }
  };
}

/* ---------- SETUP VIEW ---------- */
function renderSetup(){
  const chips=normalizeMemberList(teamMembers).map(n=>`<span class="member-chip">${esc(n)} <button data-rmmember="${esc(n)}">✕</button></span>`).join('');
  main.innerHTML=`
  <div class="banner"><h3>YOUR NAME</h3>
    <p>Shown on edits & tasks so the team knows who changed what. Press Save to also add this name to the saved team members list.</p></div>
  <div class="add-row"><input class="fin" id="nameInput" value="${esc(myName)}" placeholder="e.g. Mustafa"></div>
  <button class="btn btn-save" id="nameSave" style="margin-bottom:18px">SAVE NAME</button>

  <div class="banner"><h3>SAVED TEAM MEMBERS</h3>
    <p>Community member cards and assignment lists now show only these saved names, not names guessed from old tasks or notifications.</p></div>
  <div class="member-list-edit">${chips||'<span class="member-chip">No saved members yet</span>'}</div>
  <div class="member-manage"><input class="fin" id="memberInput" placeholder="Add member name"><button class="btn btn-edit" id="memberAdd" style="flex:0 0 120px">+ MEMBER</button></div>

  <div class="banner" style="margin-top:22px"><h3>CONNECT SHARED DATABASE</h3>
    <p>Right now this app is <b>${useLocal?'LOCAL ONLY':'LIVE & SYNCED'}</b>.
    To let the whole team share one live database (free), follow the steps below once, then re-open the app.</p></div>

  <div class="cfgnote">
<b>STEP 1.</b> Go to console.firebase.google.com → Add project (free Spark plan).<br><br>
<b>STEP 2.</b> Build → Firestore Database → Create database → Start in <b>test mode</b>.<br><br>
<b>STEP 3.</b> Project settings (⚙) → "Your apps" → Web app (&lt;/&gt;) → register → copy the <b>firebaseConfig</b> object.<br><br>
<b>STEP 4.</b> Open this HTML file in a text editor. Find the line:<br>
&nbsp;&nbsp;<b>const firebaseConfig = window.FIREBASE_CONFIG || {</b><br>
Replace the PASTE_HERE values with your real config keys. Save.<br><br>
<b>STEP 5.</b> Host the file once (free): Netlify Drop (just drag the file to app.netlify.com/drop) or GitHub Pages. Share the link with the team. Everyone adds it to their phone home screen.<br><br>
<b>STEP 6.</b> First load auto-fills all ${SEED_DATA.length} failures into Firestore. After that every edit syncs live to everyone.<br><br>
<b>SECURITY:</b> test mode is open for 30 days. To lock it: (1) in Firebase enable <b>Authentication → Sign-in method → Anonymous</b>; (2) in Firestore → <b>Rules</b> paste the locked rules; (3) set your <b>TEAM_PASSWORD</b> near the top of this file. Then only signed-in teammates who know the password can read/write.
  </div>

  <div class="cfgnote" style="margin-top:14px">
<b>EXPORT BACKUP</b> — download the current data as JSON anytime.<br><br>
<button class="btn btn-edit" id="expBtn" style="width:100%">⬇ EXPORT JSON BACKUP</button>
  </div>
  <div class="who-tag" style="margin-top:20px">VIPER Failures Tracker · ${SEED_DATA.length} procedures loaded</div>`;
  $('#nameSave').onclick=async()=>{myName=$('#nameInput').value.trim();localStorage.setItem('viper_name',myName);if(myName)await addTeamMemberName(myName);toast('Name saved ✓');};
  $('#memberAdd').onclick=async()=>{await addTeamMemberName($('#memberInput').value);};
  $('#memberInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#memberAdd').click();});
  main.querySelectorAll('[data-rmmember]').forEach(b=>b.onclick=()=>removeTeamMemberName(b.dataset.rmmember));
  $('#expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify({failures,tasks,needs,community,teamMembers,notifications,defineText},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='viper_failures_backup.json';a.click();
  };
}

function promptName(){
  view='setup';switchTab('setup');render();
  toast('Set your name first');
}

/* ---------- TAB SWITCH ---------- */
function switchTab(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{switchTab(t.dataset.view);render();});
$('#fab').onclick=openAdd;
$('#overlay').onclick=closeSheet;

/* expose for inline */
window.__viper={openSheet,closeSheet};

/* ---------- PASSWORD GATE ---------- */
function startApp(){ document.getElementById('lockScreen').style.display='none'; if($('#notifyBtn'))$('#notifyBtn').onclick=openNotifications;
if($('#notifyClear'))$('#notifyClear').onclick=()=>{notifReadAt=Date.now();localStorage.setItem('viper_notif_read_at',String(notifReadAt));renderNotifications();};
document.addEventListener('click',e=>{const p=$('#notifyPanel'),b=$('#notifyBtn');if(p&&b&&p.classList.contains('open')&&!p.contains(e.target)&&e.target!==b&&!b.contains(e.target))p.classList.remove('open');});
initData(); }
function showLock(){
  const ls=document.getElementById('lockScreen');
  ls.style.display='flex';
  const inp=document.getElementById('lockInput');
  const btn=document.getElementById('lockBtn');
  const err=document.getElementById('lockErr');
  function tryUnlock(){
    if(inp.value===TEAM_PASSWORD){
      localStorage.setItem('viper_unlocked','1');
      startApp();
    }else{
      err.textContent='Wrong password';
      inp.value='';inp.focus();
    }
  }
  btn.onclick=tryUnlock;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
  inp.focus();
}

if(localStorage.getItem('viper_unlocked')==='1'){
  startApp();
}else{
  showLock();
}

</script>
