<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F-16 Failures">
<title>F-16 Failures Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0e141d; --panel:#121a24; --panel2:#172230;
  --line:#1f2d3d; --line2:#2a3c50;
  --txt:#e6edf3; --txt2:#8b9bb0; --txt3:#5d6e82;
  --amber:#ffb000; --amber-dim:#7a5400;
  --green:#39d98a; --green-dim:#1a4d34;
  --blue:#4aa8ff; --blue-dim:#1a3a5c;
  --red:#ff5c5c; --red-dim:#5c1f1f;
  --purple:#b58cff;
  --grey:#5d6e82;
  --radius:14px;
  --mono:'JetBrains Mono',monospace;
  --disp:'Chakra Petch',sans-serif;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 0%,#10202e 0,transparent 45%),
    radial-gradient(circle at 90% 100%,#1a1407 0,transparent 40%);
  color:var(--txt);font-family:var(--disp);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

/* ---- Header ---- */
header{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--sat) + 12px) 16px 10px;
  background:linear-gradient(180deg,rgba(10,14,20,.97),rgba(10,14,20,.85));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:10px;}
.logo{
  font-weight:700;font-size:17px;letter-spacing:1.5px;display:flex;align-items:center;gap:8px;
}
.logo b{color:var(--amber);}
.logo .tag{font-family:var(--mono);font-size:9px;color:var(--txt3);
  border:1px solid var(--line2);padding:2px 6px;border-radius:6px;letter-spacing:1px;}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--txt2);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey);box-shadow:0 0 0 0 rgba(57,217,138,.6);}
.dot.on{background:var(--green);animation:pulse 2s infinite;}
.dot.off{background:var(--red);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,217,138,.5);}70%{box-shadow:0 0 0 7px rgba(57,217,138,0);}100%{box-shadow:0 0 0 0 rgba(57,217,138,0);}}

/* progress bar */
.prog{margin-top:12px;}
.prog-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt2);margin-bottom:5px;}
.prog-top .pct{color:var(--amber);font-weight:700;}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex;}
.bar i{height:100%;display:block;transition:width .6s cubic-bezier(.4,0,.2,1);}
.bar .b-done{background:var(--green);}
.bar .b-prog{background:var(--amber);}
.bar .b-def{background:var(--blue);}

/* ---- Tabs ---- */
.tabs{display:flex;gap:0;position:sticky;top:0;z-index:30;
  background:var(--bg2);border-bottom:1px solid var(--line);}
.tab{flex:1;text-align:center;padding:13px 4px;font-family:var(--mono);
  font-size:11px;letter-spacing:.5px;color:var(--txt3);border:none;background:none;
  position:relative;cursor:pointer;font-weight:500;}
.tab.active{color:var(--amber);}
.tab.active::after{content:'';position:absolute;left:18%;right:18%;bottom:0;height:2px;
  background:var(--amber);border-radius:2px;}
.tab .ic{display:block;font-size:16px;margin-bottom:3px;}

main{flex:1;padding:14px 14px calc(var(--sab) + 90px);}

/* ---- Filters ---- */
.search{position:relative;margin-bottom:12px;}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px 12px 38px;color:var(--txt);
  font-family:var(--disp);font-size:14px;outline:none;}
.search input:focus{border-color:var(--amber-dim);}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:15px;}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;
  scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1px solid var(--line2);
  background:var(--panel);color:var(--txt2);font-family:var(--mono);font-size:11px;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:500;}
.chip.active{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700;}
.chip .ct{opacity:.7;font-size:10px;}
.chip.active .ct{opacity:.85;}

.statrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none;}
.statrow::-webkit-scrollbar{display:none;}
.sfilter{flex:0 0 auto;padding:6px 11px;border-radius:8px;font-family:var(--mono);font-size:10px;
  border:1px solid var(--line2);background:transparent;color:var(--txt2);cursor:pointer;display:flex;gap:6px;align-items:center;}
.sfilter.active{border-width:1.5px;font-weight:700;}
.sfilter.active[data-s="all"]{color:var(--txt);border-color:var(--txt2);}
.sfilter.active[data-s="DONE"]{color:var(--green);border-color:var(--green);}
.sfilter.active[data-s="IN-PROGRESS"]{color:var(--amber);border-color:var(--amber);}
.sfilter.active[data-s="DEFINED"]{color:var(--blue);border-color:var(--blue);}
.sfilter.active[data-s="NOT YET STARTED"]{color:var(--txt3);border-color:var(--grey);}

/* ---- Cards ---- */
.list{display:flex;flex-direction:column;gap:9px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .2s,transform .08s;}
.card:active{transform:scale(.992);}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grey);}
.card.s-DONE::before{background:var(--green);}
.card.s-IN-PROGRESS::before{background:var(--amber);}
.card.s-DEFINED::before{background:var(--blue);}
.card.s-NOTYET::before{background:var(--grey);}
.chead{display:flex;align-items:flex-start;gap:9px;}
.cid{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:700;
  background:var(--bg);border:1px solid var(--line2);padding:3px 7px;border-radius:7px;flex:0 0 auto;margin-top:1px;}
.cev{font-size:14.5px;font-weight:600;line-height:1.3;flex:1;}
.cmeta{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;}
.badge{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.3px;}
.b-cat{background:var(--panel2);color:var(--txt2);border:1px solid var(--line2);}
.b-st{border:1px solid;}
.b-st.DONE{color:var(--green);border-color:var(--green-dim);background:rgba(57,217,138,.08);}
.b-st.INPROG{color:var(--amber);border-color:var(--amber-dim);background:rgba(255,176,0,.08);}
.b-st.DEFINED{color:var(--blue);border-color:var(--blue-dim);background:rgba(74,168,255,.08);}
.b-st.NOTYET{color:var(--txt3);border-color:var(--line2);background:transparent;}
.b-team{margin-left:auto;font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:6px;}
.b-team.sw{color:var(--blue);background:rgba(74,168,255,.1);}
.b-team.emb{color:var(--purple);background:rgba(181,140,255,.1);}
.b-team.both{color:var(--green);background:rgba(57,217,138,.1);}

.empty{text-align:center;color:var(--txt3);padding:50px 20px;font-family:var(--mono);font-size:13px;}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.5;}

/* ---- Suggestion / easy section ---- */
.banner{background:linear-gradient(135deg,rgba(255,176,0,.1),rgba(74,168,255,.06));
  border:1px solid var(--amber-dim);border-radius:var(--radius);padding:13px 14px;margin-bottom:14px;}
.banner h3{margin:0 0 4px;font-size:13px;color:var(--amber);font-family:var(--mono);letter-spacing:.5px;}
.banner p{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.4;}

/* ---- Detail Sheet ---- */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(4,7,11,.7);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:760px;margin:0 auto;
  background:var(--bg2);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.sheet.open{transform:translateY(0);}
.grab{width:42px;height:4px;background:var(--line2);border-radius:3px;margin:9px auto 4px;flex:0 0 auto;}
.sh-head{padding:6px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.sh-head .top{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.sh-head .cid{font-size:12px;}
.sh-head h2{margin:0;font-size:19px;font-weight:700;line-height:1.25;flex:1;}
.sh-close{background:var(--panel);border:1px solid var(--line2);color:var(--txt2);
  width:32px;height:32px;border-radius:9px;font-size:18px;cursor:pointer;flex:0 0 auto;}
.sh-body{overflow-y:auto;padding:16px 18px calc(var(--sab) + 24px);flex:1;
  -webkit-overflow-scrolling:touch;}
.field{margin-bottom:18px;}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  color:var(--txt3);text-transform:uppercase;margin-bottom:7px;}
.field .val{font-size:14px;line-height:1.55;color:var(--txt);white-space:pre-wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;}
.field .val.muted{color:var(--txt3);font-style:italic;}
.emb-split .val{font-family:var(--mono);font-size:12.5px;}

/* control row in sheet */
.ctrlgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;}
.ctrl label{font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--txt3);text-transform:uppercase;display:block;margin-bottom:6px;}
select,input.fin,textarea.fin{width:100%;background:var(--bg);border:1px solid var(--line2);
  border-radius:8px;padding:9px 10px;color:var(--txt);font-family:var(--disp);font-size:13px;outline:none;}
select:focus,input.fin:focus,textarea.fin:focus{border-color:var(--amber-dim);}
textarea.fin{resize:vertical;min-height:80px;line-height:1.5;font-size:13px;}

.sh-actions{display:flex;gap:9px;padding-top:4px;}
.btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:var(--mono);font-size:12px;
  font-weight:700;letter-spacing:.5px;cursor:pointer;}
.btn-edit{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);}
.btn-save{background:var(--amber);color:#1a1200;}
.btn-del{background:rgba(255,92,92,.08);color:var(--red);border:1px solid var(--red-dim);flex:0 0 auto;width:54px;}
.btn-cancel{background:transparent;color:var(--txt2);border:1px solid var(--line2);}

/* ---- FAB ---- */
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 80px);z-index:50;
  width:56px;height:56px;border-radius:18px;background:var(--amber);color:#1a1200;
  border:none;font-size:28px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,176,0,.35);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(.94);}

/* ---- Tasks ---- */
.taskcol{margin-bottom:22px;}
.taskcol h3{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--txt2);
  margin:0 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.taskcol h3 .n{background:var(--panel2);color:var(--txt3);padding:2px 7px;border-radius:6px;font-size:10px;}
.taskcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.tcheck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;}
.taskcard.done .tcheck{background:var(--green);border-color:var(--green);color:#04140c;}
.taskcard.done .tt{text-decoration:line-through;color:var(--txt3);}
.tbody{flex:1;min-width:0;}
.tt{font-size:14px;font-weight:500;line-height:1.35;word-break:break-word;}
.tmeta{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;align-items:center;}
.tmeta .who{font-family:var(--mono);font-size:9.5px;color:var(--txt3);}
.tmeta .pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:5px;}
.tmeta .pill.sw{color:var(--blue);background:rgba(74,168,255,.1);}
.tmeta .pill.emb{color:var(--purple);background:rgba(181,140,255,.1);}
.tmeta .pill.gen{color:var(--txt2);background:var(--panel2);}
.tdel{background:none;border:none;color:var(--txt3);font-size:15px;cursor:pointer;padding:2px 4px;flex:0 0 auto;}

/* ---- Stats page ---- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
.scard .big{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1;}
.scard .lbl{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:6px;letter-spacing:.5px;text-transform:uppercase;}
.scard.green .big{color:var(--green);}
.scard.amber .big{color:var(--amber);}
.scard.blue .big{color:var(--blue);}
.scard.grey .big{color:var(--txt2);}
.catbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.catbar .ctop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600;}
.catbar .ctop .cn{font-family:var(--mono);font-size:11px;color:var(--txt2);}
.cseg{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden;display:flex;}
.cseg i{height:100%;}

/* config / toast */
.cfgnote{font-family:var(--mono);font-size:11px;color:var(--txt3);line-height:1.6;
  background:var(--panel);border:1px dashed var(--line2);border-radius:11px;padding:13px;margin-top:16px;}
.cfgnote b{color:var(--amber);}
.toast{position:fixed;bottom:calc(var(--sab) + 100px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:11px;
  font-family:var(--mono);font-size:12px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.who-tag{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:14px;text-align:center;}
.who-tag span{color:var(--amber);}

.add-row{display:flex;gap:9px;margin-bottom:10px;}
.add-row input{flex:1;}
.seg-toggle{display:flex;gap:6px;margin-bottom:12px;}
.seg-toggle button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);
  color:var(--txt2);font-family:var(--mono);font-size:11px;cursor:pointer;}
.seg-toggle button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.06);}

/* ---- Lock screen ---- */
.lock{position:fixed;inset:0;z-index:300;background:var(--bg);
  background-image:radial-gradient(circle at 50% 30%,#13202e 0,transparent 55%);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
.lock .lk-logo{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:2px;margin-bottom:6px;}
.lock .lk-logo b{color:var(--amber);}
.lock .lk-sub{font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:1px;margin-bottom:34px;}
.lock .lk-ic{font-size:40px;color:var(--amber);margin-bottom:18px;opacity:.85;}
.lock input{width:100%;max-width:300px;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;padding:14px 16px;color:var(--txt);font-family:var(--disp);font-size:16px;
  outline:none;text-align:center;letter-spacing:1px;}
.lock input:focus{border-color:var(--amber);}
.lock button{width:100%;max-width:300px;margin-top:12px;padding:14px;border:none;border-radius:12px;
  background:var(--amber);color:#1a1200;font-family:var(--mono);font-weight:700;font-size:13px;
  letter-spacing:1px;cursor:pointer;}
.lock .lk-err{color:var(--red);font-family:var(--mono);font-size:11px;height:16px;margin-top:12px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div class="logo"><span>⬡</span><b>VIPER</b>&nbsp;FAILURES <span class="tag">F-16 SIM</span></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">connecting…</span></div>
    </div>
    <div class="prog">
      <div class="prog-top"><span id="progLabel">— of — complete</span><span class="pct" id="progPct">—%</span></div>
      <div class="bar"><i class="b-done" id="barDone"></i><i class="b-prog" id="barProg"></i><i class="b-def" id="barDef"></i></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="failures"><span class="ic">⚠</span>FAILURES</button>
    <button class="tab" data-view="tasks"><span class="ic">▣</span>TASKS</button>
    <button class="tab" data-view="stats"><span class="ic">▤</span>STATS</button>
    <button class="tab" data-view="setup"><span class="ic">⚙</span>SETUP</button>
  </div>

  <main id="main"></main>
</div>

<button class="fab" id="fab" style="display:none">+</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetContent"></div></div>
<div class="lock" id="lockScreen">
  <div class="lk-ic">⬡</div>
  <div class="lk-logo"><b>VIPER</b> FAILURES</div>
  <div class="lk-sub">TEAM ACCESS</div>
  <input type="password" id="lockInput" placeholder="Team password" autocomplete="off">
  <button id="lockBtn">UNLOCK</button>
  <div class="lk-err" id="lockErr"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SEED_DATA = [{"id": "1.1", "event": "Engine Fire (before Takeoff)", "category": "Engine", "status": "DONE", "cause": "Internal engine compartment fire\n\nAfterburner (AB) nozzle fire due to nozzle failure\n\nFuel leak / abnormal fuel indications\n\nMechanical damage (explosions, vibrations, engine fluctuations)", "effect": "ENG FIRE warning light illuminated\n\nAbnormal fuel flow/quantity indications\n\nPossible imminent engine failure\n\nFlight control (FLCS) malfunctions or degraded controls\n\nLoss of one/both hydraulic systems\n\nReduced thrust (nozzle damage)\n\nOil leak possible after nozzle fire", "corrective": "1. Shutdown Engine\n\n2. Abort Mission", "result": "Fire should extinguish after shutdown", "embedded_ui": "Embedded:\nENG FIRE warning light illuminated\n\nFluctuations in fuel flow/quantity indications\n\nLoss of one/both hydraulic systems shown on indicator", "ifnot": "Nothing Stated\n\nLogical Event: Engine Explosion", "notes": "", "dev": "", "cust": ""}, {"id": "1.2", "event": "Engine Fire (just after Takeoff)", "category": "Engine", "status": "DONE", "cause": "Internal engine compartment fire\n\nAfterburner (AB) nozzle fire due to nozzle failure\n\nFuel leak / abnormal fuel indications\n\nMechanical damage (explosions, vibrations, engine fluctuations)", "effect": "ENG FIRE warning light illuminated\n\nAbnormal fuel flow/quantity indications\n\nPossible imminent engine failure\n\nFlight control (FLCS) malfunctions or degraded controls\n\nLoss of one/both hydraulic systems\n\nReduced thrust (nozzle damage)\n\nOil leak possible after nozzle fire", "corrective": "1. Climb.\n\nMaintain takeoff thrust until minimum recommended\nejection altitude is attained and then throttle to minimum practical.\n\n2. Stores - Jettison (if required).\n\nAt a safe altitude:\nIF within gliding distance of a suitable runway. Then\n\n3. Turn the EPU on and Shutdown the Engine.\n\nELSE\n3. Throttle - Minimum practical.\n\nIF ENG FIRE warning light goes off:\n\n4. FIRE & OHEAT DETECT button - Depress.\nDetermine if fire and overheat detection circuits are\nfunctional.\n\nIF fire persists:\n5. Eject.\n\nIF fire indications cease:\n5. Land as soon as possible", "result": "Fire either extinguishes or persists", "embedded_ui": "Embedded:\nENG FIRE warning light illuminated\n\nFluctuations in fuel flow/quantity indications\n\nLoss of one/both hydraulic systems shown on indicator", "ifnot": "Nothing Stated\n\nLogical Event: Engine Explosion", "notes": "", "dev": "", "cust": ""}, {"id": "1.3", "event": "Engine Fire (In-Flight)", "category": "Engine", "status": "DONE", "cause": "Internal engine compartment fire\n\nAfterburner (AB) nozzle fire due to nozzle failure\n\nFuel leak / abnormal fuel indications\n\nMechanical damage (explosions, vibrations, engine fluctuations)", "effect": "ENG FIRE warning light illuminated\n\nAbnormal fuel flow/quantity indications\n\nPossible imminent engine failure\n\nFlight control (FLCS) malfunctions or degraded controls\n\nLoss of one/both hydraulic systems\n\nReduced thrust (nozzle damage)\n\nOil leak possible after nozzle fire", "corrective": "Reduce thrust to the minimum practical level after attaining safe\nejection parameters.\n\n2. Stores - Jettison (if required).\n\nIF within gliding distance of a suitable runway. Then\n\n3. Turn the EPU on and Shutdown the Engine.\n\nELSE\n3. Throttle - Minimum practical.\n\nIF ENG FIRE warning light goes off:\n\n4. FIRE & OHEAT DETECT button - Depress.\nDetermine if fire and overheat detection circuits are\nfunctional.\n\nIF fire persists:\n5. Eject.\n\nIF fire indications cease:\n5. Land as soon as possible", "result": "Fire either extinguishes or persists", "embedded_ui": "Embedded:\nENG FIRE warning light illuminated\n\nFluctuations in fuel flow/quantity indications\n\nLoss of one/both hydraulic systems shown on indicator", "ifnot": "Nothing Stated\n\nLogical Event: Engine Explosion", "notes": "", "dev": "", "cust": ""}, {"id": "1.4", "event": "Engine Fire (False Indication)", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.5", "event": "OVERHEAT Caution Light\n(Engine Compartment Overheat)", "category": "Engine", "status": "NOT YET STARTED", "cause": "Detection of an overheat condition in the engine compartment", "effect": "Master CAUTION light illuminates\n\nOVERHEAT Caution Light illuminates", "corrective": "Accomplish as many of the following as required to extinguish the caution light. If the light goes off, verify the integrity of the overheat detection circuit by depressing the FIRE & OHEAT DETECT button and land as soon as possible.\n\n1. Throttle - Minimum practical.\n\n2. FIRE & OHEAT DETECT button - Depress.\nDetermine if fire and overheat detection circuits are\nfunctional.\n\nIF OVERHEAT caution light goes OFF and detect circuit\nchecks good:\n3. Land as soon as possible.\n\nIF OVERHEAT caution light remains ON (or detect circuit\nchecks bad) and EPU is running:\n\n3. EPU switch - OFF.\nIf the EPU was manually turned on, consider turning it\noff to determine if it is the source of the overheat\ncondition. If the OVERHEAT caution light remains\non, the EPU should be turned back on.\n\n4. OXYGEN - 100%.\n\n5. AIR SOURCE knob - OFF.\n\n6. Descend to below 25,000 feet (18,000 feet if conditions permit)\nAND reduce airspeed to below 500\nknots.\n\nWhen airspeed is reduced and cockpit is depressurized:\n7. AIR SOURCE knob - RAM (below 25,000 feet)\n\n8. Nonessential electrical equipment - Off\n\n9. TANK INERTING switch - TANK INERTING\nEven if Halon is not available.\n\n10. LG handle - DN (300 knots/0.65 Mach maximum).\n(Use DN LOCK REL button if required.)\n\n11. Land as soon as possible", "result": "If the caution light goes off after ANY step, verify the integrity of the overheat detection circuit by depressing the FIRE & OHEAT DETECT button and land as soon as possible.", "embedded_ui": "Embedded:\nMaster CAUTION light illuminates\n\nOVERHEAT Caution Light illuminates", "ifnot": "Nothing Stated\n\nLogical Event: Engine Explosion", "notes": "NOTE:\nExternal fuel cannot be transferred when AIR SOURCE knob in OFF or RAM.\nConsider jettisoning tank(s) to decrease drag if range\nis critical and the ECS cannot be turned on for short\nperiods of time to transfer fuel.\n\nWARNING:\nWith the ECS shut down or the AIR SOURCE knob in OFF or RAM, the g-suit does not\ninflate 31 and PBG is disabled.\n\nNOTE:\nnonessential equipment\n(in order of priority) the pilot should consider turning off includes the:\n• FCR\n• SMS\n• MFDs\n• IFF\n\nWARNING:\nIf LG handle does not lower, select BRAKES CHAN 2 and position ALT FLAPS switch to\nEXTEND.", "dev": "", "cust": ""}, {"id": "1.6", "event": "Zero RPM (RPM Indicator Failure)", "category": "Engine", "status": "IN-PROGRESS", "cause": "Malfunction within the indicator itself", "effect": "ENGINE warning light illuminates\n\nThe RPM indicator falls to zero", "corrective": "1. Land as soon as practical.", "result": "Landed Safely", "embedded_ui": "Embedded:\nENGINE warning light illuminates\n\nThe RPM indicator falls to zero", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "1.7", "event": "Zero RPM (Partial Engine Alternator Failure)", "category": "Engine", "status": "NOT YET STARTED", "cause": "Malfunction within the Engine Alternator", "effect": "ENGINE warning light illuminates\n\nThe RPM indicator falls to zero", "corrective": "1. Land as soon as practical.", "result": "Landed Safely", "embedded_ui": "Embedded:\nENGINE warning light illuminates\n\nThe RPM indicator falls to zero", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE:\nPartial alternator failure may not result in transfer to SEC but may cause loss of engine fault\nreporting capability and zero or erroneous rpm\nindication.", "dev": "", "cust": ""}, {"id": "1.8", "event": "Zero RPM (Total Engine Alternator Failure)", "category": "Engine", "status": "DONE", "cause": "Malfunction within the Engine Alternator", "effect": "ENGINE warning light illuminates\n\nMaster Caution light illuminates\n\nSEC caution light illuminates\n\nThe RPM indicator falls to zero", "corrective": "IF SEC caution light is illuminated:\n1. Go to SEC CAUTION LIGHT, this section.", "result": "Landed Safely", "embedded_ui": "Embedded:\nENGINE warning light illuminates\n\nMaster Caution light illuminates\n\nSEC caution light illuminates\n\nThe RPM indicator falls to zero\n\n=========================\n- Turn OFF Overheat Caution light\n- Turn OFF Engine Fire Warning light\n- Turn ON Engine Warning Light\n- RPM indicator Falls to zero", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "1.9", "event": "SEC Caution Light", "category": "Engine", "status": "IN-PROGRESS", "cause": "A throttle cable internal failure\n\nA throttle linkage disconnection", "effect": "Master Caution light illuminates\n\nSEC caution light illuminates AND the ENG CONT\nswitch is in PRI,\n\nRpm may also initially decrease (up to 10 percent rpm)\nand then recover to a level slightly below that for PRI\n\nThe thrust level at MIL, while operating in SEC, is 70-95\npercent of that provided in PRI\n\nIn SEC, idle thrust is approximately twice that in PRI\n\nExhaust nozzle is closed", "corrective": "IF SEC caution light illuminates while supersonic:\n1. Throttle - Do not retard below MIL until subsonic\n\nWhen subsonic or IF SEC caution light illuminates when subsonic:\n2. Throttle - Verify engine responds normally to throttle\nmovement from IDLE to MIL; set as desired.\n\n\nIF the engine is operating normally in SEC:\n3. ENG CONT switch - SEC.\n\n4. Land as soon as practical.\n\nIF the engine is operating abnormally in SEC:\n3. ENG CONT switch - Position to SEC, then back to PRI\n\n4. Airspeed - 250 knots (if thrust is too low to sustain\nlevel flight).\n\n5. Land as soon as possible.\n\nIF thrust is too high to permit a safe landing:\n6. Plan a flameout landing. Refer to FLAMEOUT\nLANDING, this section.\n\nWhen landing is assured:\n7. Throttle - OFF.\n(If engine does not respond, shut down the engine with\nthe FUEL MASTER switch. At MIL, the engine\nflames out in approximately 6 seconds. At IDLE, the\nengine flames out in approximately 45 seconds)\n\n8. HOOK switch - DN (if required).", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nSEC caution light illuminates\n\nThe RPM indicator falls to 90% of original value prior to failure then recovers again to a value slightly below the same original value in PRI\n\nThe thrust level at MIL, while operating in SEC, is 70-95\npercent of that provided in PRI\n\nIn SEC, idle thrust is approximately twice that in PRI", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nIf the rpm indication is also zero, the engine\nalternator has failed.\n\nNOTE\nA broken throttle cable or throttle linkage disconnect causes a transfer to SEC and abnormal engine response in SEC. Reselecting PRI restores normal engine operation for flight.\n\nNOTE\nIn the event of a broken throttle cable or throttle linkage disconnect, engine shutdown after flight requires use of the FUEL MASTER switch.", "dev": "", "cust": ""}, {"id": "1.10", "event": "ENGINE FAULT Caution Light\n(Anti-ice Valve Failed Closed)", "category": "Engine", "status": "DEFINED", "cause": "Engine anti-ice valve failed in closed position or indication\nmalfunction", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG A/I FAIL\" PFL message displayed on PFLD\n\n\"ENG 015\" MFL message displayed in the TEST page in MFD", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG A/I FAIL\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault.\n\n3. Avoid areas of known or suspected icing condition\n\n4. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nCADC caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG A/I FAIL\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 015 MFL message\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG A/I FAIL\" PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event: Ice accumilates on the front frame struts, the forward centerbody, and the IGV flaps", "notes": "", "dev": "", "cust": ""}, {"id": "1.11", "event": "ENGINE FAULT Caution Light\n(Mach Signal Failure)", "category": "Engine", "status": "DEFINED", "cause": "The CADC supplied Mach number to the DEC is no longer available.", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\nCADC caution light illuminates\n\n\"ENG MACH FAIL\" PFL message displayed on PFLD\n\n\"ENG 017\" MFL message displayed in the TEST page in MFD\n\nSupersonic stall protection is inoperative\n\nHUD Airspeed indicator freeze (Left Bar)\n\nHUD Altitude indicator freeze (Right Bar)\n\nHUD Mach number freeze", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG MACH FAIL\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault.\n\nIF CADC caution light is also ON,\n3. refer to CADC MALFUNCTION\n\nIF ENG 023 MFL is not present and CADC caution light is not on or was reset\n4. Mission may be continued.\n\n5. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nCADC caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG MACH FAIL\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 017 MFL message\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\nCADC caution light illuminates\n\n\"ENG MACH FAIL\" PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nDo not retard throttle below MIL while supersonic", "dev": "", "cust": ""}, {"id": "1.12", "event": "ENGINE FAULT Caution Light\n(DEC Hybrid Mode)", "category": "Engine", "status": "DEFINED", "cause": "The DEC detects certain failures and switched the engine to\n(HYB) Hybrid mode", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG MACH FAIL\" PFL message displayed on PFLD\n\n\"ENG 017\" MFL message displayed in the TEST page in MFD\n\n\"ENG 023\" MFL message displayed in the TEST page in MFD\n\nSupersonic stall protection is inoperative", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG MACH FAIL\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault.\n\nWhen subsonic:\n3. check engine responds normally from IDLE to MIL.\n\nIF engine responds normally\n4. land as soon as practical.\n\nIF engine does NOT respond normally\n4. refer to ABNORMAL OR NO ENGINE RESPONSE,\n\nIF CADC caution light is also ON,\n5. refer to CADC MALFUNCTION\n\nIF ENG 023 MFL is not present and CADC caution light is not on or was reset\n5. Mission may be continued.\n\n6. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG MACH FAIL\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 017 MFL message\nNot stated what will happen to ENG 023 MFL message\n\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG MACH FAIL\" PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "1.13", "event": "ENGINE FAULT Caution Light\n(Engine MUX Bus Failure)", "category": "Engine", "status": "DEFINED", "cause": "Communication between engine and MUX bus lost", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\nIlluminates AVIONICS FAULT caution light.\n\n\"ENG BUS FAIL\" PFL message displayed on PFLD\n\n\"ENG 003\" MFL message displayed in the TEST page in MFD\n\nOther engine PFLs cannot be displayed", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG BUS FAIL\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault and reset AVIONICS FAULT caution light\n\n3. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nAVIONICS FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG BUS FAIL\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 003 MFL message\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\nAVIONICS FAULT caution light illuminates\n\n\"ENG BUS FAIL\" PFL message displayed on PFLD\n\nNO PFLs could be displayed after these.\n\nWhen F-ACK button is pressed, Turn OFF AVIONICS FAULT caution light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "1.14", "event": "ENGINE FAULT Caution Light\n(AB Failure)", "category": "Engine", "status": "DEFINED", "cause": "AB system failure detected", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG A/B FAIL\" PFL message displayed on PFLD\n\n\"ENG 018\" MFL message displayed in the TEST page in MFD\n\nAfterburner operation inhibited", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG A/B FAIL\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault.\n\n3. Land as soon as practical\n\nIF nozzle remains closed at idle below 0.5 mach,\nrefer to ABNORMAL OR NO ENGINE RESPONSE,\n\n4. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG A/B FAIL\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 018 MFL message\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG A/B FAIL\" PFL message displayed on PFLD\n\nAlways Turn OFF SEC caution light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "1.15", "event": "ENGINE FAULT Caution Light\n(False LUBE LOW)", "category": "Engine", "status": "DONE", "cause": "Oil quantity below preset limit\n\nEngine oil level decreasing below approximately 40 percent of normal capacity for 30 seconds", "effect": "Master Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG LUBE LOW\" PFL message displayed on PFLD\n\n\"ENG 016\" MFL message displayed in the TEST page in MFD", "corrective": "IF ENGINE FAULT caution light illuminates:\n1. PFLD - Note \"ENG LUBE LOW\" PFL displayed\n\n2. F-ACK button - Depress to acknowledge fault.\n\n3. Land as soon as possible\n\n4. F-ACK button -  Depress to perform fault recall.", "result": "MASTER caution light extinguishes\n\nENGINE FAULT caution light extinguishes\n\nFor PFLD:\n\"ENG LUBE LOW\" PFL message removed\n\nFor MFD:\nNot stated what will happen to ENG 016 MFL message\n\nThe failure condition no longer exists if the PFL is not present during the fault recall.", "embedded_ui": "Embedded:\nMaster Caution light illuminates\n\nENGINE FAULT caution light illuminates\n\n\"ENG LUBE LOW\" PFL message displayed on PFLD", "ifnot": "Further oil level decrease may cause the exhaust nozzle to fail to an aerodynamically balanced position and there may be a decrease in thrust and a larger than normal NOZ POS indication.\n\nThe HYD/OIL PRESS warning light illuminates when oil pressure has been below approximately 10 psi for 30 seconds\n\nAnticipate engine seizure approximately 5 minutes after oil pressure drops below 10 psi with the ENG LUBE LOW PFL and/or the HYD/OIL PRESS warning light\nilluminated.", "notes": "", "dev": "", "cust": ""}, {"id": "1.16", "event": "ABNORMAL OR NO ENGINE RESPONSE (Low Thrust)", "category": "Engine", "status": "NOT YET STARTED", "cause": "Low thrust can be the result of:\n- DEC-related failures\n- The nozzle failing in the open position\n- An rpm rollback", "effect": "Only physics effects:\nsignificant thrust loss and the inability to takeoff or maintain level flight.\n\nIf an automatic transfer to SEC occurs or SEC is selected manually, resulting thrust is 70-95 percent of normal MIL thrust with no AB capability.\n\nAn exhaust nozzle problem may prevent the use of AB\nand will be indicated by an ENG AB FAIL PFL.\n\nAn excessively open nozzle\nmay reduce the chance for a successful AB light or may\nrestrict the level of AB thrust available.", "corrective": "IF on takeoff and the decision is made to stop:\n1. Abort.\n\nIF takeoff is continued and/or thrust is insufficient mid-flight:\n1. Throttle - AB.\nNozzle problems may inhibit AB capability as indicated by presence of the ENG AB FAIL PFL.\n\n2. Stores - Jettison (if required).\n\nIF thrust is insufficient to maintain level flight at a safe altitude:\n3. ENG CONT switch - SEC, then PRI.\n\nIF thrust is still too low to sustain level flight:\n4. establish 250 knots airspeed.\n\n5. Land as soon as possible.", "result": "Due to having only physics effects:\n\nNO visual change either engine system reset successful and thrust regained or thrust is kept low and aircraft landing occurs", "embedded_ui": "Embedded:\nTBD (To Be Defined)\n\nAir Speed indicator bet2el \n\nThrust decreased \n\nRPM indicator fluctuate", "ifnot": "NOTE\nIn a partial thrust situation, thrust available may increase as altitude decreases. 250 knots approximates the airspeed at which thrust required for level flight is the lowest.\n\nCAUTION\nPosition the ENG CONT switch to SEC for a minimum of 1 second, then back to PRI. Failure to wait 1 second in SEC before going to PRI could result in the system failing to reset", "notes": "", "dev": "", "cust": ""}, {"id": "1.17", "event": "ABNORMAL OR NO ENGINE RESPONSE (Low Thrust in PRI)", "category": "Engine", "status": "NOT YET STARTED", "cause": "A PRI malfunction", "effect": "Generally indicated by abnormal thrust in relation to throttle position, engine oscillations (either continuous, momentary, or recurring).\n\nA complete lack of engine response to throttle movement.\n\nInsufficient thrust.\n\nEngine overtemperature or overspeed indications", "corrective": "IF in AB or if supersonic:\n1. Throttle - Retard to MIL\n\nIF subsonic or problem still exists:\n2. ENG CONT switch - SEC.\n\nIF thrust is too low:\n3. Airspeed - 250 knots (to sustain level flight).\n\n4. Throttle - Verify engine responds normally to throttle\nmovement from IDLE to MIL; then set as desired.\n\nIF a safe landing can be made with the current thrust:\n5. Land as soon as practical.\n\nIF thrust is insufficient to make a safe landing or abnormal\nengine response is still present:\n5. ENG CONT switch - PRI\n\n6. Land as soon as possible.", "result": "Landing occurs safely", "embedded_ui": "Embedded:\nTBD (To Be Defined)\n\n\nAir Speed indicator bet2el \n\nThrust decreased \n\nRPM indicator fluctuate", "ifnot": "CAUTION\nRetarding throttle below MIL while supersonic may induce inlet buzz which produces severe cockpit vibration and probable engine stalls.\n\nNOTE\nIF ther is abnormal engine response in SEC or HYB. Reselecting PRI restores normal engine operation for flight.", "notes": "", "dev": "", "cust": ""}, {"id": "1.18", "event": "ABNORMAL OR NO ENGINE RESPONSE (Throttle Linkage Disconnect)", "category": "Engine", "status": "DEFINED", "cause": "A throttle cable internal failure or a disconnection in throttle linkage", "effect": "Generally indicated by abnormal thrust in relation to throttle position, engine oscillations (either continuous, momentary, or recurring).\n\nAn automatic transfer to SEC or HYB\n\nA throttle linkage disconnect results in no engine response to throttle movements.", "corrective": "IF in AB or if supersonic:\n1. Throttle - Retard to MIL\n\nIF subsonic or problem still exists:\n2. ENG CONT switch - SEC.\n\nIF thrust is too low:\n3. Airspeed - 250 knots (to sustain level flight).\n\n4. Throttle - Verify engine responds normally to throttle\nmovement from IDLE to MIL; then set as desired.\n\nIF a safe landing can be made with the current thrust:\n5. Land as soon as practical.\n\nIF thrust is insufficient to make a safe landing or abnormal\nengine response is still present:\n5. ENG CONT switch - PRI\n\n6. Land as soon as possible.", "result": "Landing occurs safely", "embedded_ui": "Embedded:", "ifnot": "NOTE\nA broken throttle cable or throttle linkage disconnect causes a transfer to SEC or HYB and\nabnormal engine response in SEC or HYB.\nReselecting PRI restores normal engine operation for flight\n\nNOTE\nIn the event of a broken throttle cable or throttle linkage disconnect, engine shutdown after\nflight requires use of the FUEL MASTER\nswitch.", "notes": "", "dev": "", "cust": ""}, {"id": "1.19", "event": "ABNORMAL OR NO ENGINE RESPONSE (Stuck Nozzle)", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "Nozzle indicator stuck on last value\n\nIf AB is engaged AB BLOWOUTS Failure occurs\n\nRPM Decreases to 83% and increases again to 93% Then Blowout sound again occurs and decreases to 83% again.\n1 second for decrasing and increasing.\n\nFTIT also cycles between 440 and 420. 440 is the value that AB blowout at. same 1 second for FTIT to decrease and 1 second to increase.", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)\n\nNozzle indicator stuck on last value", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.20", "event": "ABNORMAL OR NO ENGINE RESPONSE (Auto Acceleration On Ground)", "category": "Engine", "status": "DONE", "cause": "No specific cause mentioned", "effect": "Engine accelerates as if throttle is moved forward.", "corrective": "1. Throttle - OFF.\n\n2. FUEL MASTER switch - OFF.", "result": "Engine shutdown", "embedded_ui": "Embedded:", "ifnot": "NOTE\nWith engine shutdown, only the\nbrake/JFS accumulators are available to supply hydraulic\npressure for braking.", "notes": "", "dev": "", "cust": ""}, {"id": "1.21", "event": "Hot Start", "category": "Engine", "status": "DEFINED", "cause": "No specific cause mentioned", "effect": "The FTIT increases through 750°C while engine rpm is less than 40 percent", "corrective": "1. Throttle - OFF.\n\n2. FTIT indicator - Monitor.\n\nIF FTIT remains above 500°C:\n3. JFS switch - START 2.\nMotor engine with JFS until FTIT is below 200°C.", "result": "FTIT decreases below 200\n\n=================================\n\nFailure resets when:\n1. Throttle - OFF.", "embedded_ui": "Embedded:\nFTIT increases through 750°C while engine rpm is less than 40 percent\n\n===========================\nWhen rpm is at 30%, increase FTIT from 0 to 12000 and reaching 12000 when rpm is at 50%\n\nNote: rpm is increasing at its normal rate so you will control the FTIT indicator only.", "ifnot": "", "notes": "Note that this failure doesn't start instantly you have to wait for the pilot to do the engine start procedure.", "dev": "", "cust": ""}, {"id": "1.22", "event": "Hung Start", "category": "Engine", "status": "DEFINED", "cause": "No specific cause mentioned", "effect": "RPM has stopped increasing below IDLE and FTIT is stabilized at less than 935°C\n\nOR in other words\n\nHung start is indicated by the FTIT stabilized\nbelow 935°C and rpm has stopped increasing", "corrective": "1. Throttle - OFF. Notify maintenance", "result": "Failure resets when:\n1. Throttle - OFF.", "embedded_ui": "Embedded:\nRPM has stopped increasing below IDLE and FTIT is stabilized at less than 935°C\n\n==========================\n- RPM increases normally but stops when rpm reaches 60%.", "ifnot": "", "notes": "Note that this failure doesn't start instantly you have to wait for the pilot to do the engine start procedure.", "dev": "", "cust": ""}, {"id": "1.23", "event": "No Start", "category": "Engine", "status": "NOT YET STARTED", "cause": "No specific cause mentioned", "effect": "Light-off does not occur within 10 seconds", "corrective": "1. Throttle - OFF. Notify maintenance", "result": "", "embedded_ui": "Embedded:", "ifnot": "", "notes": "After light-off, the engine will continue to run, and the ignitors are turned off as the combustion process is now self-sufficient.", "dev": "", "cust": ""}, {"id": "1.24", "event": "JFS Clutch Failure", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "RPM indicator doesn't increase and NO engine start", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.25", "event": "Oil System Malfunction\n(Oil Leak)", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "After 30 seconds oil indicator drops suddenly to half its value then swings from this value to +- 10 psi then after 2 swings this value decreases by 10 so it swings with +- 10 psi at another value.\n\nAlso after indicator goes to 0 by 20 seconds the Engine Fault caution light illuminates and MASTER caution illuminatesand ENG LUBE LOW PFL Displayed on PFLD\n\nAfter Caution light illuminates by 30 seconds HYD/OIL warning light illuminates and warn signal flashes on HUD", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.26", "event": "Oil System Malfunction\n(Oil Pump Failure)", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "instantly the gauge starts dropping with a rate of 5 psi per second \n\nAfter 30 seconds of gauge reaching 0 psi HYD/OIL PRESS warning light illuminates and warn falshes on HUD\n\nAfter 1.5 minutes imposed engine seizure (Kill the engine NO control on aircraft)", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.27", "event": "Oil System Malfunction\n(Oil Pressure Sensor Failure)", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.28", "event": "FTIT Indicator Failure", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "The indicator starts to increase with a rate of 20 degrees celsius per second . \n\nWhen the maximum of the indicator is reached, 1200 degrees, the Engine warning Light illuminate and the Warn flashes on HUD", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.29", "event": "AB Blowout", "category": "Engine", "status": "NOT YET STARTED", "cause": "No specific cause mentioned", "effect": "AB blowouts are characterized by:\n- A thrust loss\n- A fuel flow decrease \n- Nozzle closure. Nozzle indicator goes to zero\n\nThe DEC attempts to relight the AB as long as the throttle remains in AB.", "corrective": "1- Retard to MIL", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.30", "event": "AB Failure to Light", "category": "Engine", "status": "NOT YET STARTED", "cause": "No specific cause mentioned", "effect": "When throttle is moved to AB, the AB fails to light (Disable the afterburner functionality and make the nozzle indicator flucuate around 15%-20%)", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.31", "event": "Engine Stalls (AB ENGINE STALLS)", "category": "Engine", "status": "NOT YET STARTED", "cause": "The three primary causes of a stall are inlet flow distortion, AB instabilities, and hardware malfunctions. \n\nHardware-associated stalls may result from a failed nozzle, control system malfunctions, or FOD. \n\nTypes of AB stalls are:\n• AB initiation - Stall at AB light-off.\n\n• AB sequencing - Stall during AB sequencing as the AB fuel flow increases with the throttle in AB.\n\n• AB cancellation - Stall during throttle retard from AB.\n\n• AB blowout/relight - Stall occurs during relight after a blowout in stabilized AB. May be preceded by AB rumble.", "effect": "The first indication of a stall at high thrust settings may be\na loud bang or pop.\n\nA possible fireball from the engine exhaust and occasionally the engine inlet.\n\nHigh intensity engine vibration", "corrective": "IF an AB stall(s) occurs:\n1. Throttle - Snap to MIL.\n\nIF stall continues at MIL:\n2. refer to NON AB ENGINE STALLS section.\n\n(If engine response at low altitude is not sufficient to maintain or gain altitude and a suitable field is not immediately available, ejection may be required)", "result": "Throttle retardation clear the AB stall and engine continue normal operation", "embedded_ui": "Embedded:\n\nAll effects are physics related", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.32", "event": "Engine Stalls - No Sound (NON AB ENGINE STALLS)", "category": "Engine", "status": "NOT YET STARTED", "cause": "The control system is malfunctioning, particularly during throttle transients.\n\nA serious engine problem.", "effect": "Non-AB stalls may be inaudible\n\nFirst indication may be a lack of engine response to throttle movement.\n\nlow intensity engine rumble or vibration \n\nerratic orange-yellow flame from the engine exhaust.\n\nFTIT fluctuation and decreasing rpm will probably accompany stalls.", "corrective": "IF stall(s) occurs below AB:\n1. Throttle - IDLE.\n\nNOTE:\nFor serious hardware problems, the engine may\noperate normally at idle rpm but exhibit stall/\nvibration conditions at thrust settings above\nidle rpm. Use the highest thrust setting below\nthe stall/vibration condition to sustain flight\nand jettison stores (if required).\n\nIF stalls continue, or thrust is insufficient for a safe recovery:\n3. Initiate airstart. Refer to AIRSTART PROCEDURES,\nthis section.\n\nIF stall(s) clears:\n3. Throttle - MIL or below. Minimize throttle movements\nand make necessary movements slowly.\n\n4. Land as soon as possible.", "result": "Landing as soon as possible if stall clears \n\nOR\n\nAistart procedure attempted", "embedded_ui": "Embedded:\nFTIT fluctuation and decreasing rpm .", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.33", "event": "Falmeout", "category": "Engine", "status": "IN-PROGRESS", "cause": "fuel starvation or mechanical failure has occurred.\n\nA flameout indicates an engine control failure, fuel starvation, fuel system malfunction, or fuel cutoff due to engine overspeed protection.", "effect": "A flameout is indicated by a decrease in FTIT and engine\nrpm decaying below in-flight idle (approximately 70 percent rpm). \n\nLoss of thrust and lack of response to throttle\nmovement confirm the flameout.\n\nThe ENGINE warning light illuminates when engine rpm goes below 60 percent\n\nWith Flashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nthe MAIN GEN and STBY GEN lights illuminate below 50 percent rpm and the EPU should start running (EPU Run Light illuminated with AIR and/or Hydrazine lights).\n\nMaster Caution light illuminates\n\nElec Caution light illuminates", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.34", "event": "Tower Shaft Failure", "category": "Engine", "status": "NOT YET STARTED", "cause": "No specific cause mentioned", "effect": "Failure of the engine tower shaft or its associated geartrain\nresults in engine flameout due to fuel starvation\n\nSustained flight is not possible, and primary emphasis should be on a flameout landing.\n\nBecause tower shaft failure results in the loss of rotation\nto the engine gearbox and ADG\n\nThe engine rpm indication drops to zero in 2 seconds,the engine flames out, and the ENGINE warning light and HYD/OIL Warning light illuminates after 10 secinds and\nthe SEC caution light illuminate.\n\nWith Flashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nMaster Caution light illuminates\n\nEPU Run Light  illuminates\n\nEPU AIR and HYDRAZINE LIght illuminates\n\nFLCS PMG Light illuminates\n\nMAIN GEN Light illuminates\n\nSTBY GEN Light illuminates\n\nSEC Caution Light illuminates\n\nELEC SYS caution light illuminates\n\nCADC Caution light illuminates", "corrective": "The JFS should be started immediately upon entering the\nJFS envelope to conserve EPU fuel. \n(The JFS drives the ADG and the engine gearbox, which restores rotation to both hydraulic pumps and provides a reduced FLCS PMG output.)", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)\n\nEngine warning Light\n\nHYD/OIL PRESS warning Light\n\nwarn", "ifnot": "IMPORTANT NOTE\nthe JFS produces an rpm indication of approximately 50 percent. This is the speed of the ADG and the engine gearbox, and not the actual engine rpm. The engine may light off; however, because the engine control is not sensing actual engine\nrpm, the engine will stabilize subidle with high FTIT and no throttle response. There will be insufficient thrust to sustain flight.", "notes": "", "dev": "", "cust": ""}, {"id": "1.35", "event": "Engine Seizure", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "Same As Tower Shaft Failiure", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.36", "event": "False ENGINE Warning Light", "category": "Engine", "status": "NOT YET STARTED", "cause": "", "effect": "Engine warning light illuminates and warn falshes on HUD\n\nWITH NO INDICATIONS OF ANY ENGINE FAILURE", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "1.37", "event": "INLET ICING Caution Light", "category": "Engine", "status": "NOT YET STARTED", "cause": "when an ice accumulation is detected by the inlet ice detector or if a detection system failure occurs.", "effect": "Master caution light illuminates\n\nThe INLET ICING caution light illuminates and remains on for approximately 70 seconds (assuming no additional ice accumulation)", "corrective": "", "result": "", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "2.1", "event": "Main Generator Failure (In Flight)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Main generator failure\n\nBus contactor tripping off one or both nonessential AC buses", "effect": "Master Caution light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN caution light illuminated\n\nStandby generator automatically powers essential and emergency buses only\n\nAll nonessential AC and DC buses unpowered while on standby generator\n\nMomentary loss of HUD, MFDs, and cockpit instruments", "corrective": "1. LEFT HDPT and RIGHT HDPT – OFF\n\n2. SMS – OFF (if flight conditions permit)\n\n3. ELEC CAUTION RESET button – Depress (attempts to reset main generator)\n\nIf main generator does not reset:\n4. SMS – ON\n\nIf power cycling is observed:\n5. Go to ELECTRICAL POWER CYCLING procedure\n\nIf power cycling is not observed:\n6. Land as soon as practical\n\nIf power cycling is observed during landing rollout (at safe taxi speed):\n\n7. SMS – OFF\n\n8. MAIN PWR switch - BATT.\n\n9. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.", "result": "Essential and emergency buses remain powered by standby generator\n\nIf generator resets, return to normal power supply\n\nSafe recovery and landing possible with some nonessential systems inoperative", "embedded_ui": "Embedded:\nMaster Caution warning light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN warning light illuminated", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Note: HUD will lose flight data if SMS is powered off while main generator is offline", "dev": "", "cust": ""}, {"id": "2.2", "event": "Standby Generator Failure (In Flight)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Mechanical failure affecting the standby generator\n\nMechanical failure also impacting the FLCS PMG", "effect": "Master Caution light illuminated\n\nSTBY GEN light illuminated \n\nFLCS PMG light illuminated\n\nNo inoperative equipment if the main generator is still operational\n\nELEC SYS caution light may not appear illuminated if MAL & IND LTS switch is in DIM", "corrective": "IF STBY GEN light or STBY GEN & FLCS PMG light\nilluminate(s):\n1. ELEC CAUTION RESET button - Depress.\nThis action may reset the standby generator.\n\n2. Land as soon as practical.", "result": "IF reset succeeds: standby generator resumes operation\n\nIF reset fails: continue flight safely on main generator, then land", "embedded_ui": "Embedded:\nMaster Caution  light illuminate\n\nSTBY GEN  light illuminate\n\nFLCS PMG light illuminate\n\nIF MAL & IND LTS switch in BRT position then:\nELEC SYS caution light illuminate", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "ELEC SYS caution light may not appear illuminated if MAL & IND LTS switch is in DIM", "dev": "", "cust": ""}, {"id": "2.3", "event": "Main & Standby Generator Failures", "category": "Electrical", "status": "DONE", "cause": "Main generator failure\n\nBus contactor tripping off one or both nonessential AC buses\n\nMechanical failure affecting the standby generator", "effect": "Master Caution light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN light illuminated\n\nSTBY GEN light illuminated \n\nEPU starts automatically\n\nEPU run light illuminated\n\nEPU AIR light illuminated\n\nEPU HYDRAZN light illuminated\n\nAVIONICS FAULT caution light illuminate\n\nIf both generators fail, power to all essential and nonessential buses (AC and DC) is lost therefore loss of power to all equipment connected to these buses.\n\nHUD and MFDs power lost.", "corrective": "IF MAIN GEN and STBY GEN lights illuminate:\n1. EPU switch - ON \n(IF EPU didn't automatically start and EPU run light is off).\n\n2. ELEC CAUTION RESET button - Depress.\nThis action may reset the main and/or standby generator. The MAIN PWR switch may also be cycled to reset the main generator.\n\nIF MAIN GEN or STBY GEN light goes off:\n3. EPU switch - OFF, then NORM.\n\n4. ADI - Check for presence of OFF and/or AUX warning flags.\n\n5. Land as soon as practical.\n\n6. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nIF MAIN GEN and STBY GEN lights remain on:\n3. ADI - Check for presence of OFF and/or AUX warning flags.\n\n4. Land as soon as possible.\n\n5. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.\n\n6. IF hydrazine depletes or EPU run light goes off at low thrust:\nGo to ABNORMAL EPU OPERATION section.\n\nAfter landing and aircraft is stopped:\n7. Chocks - Installed (or parking brake engaged).\n\n8. EPU switch - OFF\n\n9. MAIN PWR switch - MAIN PWR (until chocks are\ninstalled).", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN light illuminated\n\nSTBY GEN light illuminated \n\nEPU starts automatically\n\nEPU run light illuminated\n\nEPU AIR light illuminated\n\nEPU HYDRAZN light illuminated\n\nAVIONICS FAULT caution light illuminate\n\n===========================\n- Master Caution light illuminated\n- Turn ON CADC Caution light\n- Turn OFF FLCS RLY light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "CAUTION\nIf chocks are not installed, be prepared to immediately engage the parking brake if it disengages when the EPU is shut off.", "dev": "", "cust": ""}, {"id": "2.4", "event": "Main, Standby, and EPU Generator \nFailure", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Main generator failure\n\nBus contactor tripping off one or both nonessential AC buses\n\nMechanical failure affecting the standby generator\n\nThe EPU may be inoperative due to several reasons, three of which could be known from the cockpit:\n1- IF the EPU AIR light is off, the EPU may not have received\nan automatic start command; manually turning the EPU on may correct this failure. \n\n2- If the EPU GEN, EPU AIR, and HYDRAZN lights are illuminated but the EPU run light is off, the EPU may be underspeeding.\n\n3- If the EPU PMG light is on or blinking, EPU speed is very slow. The underspeed could be caused by failure of hydrazine to\npower the EPU in conjunction with a low thrust setting and may be corrected by advancing the throttle.", "effect": "Master Caution light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN light illuminated\n\nSTBY GEN light illuminated \n\nEPU run light DOES NOT illuminated\n\nLoss of all avionics, ADI OFF and AUX warning flags.\n\nUncontrollable cold airflow into the cockpit or reduced\nairflow to the cockpit.\n\nAVIONICS FAULT caution light DOES NOT illuminate\n\n============================================\nExplains the effects and operation in different cases:\n\nThe aircraft battery supplies power to battery buses No. 1 and No. 2. As long as the ACFT BATT TO FLCS light remains off, the EPU PMG and/or FLCS PMG is supplying adequate FLCS power.\n\nIf the FLCS PMG light illuminates when the MAIN GEN,\nSTBY GEN, and EPU GEN lights are on, there are two\npossible sources of FLCS power (EPU PMG and aircraft\nbattery).\n\nIf the EPU PMG and ACFT BATT TO FLCS lights are off, the EPU PMG is supplying power to the FLCS whether the EPU run light is on or off.\n\nIf the ACFT BATT TO FLCS light is on, the aircraft\nbattery is supplying power to the FLCS. The aircraft\nbattery supplies power for FLCS operation for 3-14 minutes (depending on state of battery charge) after total\ngenerator failure. As the aircraft battery depletes, the flight controls either become unresponsive or uncommanded maneuvers occur.\n\nWhen the FLCS is powered by the aircraft\nbattery, remain alert for degraded flight controls. At the first indication of degraded response, reduce airspeed and climb to safe ejection altitude. Eject prior to complete loss of control.", "corrective": "IF MAIN GEN, STBY GEN, and EPU GEN lights illuminate:\n\n1. AOA - 12 degrees maximum (200 knots minimum).\n\n2. EPU switch - ON (if EPU run light is off).\n\n3. Climb if necessary.\n\n4. Throttle - As required to extinguish the HYDRAZN light.\n\nIF EPU GEN light goes off:\n5. Go to Main & Standby Generator Failures section.\n\nIF EPU GEN light remains on:\n6. ELEC CAUTION RESET button - Depress.\nThis action may reset the main and/or standby generator.\n\nIF both MAIN GEN and STBY GEN lights remain on:\n7. MAIN PWR switch - BATT, then MAIN PWR.\nThis action may reset the main generator.\n\nIF either MAIN GEN or STBY GEN light goes off:\nImportant Note: When the FLCS is powered by the aircraft\nbattery, remain alert for degraded flight controls.\n\n8. EPU switch - OFF, then NORM.\n\n9. Land as soon as possible.\n\n10. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.\n\nIF MAIN GEN, STBY GEN, and EPU GEN lights all remain\non or all come on again:\n8. HOOK switch - DN.\n\n9. CNI knob - BACKUP.\n\n10. Minimize COM1 transmissions.\n\nIF conditions permit:\n11. Land as soon as possible.\n\n12. LG handle - DN (Use DN LOCK REL button).\n\n13. ALT GEAR handle - Pull (190 knots maximum).\n\n14. Consider an approach-end arrestment, if conditions\npermit. Refer to CABLE ARRESTMENT, this section.\n\n15. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nAfter landing:\n16. Stop straight ahead and have chocks installed (or\nengage parking brake).\n\n17. MAIN PWR switch - MAIN PWR (until chocks are\ninstalled).", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution light illuminated\n\nELEC SYS caution light illuminate\n\nMAIN GEN light illuminated\n\nSTBY GEN light illuminated \n\nEPU run light DOES NOT illuminated\n\nAVIONICS FAULT caution light DOES NOT illuminate", "ifnot": "Nothing Stated\n\nLogical Event: \nCrash", "notes": "WARNING\n• Emergency jettison is not available unless the\nmain, standby, or EPU generator is operating.\n\n• If the FLCS PMG and EPU PMG lights are on in combination with the ACFT BATT TO FLCS light, the aircraft battery is powering the\nFLCS. With the aircraft battery powering the FLCS in addition to the battery buses, approximately 3-14 minutes flight time is available.\n\nNOTE\nWhen the FLCS is powered by the aircraft battery, remain alert for degraded flight controls. At the first indication of degraded response, reduce airspeed and climb to safe ejection altitude. Eject prior to complete loss of control.\n\nWARNING\nIf LG handle does not lower, select BRAKES CHAN 2 and position ALT FLAPS switch to\nEXTEND.", "dev": "", "cust": ""}, {"id": "2.5", "event": "FLCS PMG Failure", "category": "Electrical", "status": "IN-PROGRESS", "cause": "Failure of all four branches of the FLCS PMG", "effect": "Master Caution  light illuminated\n\nELEC SYS caution light illuminate\n\nFLCS PMG light illuminates\n\nConverter/regulator automatically switches to highest available alternate source (main generator, standby generator, EPU generator, EPU PMG, or aircraft battery)\n\nNo immediate loss of FLCS as long as alternate sources are available", "corrective": "If FLCS PMG light illuminates:\n1. Land as soon as practical.", "result": "FLCS continues operating on alternate power source(s)\n\nAircraft remains controllable but must be landed promptly", "embedded_ui": "Embedded:\nMaster Caution light illuminate\n\nELEC SYS caution light illuminate\n\nFLCS PMG light illuminates", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "2.6", "event": "Uncommanded EPU Operation \n(Unexplained Reason)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "The EPU may also activate for reasons not apparent to the\npilot. Although this is not an EPU malfunction, it may be\ninterpreted as uncommanded EPU operation.", "effect": "EPU Run light is illuminated\n\nAIR light is off", "corrective": "1. Throttle - Minimum practical thrust.\n\n2. Stores - Jettison (if required).\nOnly if required to maintain low thrust.\n\n3. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:\nEPU Run light is illuminated.\n\nAIR light is NOT illuminated.", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "• The nonessential dc buses and essential dc bus\nlose power. This results in loss of power to the\nLESS 81 HUD, ASHM, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and\npower for normal weapon arming/release including selective jettison.", "dev": "", "cust": ""}, {"id": "2.7", "event": "Uncommanded EPU Operation \n(Bleed Air)", "category": "Electrical", "status": "DONE", "cause": "Failures can occur which allow engine bleed air to spin\nthe EPU turbine even though the EPU has not been\ncommanded on.", "effect": "EPU Run light is illuminated\n\nAIR light is ON\n\nDuring uncommanded EPU operation on\nbleed air, EPU speed varies directly with throttle position.", "corrective": "1. EPU - Leave running.\n\n2. Land as soon as possible.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.", "result": "Landed Safely", "embedded_ui": "Embedded:", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "• The nonessential dc buses and essential dc bus\nlose power. This results in loss of power to the\nLESS 81 HUD, ASHM, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and\npower for normal weapon arming/release including selective jettison.", "dev": "", "cust": ""}, {"id": "2.8", "event": "ACTIVATED EPU/HYDRAZINE LEAK", "category": "Information", "status": "NOT YET STARTED", "cause": "Landing with normal EPU operation resulted from both main and standby generators failures.\n\nLanding with normal EPU operation resulted from dual hydraulic system failure.\n\nLanding with normal EPU operation resulted from PTO\nshaft or ADG failure.\n\nLanding with normal EPU operation resulted from engine flameout or if the engine is shut down in flight\n\nUncommanded EPU Operation with Bleed Air that resulted in normal EPU Operation.\n\nA leak of liquid or gaseous hydrazine", "effect": "EPU Run light is illuminated\n\nAIR light is illuminated\n\nHydrazine ligth is illuminated", "corrective": "Before Landing: Inform landing base of hydrazine leak or EPU operation and request bioenvironmental services support.\n\n1. OXYGEN - 100%.\n\nAfter Landing:\n2. AIR SOURCE knob - OFF (if required).\nTo prevent the possibility of hydrazine fumes or EPU exhaust gases entering the cockpit..\n\n3. Taxi to designated isolated parking area (if required)\nand park aircraft with left wing into wind if possible.\n\n4. Ensure all nonessential personnel are clear.\n\n5. Chocks - Installed (or parking brake engaged).\n\n6. EPU switch - OFF.\n\n7. MAIN PWR switch - MAIN PWR (until chocks are\ninstalled).\n\n8. Shut down the engine (after left main wheel is chocked).", "result": "This is an information row, no corrective action effect observed.", "embedded_ui": "Embedded:\nEPU Run light is illuminated.\n\nAIR light is illuminated.\n\nHydrazine light is illuminated", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "• The nonessential dc buses and essential dc bus\nlose power. This results in loss of power to the\nLESS 81 HUD, ASHM, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and\npower for normal weapon arming/release including selective jettison.", "dev": "", "cust": ""}, {"id": "2.9", "event": "Abnormal EPU Operation (tertiary speed control)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "There are no specific causes for the Abnormal EPU Operation stated", "effect": "EPU run light flashes by alternately cycling on and off (one to three times per second).\n\nMaster CAUTION light is illuminated\n\nHydrazine light is illuminated\n\nThe hydrazine supply depletes in approximately 10 minutes\n\nAfter hydrazine depletion, the EPU continues to operate with available bleed air on tertiary speed control.", "corrective": "IF EPU was turned on for an ACFT BATT FAIL or a FLCS\nRLY light:\n\n1. EPU switch - OFF, then NORM.\n\n2. Land as soon as possible.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nIF EPU was activated for other reasons:\n\n1. Throttle - As required (82-90 percent rpm).\n(Keep thrust high enough to assure adequate bleed air if\nEPU fuel usage continues above 90 percent rpm or if\nEPU run light is flashing. If EPU fuel is depleted or if\nEPU run light goes off at low thrust, set throttle to\nkeep EPU run light on)\n\n2. EPU FUEL quantity - Monitor.\n\n3. Land as soon as possible.\n(Make an approach-end arrestment, if practical, if EPU\nfuel depletes before landing or if EPU run light goes\noff at low thrust settings. Refer to CABLE ARRESTMENT, this section)", "result": "Landed Safely", "embedded_ui": "Embedded:\nEPU Run light cycles on and off (one to three times per second)\n\nMaster CAUTION light illuminated\n\nHydrazine light is illuminated\n\nHydrazine supply/EPU fuel depletes in approximately 10 minutes", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Before landing, confirm that the EPU operates (EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle and maintain a throttle\nsetting which keeps EPU run light on until after touchdown.", "dev": "", "cust": ""}, {"id": "2.10", "event": "Abnormal EPU Operation (Overspeedl)", "category": "Electrical", "status": "DEFINED", "cause": "There are no specific causes for the Abnormal EPU Operation stated", "effect": "EPU run light does not come on or goes off after initial illumination", "corrective": "IF EPU was turned on for an ACFT BATT FAIL or a FLCS\nRLY light:\n\n1. EPU switch - OFF, then NORM.\n\n2. Land as soon as possible.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nIF EPU was activated for other reasons:\n\n1. Throttle - As required (82-90 percent rpm).\n(Keep thrust high enough to assure adequate bleed air if\nEPU fuel usage continues above 90 percent rpm or if\nEPU run light is flashing. If EPU fuel is depleted or if\nEPU run light goes off at low thrust, set throttle to\nkeep EPU run light on)\n\n2. EPU FUEL quantity - Monitor.\n\n3. Land as soon as possible.\n(Make an approach-end arrestment, if practical, if EPU\nfuel depletes before landing or if EPU run light goes\noff at low thrust settings. Refer to CABLE ARRESTMENT, this section)", "result": "Landed Safely", "embedded_ui": "Embedded:\nDon't turn On the EPU upon failure activation\n\nBut When EPU is turned on, either manually or automatically, then:\n\n- Turn OFF the EPU run light after 6 seconds from illumination", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Note that this failure doesn't start instantly you have to wait for the pilot to do the engine start procedure.\n\nBefore landing, confirm that the EPU operates (EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle and maintain a throttle\nsetting which keeps EPU run light on until after touchdown.", "dev": "", "cust": ""}, {"id": "2.11", "event": "Abnormal EPU Operation (Underspeedl)", "category": "Electrical", "status": "DEFINED", "cause": "There are no specific causes for the Abnormal EPU Operation stated", "effect": "EPU run light does not come on or goes off after initial illumination", "corrective": "IF EPU was turned on for an ACFT BATT FAIL or a FLCS\nRLY light:\n\n1. EPU switch - OFF, then NORM.\n\n2. Land as soon as possible.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nIF EPU was activated for other reasons:\n\n1. Throttle - As required (82-90 percent rpm).\n(Keep thrust high enough to assure adequate bleed air if\nEPU fuel usage continues above 90 percent rpm or if\nEPU run light is flashing. If EPU fuel is depleted or if\nEPU run light goes off at low thrust, set throttle to\nkeep EPU run light on)\n\n2. EPU FUEL quantity - Monitor.\n\n3. Land as soon as possible.\n(Make an approach-end arrestment, if practical, if EPU\nfuel depletes before landing or if EPU run light goes\noff at low thrust settings. Refer to CABLE ARRESTMENT, this section)", "result": "Landed Safely", "embedded_ui": "Embedded:\nDon't turn On the EPU upon failure activation\n\nBut When EPU is turned on, either manually or automatically, then:\n\n- IF (rpm < 86%) then:\n1- Turn OFF EPU run light\n2- Turn ON EPU GEN light\n3- Turn ON EPU PMG light\n\nELSE then:\n Normal EPU light operation as DCS", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Note that this failure doesn't start instantly you have to wait for the pilot to do the engine start procedure.\n\nBefore landing, confirm that the EPU operates (EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle and maintain a throttle\nsetting which keeps EPU run light on until after touchdown.\n\nIf EPU underspeeds, electrical bus cycling may\naffect brake operation. For a missed engagement, attempt CHAN 1 then CHAN 2 brakes.\nIf no braking is available, consider going\naround for another engagement or making a\ndeparture-end arrestment. The parking brake\nstill operates.", "dev": "", "cust": ""}, {"id": "2.12", "event": "Abnormal EPU Operation (Hydrazine Depletion)", "
