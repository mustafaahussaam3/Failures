category": "Electrical", "status": "DEFINED", "cause": "There are no specific causes for the Abnormal EPU Operation stated", "effect": "EPU Run Light illuminated.\n\nEPU HYDRAZN light does not go off\n\nEPU fuel quantity continues to deplete when the\nthrottle is advanced to assure adequate bleed air", "corrective": "IF EPU was turned on for an ACFT BATT FAIL or a FLCS\nRLY light:\n\n1. EPU switch - OFF, then NORM.\n\n2. Land as soon as possible.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.\n\nIF EPU was activated for other reasons:\n\n1. Throttle - As required (82-90 percent rpm).\n(Keep thrust high enough to assure adequate bleed air if\nEPU fuel usage continues above 90 percent rpm or if\nEPU run light is flashing. If EPU fuel is depleted or if\nEPU run light goes off at low thrust, set throttle to\nkeep EPU run light on)\n\n2. EPU FUEL quantity - Monitor.\n\n3. Land as soon as possible.\n(Make an approach-end arrestment, if practical, if EPU\nfuel depletes before landing or if EPU run light goes\noff at low thrust settings. Refer to CABLE ARRESTMENT, this section)", "result": "Landed Safely", "embedded_ui": "Embedded:\nDon't turn On the EPU upon failure activation\n\nBut When EPU is turned on, either manually or automatically, then:\n\n\nEPU HYDRAZN light does not go off\n\nEPU fuel quantity continues to decrease with its normal depletion rate no matter the input/change in the throttle to increase bleed air supply", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Note that this failure doesn't start instantly you have to wait for the pilot to do the engine start procedure.\n\nBefore landing, confirm that the EPU operates (EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle and maintain a throttle\nsetting which keeps EPU run light on until after touchdown.", "dev": "", "cust": ""}, {"id": "2.13", "event": "Abnormal EPU Operation (Automatic Fire Failure)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "2.14", "event": "OVERHEAT Caution Light\n(EPU Bay Overheat)", "category": "Electrical", "status": "IN-PROGRESS", "cause": "Detection of an overheat condition in the EPU Bay", "effect": "Master CAUTION light illuminates\n\nOVERHEAT Caution Light illuminates", "corrective": "Accomplish as many of the following as required to extinguish the caution light. If the light goes off, verify the integrity of the overheat detection circuit by depressing the FIRE & OHEAT DETECT button and land as soon as possible.\n\n1. Throttle - Minimum practical.\n\n2. FIRE & OHEAT DETECT button - Depress.\nDetermine if fire and overheat detection circuits are\nfunctional.\n\nIF OVERHEAT caution light goes OFF and detect circuit\nchecks good:\n3. Land as soon as possible.\n\nIF OVERHEAT caution light remains ON (or detect circuit\nchecks bad) and EPU is running:\n\n3. EPU switch - OFF.\nIf the EPU was manually turned on, consider turning it\noff to determine if it is the source of the overheat\ncondition. If the OVERHEAT caution light remains\non, the EPU should be turned back on.\n\n4. OXYGEN - 100%.\n\n5. AIR SOURCE knob - OFF.\n\n6. Descend to below 25,000 feet (18,000 feet if conditions permit)\nAND reduce airspeed to below 500\nknots.\n\nWhen airspeed is reduced and cockpit is depressurized:\n7. AIR SOURCE knob - RAM (below 25,000 feet)\n\n8. Nonessential electrical equipment - Off\n\n9. TANK INERTING switch - TANK INERTING\nEven if Halon is not available.\n\n10. LG handle - DN (300 knots/0.65 Mach maximum).\n(Use DN LOCK REL button if required.)\n\n11. Land as soon as possible", "result": "If the caution light goes off after ANY step, verify the integrity of the overheat detection circuit by depressing the FIRE & OHEAT DETECT button and land as soon as possible.", "embedded_ui": "Embedded:\nMaster CAUTION light illuminates\n\nOVERHEAT Caution Light illuminates", "ifnot": "Nothing Stated\n\nLogical Event: Engine Explosion", "notes": "NOTE:\nExternal fuel cannot be transferred when AIR SOURCE knob in OFF or RAM.\nConsider jettisoning tank(s) to decrease drag if range\nis critical and the ECS cannot be turned on for short\nperiods of time to transfer fuel.\n\nWARNING:\nWith the ECS shut down or the AIR SOURCE knob in OFF or RAM, the g-suit does not\ninflate 31 and PBG is disabled.\n\nNOTE:\nnonessential equipment\n(in order of priority) the pilot should consider turning off includes the:\n• FCR\n• SMS\n• MFDs\n• IFF\n\nWARNING:\nIf LG handle does not lower, select BRAKES CHAN 2 and position ALT FLAPS switch to\nEXTEND.", "dev": "", "cust": ""}, {"id": "2.15", "event": "Electrical Power Cycling", "category": "Electrical", "status": "NOT YET STARTED", "cause": "An electrical power overload at station 3, 5, or 7, or in the\nwiring to one of these stations\n\nA wire harness chafing condition.\n\nA fire at the chafing location can occur and can adversely affect other wire harness/aircraft systems", "effect": "Causes cockpit displays and lights to cycle on and off approximately once every 3 seconds.\n\nRemoving SMS power should stop the cycling.", "corrective": "IF cycling occurs:\n1. SMS, LEFT HDPT and RIGHT HDPT - OFF.\n\n2. Nonessential avionics - OFF.\n\n3. Monitor aircraft systems.\n\nIF cycling continues:\n4. EPU - ON.\n\nAfter verifying EPU GEN and EPU PMG lights are off:\n5. MAIN PWR switch - BATT.\n\n6. Land as soon as possible.\n\n7. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.", "result": "Landed Safely", "embedded_ui": "Embedded:\n\ncockpit lights to cycle on and off approximately once every 3 seconds.", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nThe HUD will lose flight data if the SMS is powered off while the main generator is offline.", "dev": "", "cust": ""}, {"id": "2.16", "event": "Aircraft battery failure (Low Voltage)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Aircraft battery system failure", "effect": "Master CAUTION light illuminates\n\nELEC SYS Caution Light illuminates\n\nACFT BATT FAIL light illuminates\n\nThe FLCS RLY light also illuminates\n\nLoss of power to the HUD, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and power for normal weapon arming/release including selective jettison.\n\nIF the battery fails and both main and standby generators subsequently drop off line, power is not available to activate the EPU.\n\nIF the battery fails and subsequent loss of main generator, standby generator, and FLCS PMG power occurs, power is not available to activate the EPU or control the aircraft.", "corrective": "1. EPU switch - ON\n\n2. Land as soon as practical.\n\n3. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.\n\nIF EPU runs abnormally:\n4. EPU switch - OFF, then NORM.\n\n5. Land as soon as possible.\n\n6. Refer to ACTIVATED EPU/HYDRAZINE LEAK section.\n\nPrior to shutdown:\n7. Loose items - Secure.\n\n8. Canopy - Open.", "result": "Landed Safely", "embedded_ui": "Embedded:\n\nMaster CAUTION light illuminates\n\nELEC SYS Caution Light illuminates\n\nACFT BATT FAIL light illuminates\n\nThe FLCS RLY light also illuminates", "ifnot": "Nothing Stated\n\nLogical Event: \n\nBattery Voltage decreases more till we don't have any further control over the aircraft", "notes": "NOTE\nThe ACFT BATT FAIL light may subsequently extinguish. This should not be interpreted to mean that the battery has recharged. It may indicate that the battery voltage is so low that the light cannot remain illuminated.", "dev": "", "cust": ""}, {"id": "2.17", "event": "Partial Electrical Power Loss \n(Emergency DC Bus 1 & 2 Failure)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Wire harness chafing\n\nPartial loss of power to one or more dc buses", "effect": "Loss of power to several systems or indicators without any indications on the ELEC control panel.\n\nEquipment Connected to Emergency DC buses 1 & 2:\nEMERGENCY DC BUS NO. 1:\nAOA Indexer\nSpeedbrakes\nVHF Radio\n\nCritical Items lost:\n- LG DOWN Permission button (DN LOCK REL button required)\n- LG WHEELS Down Lights\n- TACAN\n\nEMERGENCY DC BUS NO.2:\nAutopilot\nHUD\nSEAT NOT ARMED caution Light\n\nCritical items lost:\n- LG UP-DN Command (ALT GEAR extension required)\n- ILS", "corrective": "1. SMS, LEFT HDPT and RIGHT HDPT - OFF\n\n2. ELEC CAUTION RESET button - Depress.\nThis may reset overcurrent protection device(s).\n\nIF power is restored:\n3. Land as soon as practical.\n\nIF power is not restored:\n3. Determine the power status of electrical buses.\n\nTo check power status of DC buses check the power of the equipments connected to DC Buses 1 and 2. If one item on a bus is powered, then that bus should be considered powered. \n\n(In our case the bus DC Buses 1&2 have partial electrical power loss which means that the buses are powered but some equipments on the bus are not powered)\n\nIF one or both emergency ac buses are not powered:\n4. EPU switch - ON.\n\nNOW loss of power to the HUD, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and power for normal weapon arming/release including selective jettison.\n\nIF EPU was activated:\n5. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.", "result": "Landed Safely", "embedded_ui": "Embedded:\n\nNo indication on the ELEC control panel", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nIf one item on a bus is powered, then that bus should be considered powered.\n\nWire harness chafing can affect numerous items on more than one bus without causing loss of power to a bus.\n\nThe HUD will lose flight data if the SMS is powered off while the main generator is offline.", "dev": "", "cust": ""}, {"id": "2.18", "event": "Partial Electrical Power Loss \n(Battery Bus Failure)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "Wire harness chafing\n\nPartial loss of power to one or more battery buses", "effect": "Loss of power to several systems or indicators without any indications on the ELEC control panel.\n\nEquipment Connected to Battery buses 1 & 2:\nBATTERY BUS NO. 1:\nFTIT (indicates < 200)\nIntercom\nRPM (indicates < zero)\nCOM1 Radio\nVHF Radio*\n\nCritical items lost:\n- Channel 1 Brakes\n- LG WHEELS Down Lights\n\nVHF radio is also inoperative because the intercom is not powered.\n\nBATTERY BUS NO. 2:\nEPU Fuel (indicates < zero)\nSAI (off flag)\n\nCritical items lost:\n- Channel 2 Brakes and Parking Brake \n- Hook\n- LG Warning Light", "corrective": "1. SMS, LEFT HDPT and RIGHT HDPT - OFF\n\n2. ELEC CAUTION RESET button - Depress.\nThis may reset overcurrent protection device(s).\n\nIF power is restored:\n3. Land as soon as practical.\n\nIF power is not restored:\n3. Determine the power status of all electrical buses.\n\nRefer to Dash 2021 Manual Page 286/450 to see the failed equipments on each bus. If one item on a bus is powered, then that bus should be considered powered. \n\n(In our case all buses should be working except the battery buses. The battery buses should have partial power loss)\n\nIF one or both emergency ac buses are not powered:\n4. EPU switch - ON.\n\nNOW loss of power to the HUD, fuel boost and transfer pumps, CARA, ECM, TWS, and FCR and power for normal weapon arming/release including selective jettison.\n\nIF the battery buses are not powered:\n5. Consider a net arrestment, refer to NET ARRESTMENT, this section.\n\nIF net arrestment is not available:\n6. Consider a gear up landing, refer to LANDING WITH\nLG UNSAFE/UP, this section.\n\nIF power to the battery buses is lost after the landing gear has been extended, the landing gear cannot be raised.\n7. Refer to EMERGENCY POWER DISTRIBUTION,\nthis section.\n\n8. Land as soon as possible.\n\nIF EPU was activated:\n9. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section.", "result": "Landed Safely", "embedded_ui": "Embedded:\n\nNo indication on the ELEC control panel", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nIf one item on a bus is powered, then that bus should be considered powered.\n\nWire harness chafing can affect numerous items on more than one bus without causing loss of power to a bus.\n\nThe HUD will lose flight data if the SMS is powered off while the main generator is offline.", "dev": "", "cust": ""}, {"id": "2.19", "event": "Partial Electrical Power Loss \n(Battery Bus Isolation)", "category": "Electrical", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "3.1", "event": "Fuel Leak – Fast Leak", "category": "Fuel", "status": "IN-PROGRESS", "cause": "A fuel leak may first be noticed by visual means, fuel\nimbalance, an unexpected FWD or AFT FUEL LOW\ncaution light, or an unusually high fuel flow indication.\n\nLeak in engine feed line or engine components\n\nLeak from tanks due to battle damage", "effect": "Master Caution light illuminate\n\nFWD or/and AFT FUEL LOW\ncaution light illuminates\n\nAbnormally high fuel flow\n\nRapid decrease in fuel totalizer\n\nPotential loss of range/endurance", "corrective": "1. Range – Maximize (increase altitude/airspeed without AB if not within gliding distance of a suitable field).\n\n2. ENG FEED knob – OFF (isolates engine feed line leak).\n\n3. Land as soon as possible.\n- Consider stores jettison if range is critical.\n- Consider an SFO (Simulated Flameout) landing.", "result": "Leak source isolated\n\nReduced fire risk\n\nAircraft remains airworthy but with limited endurance (must land promptly)", "embedded_ui": "Embedded:\nMaster Caution  light illuminate\n\nFWD or/and AFT FUEL LOW\ncaution light illuminates\n\nHigh fuel flow indication.\n===========================\n- Master Caution ON\n- Increase fuel flow to 75000\n\n- Decrease fuel Quantity to zero in 30 seconds from:\n1- Fuel Quantity indicator\n2- Totalizer\n3- DED Current Fuel\n\n- IF fuel quantity < 400, then FWD FUEL LOW caution light & Master Caution ON.\n\n- IF fuel quantity < 250, then AFT FUEL LOW caution light ON & Master caution ON.\n\nWhen Fuel quantity goes to zero send a CAN message to Operator Software to simulate fuel cutoff", "ifnot": "Nothing Stated\n\nLogical Event: \nAs Fuel keep decreasing, Master Caution, AFT Fuel Low / FWD Fuel LOW illuminates.\n\nCould cause engine falme out", "notes": "Need to define scenario what will happen exactly", "dev": "", "cust": ""}, {"id": "3.2", "event": "Fuel Leak – Slow Leak", "category": "Fuel", "status": "NOT YET STARTED", "cause": "A fuel leak may first be noticed by visual means, fuel\nimbalance, an unexpected FWD or AFT FUEL LOW\ncaution light, or an unusually high fuel flow indication.\n\nLeak in forward fuel system, external tanks, or lines\n\nImbalance or low fuel indications without abnormal fuel flow\n\nLeak from tanks due to battle damage", "effect": "Normal fuel flow, but totalizer decreases abnormally\n\nForward or aft fuel imbalance (FWD/AFT FUEL LOW cautions)\n\nPossible aft CG condition (departure/stall risk)", "corrective": "1. Range – Maximize (altitude/airspeed without AB).\n\n2.ENG FEED knob – NORM.\n\n3. IF leak is from forward system then FUEL QTY SEL knob – Out of NORM (stops automatic forward transfer).\n\n4. IF external tanks contain fuel then TANK INERTING switch – TANK INERTING (reduce pressurization).\n\n5. IF no externals or tanks empty then AIR REFUEL switch – OPEN.\n\n6. Land as soon as possible.\n- Consider stores jettison if range is critical.\n- Consider SFO landing.\n\n7. IF aft fuel imbalance exists (aft CG) then AOA - 15 degrees maximum\n\n8. After landing go to FIRE/OVERHEAT/FUEL LEAK (GROUND) checklist.", "result": "Leak progression slowed/reduced pressurization\n\nAircraft controllable but aft CG increases risk  (must land promptly)", "embedded_ui": "Embedded:NEED TO DEFINE\nMaster Caution  light illuminate\n\nFWD or/and AFT FUEL LOW\ncaution light illuminates\n\n totalizer decreases rapidly", "ifnot": "Nothing Stated\n\nLogical Event: \nAs Fuel keep decreasing, Master Caution, AFT Fuel Low / FWD Fuel LOW illuminates.\n\nCould cause engine falme out", "notes": "Need to define scenario what will happen exactly", "dev": "", "cust": ""}, {"id": "3.3", "event": "Fuel Leak (A-1 Tank Fast Leak)", "category": "Fuel", "status": "NOT YET STARTED", "cause": "A fuel leak may first be noticed by visual means, fuel\nimbalance, an unexpected FWD or AFT FUEL LOW\ncaution light, or an unusually high fuel flow indication.\n\nLeak in forward fuel system, external tanks, or lines\n\nImbalance or low fuel indications without abnormal fuel flow\n\nLeak from tanks due to battle damage", "effect": "Normal fuel flow, but totalizer decreases abnormally at a rate faster than slow leak\n\nFuel quantity indicator shows that fuel in the Aft tanks (AL Pointer) is decreasing at a noticeable higher rate than Forward tanks (FR Pointer).\n\nForward fuel imbalance\n\nAFT FUEL LOW caution light illuminate when AFT tank fuel quantity is less than 250 pound\nAND\nMaster Caution illuminates", "corrective": "1. Range – Maximize (altitude/airspeed without AB).\n\n2.ENG FEED knob – NORM.\n\n3. IF leak is from forward system then FUEL QTY SEL knob – Out of NORM (stops automatic forward transfer).\n\n4. IF external tanks contain fuel then TANK INERTING switch – TANK INERTING (reduce pressurization).\n\n5. IF no externals or tanks empty then AIR REFUEL switch – OPEN.\n\n6. Land as soon as possible.\n- Consider stores jettison if range is critical.\n- Consider SFO landing.\n\n7. IF aft fuel imbalance exists (aft CG) then AOA - 15 degrees maximum\n\n8. After landing go to FIRE/OVERHEAT/FUEL LEAK (GROUND) checklist.", "result": "Leak progression slowed", "embedded_ui": "Embedded:\n\nDecrease Fuel quantity with a Fast rate\n\nFuel flow indicator is normal BUT totalizer decreases rapidly at a rate faster than slow leak\n\n\nFWD FUEL LOW caution light illuminate when FWD tank fuel quantity is promptly)", "embedded_ui": "Embedded:\n\nDecrease Fuel quantity with a slow rate\n\nFuel flow indicator is normal BUT totalizer decreases rapidly\n\nMaster Caution  light illuminate\n\nFWD FUEL LOW caution light illuminate when FWD tank fuel quantity is less than 400 pound\nAND\nMaster Caution  light illuminate\n\nAFT FUEL LOW caution light illuminate when AFT tank fuel quantity is less than 250 pound\nAND\nMaster Caution  light illuminate", "ifnot": "Nothing Stated\n\nLogical Event: \nAs Fuel keep decreasing, Master Caution, AFT Fuel Low / FWD Fuel LOW illuminates.\n\nCould cause engine falme out", "notes": "", "dev": "", "cust": ""}, {"id": "3.5", "event": "Fuel Leak (Left Wing Fast Leak)", "category": "Fuel", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "3.6", "event": "Fuel Leak (Right Wing Slow Leak)", "category": "Fuel", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "3.7", "event": "Fuel Leak (High Fuel Flow)", "category": "Fuel", "status": "NOT YET STARTED", "cause": "A fuel leak may first be noticed by visual means, fuel\nimbalance, an unexpected FWD or AFT FUEL LOW\ncaution light, or an unusually high fuel flow indication.\n\nLeak in engine feed line or engine components\n\nLeak from tanks due to battle damage", "effect": "Master Caution light illuminate\n\nFWD or/and AFT FUEL LOW\ncaution light illuminates\n\nAbnormally high fuel flow\n\nRapid decrease in fuel totalizer\n\nPotential loss of range/endurance", "corrective": "1. Range – Maximize (increase altitude/airspeed without AB if not within gliding distance of a suitable field).\n\n2. ENG FEED knob – OFF (isolates engine feed line leak).\n\n3. Land as soon as possible.\n- Consider stores jettison if range is critical.\n- Consider an SFO (Simulated Flameout) landing.", "result": "Leak source isolated\n\nReduced fire risk\n\nAircraft remains airworthy but with limited endurance (must land promptly)", "embedded_ui": "Embedded:\nHigh fuel flow indication.\n\nMaster Caution  light illuminate\n\nFWD FUEL LOW caution light illuminate when FWD tank fuel quantity is less than 400 pound\n\nAFT FUEL LOW caution light illuminate when AFT tank fuel quantity is less than 250 pound", "ifnot": "Nothing Stated\n\nLogical Event: \nAs Fuel keep decreasing, Master Caution, AFT Fuel Low / FWD Fuel LOW illuminates.\n\nCould cause engine falme out", "notes": "", "dev": "", "cust": ""}, {"id": "3.8", "event": "Trapped External Fuel", "category": "Fuel", "status": "NOT YET STARTED", "cause": "Malfunction in external fuel transfer system (valves, pumps, ejectors, electrical components)\n\nExternal tank pressurization/vent valve stuck (or frozen after refueling)\n\nElectrical failures that prevent transfer circuitry operation", "effect": "Totalizer does not show total usable fuel (usable = totalizer − external tank quantity)\n\nExternal fuel remains unusable (trapped) despite displayed quantity\n\nPotential fuel imbalance between external wing tanks or centerline tank\n\nReduced usable fuel/range if reservoirs are not full or a fuel-low light is on", "corrective": "1. Fuel flow — Minimize.\n\n2. AIR REFUEL switch, Confirm set to CLOSE.\n\n3. AIR SOURCE knob, Confirm in NORM or DUMP.\n\n4. TEMP knob , Set to MAN and adjust for crew comfort (this usually increases ECS air pressure and helps external fuel transfer).\n\n5. TANK INERTING switch , Set to TANK INERTING (reduces internal tank pressurization).\n\n6. EXT FUEL TRANS switch , Set to WING FIRST.\n(WING FIRST bypasses certain electrical components that can prevent transfer; with three tanks the centerline will feed only after wing tanks empty.)\n\n7. ENG FEED knob , Set to NORM.\n(Caution: reselecting NORM while in transfer can produce a NVP TFR FAIL caution/fly-up.)\n\n8. Stick , Pulse aircraft in pitch several times (apply differential g ±2 g) to help unstick fuel.\n\nConditional: If AIR REFUEL switch was initially found CLOSE, perform:\n9. AIR REFUEL switch — OPEN (1 second), then CLOSE. \n (Open/close AR door only at or below 400 kt / 0.85 Mach.)\n(Do NOT perform step 9 if the AIR REFUEL switch was already OPEN.)\n\n\n10. External tank fuel quantity — Monitor for transfer.\n\n11. If trapped external fuel condition is not discovered until either reservoir is less than full or a fuel-low light is on then, treat fuselage fuel as the only usable fuel (i.e., external fuel may not be recoverable).\n\n12. If trapped external fuel occurs after air refueling and checklist steps did not correct the malfunction then, consider descending well below the freezing level to unfreeze external pressurization/vent valve, then cycle the AR door at lower altitude to restore operation.\n\n13. Stores — Jettison if required (consider if range is critical).", "result": "Normal transfer resumes and external fuel becomes usable (within minutes) if malfunction is cleared.\n\nIf transfer is not restored (or reservoirs < full), usable fuel is limited to fuselage tanks → range severely reduced and landing as soon as practical is required.\n\nJettisoning stores may be necessary to preserve safety/range.\n\nSignificant external tank imbalance may require additional asymmetric-stores procedures at landing.", "embedded_ui": "Embedded:\nTBD (To Be Defined)", "ifnot": "Nothing Stated\n\nLogical Event: \nPotential fuel imbalance between external wing tanks or centerline tank\n\nReduced usable fuel/range", "notes": "Expect transfer times if malfunction corrected: ~1–3 minutes for a full centerline tank, ~10–12 minutes for three external tanks with ~500 lb each (when reservoir tanks are full / air ejectors off).", "dev": "", "cust": ""}, {"id": "3.9", "event": "Fuel Imbalance", "category": "Fuel", "status": "NOT YET STARTED", "cause": "Fuel imbalance warning (red portion of AL pointer) shows when forward fuselage fuel (FR) indication is less than aft fuselage\nfuel (AL) indication.\n\nFFP malfunction or automatic forward transfer failure\n\nFuel leak (internal or external)\n\nTrapped external fuel (external tanks not transferring)\n\nMain generator failure combined with FFP malfunction or hydraulic A failure (boost pump No.3 may continue transferring and create imbalance)\n\nNormal system operating tolerances when external tank(s) installed (may be acceptable unless thresholds exceeded)\n\nFaulty fuel quantity sensors / AL or FR pointer malfunction", "effect": "AL pointer (red portion) indicates forward fuel is less than aft fuel.\n\nPossible unexpected FWD or AFT FUEL LOW caution light\n\nAft-fuel-heavy causes aft CG condition \n\nPotential reduced usable fuel / range (if trapped fuel or leak)\n\nHandling/operational limits may be required (AOA limit)", "corrective": "IF fuel imbalance is indicated by AL and FR pointers with FUEL QTY SEL knob in NORM:\n1. Fuel flow - Reduce to the minimum required to sustain flight below 6000 pph.\n\nIF aft fuel imbalance exists (aft CG):\n2. AOA - 15 degrees maximum.\n\nIF a fuel leak is suspected (abnormally high fuel flow, totalizer decreasing rapidly then:\n3. go to the FUEL LEAK procedure immediately.\n\nIF a fuel leak is not suspected:\n3. FUEL QTY SEL knob - TEST.\n\nIF AL and/or FR pointers test bad or if a fuel sensing problem is suspected:\n4. Land as soon as practical.\n\nIF AL and/or FR pointers test is good\n4. Check fuel quantities to determine if a\ntrapped fuel condition exists. if exists, go to Trapped External Fuel procedure.\n\nIF  no Trapped Fuel Exists, then \n5. ENG FEED knob - FWD or AFT.\n(Use only to correct a forward and aft fuselage fuel imbalance and not to correct imbalances between reservoirs. Do not exceed 25,000 pph fuel flow while balancing fuel).\n\nIF imbalance is not corrected:\n6. Land as soon as practical.\n\nIF proper distribution is attained:\n6. ENG FEED knob - NORM.\n\n7. Fuel balance - Monitor", "result": "Balance is reattained and normal flight operation continues.\n\nIn case trapped external fuel:\ntransfer restored and balance returns within minutes if procedure succeeds", "embedded_ui": "Embedded:NEED TO DEFINE\n\nThe Red portion in the AL pointer is visible. (in both cases if AFT fuel is more than FWD or the opposite)\n\n\nMay illuminate an unexpected FWD or AFT FUEL LOW caution light.\n\nTherefore will illuminate the Master Caution light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "3.10", "event": "Hot Fuel / Oil", "category": "Fuel", "status": "IN-PROGRESS", "cause": "High-speed flight causing fuel/oil temperature rise.\n\nFuel/oil heat-exchanger malfunction.", "effect": "Master caution light illumination.\n\nFUEL/OIL HOT caution light illumination.\n\nElevated fuel and/or oil temperatures.\n\nEngine malfunctions at low fuel flow rates (especially during approach/landing).\n\nSustained excessive oil temperature may lead to engine damage or failure.", "corrective": "1. AIR REFUEL switch, Check CLOSE.\n\n2. TANK INERTING switch, Check OFF.\n\n3. Altitude, 10,000 feet maximum (if practical); minimize aircraft maneuvering for the duration of the condition.\n\n4. Fuel flow, Maintain minimum 4000 pph until landing is assured (fuel flow above 4000 pph minimizes fuel temperature rise).\n\nIF FUEL/OIL HOT caution light goes off then\n5. Land as soon as practical.\n\nIF FUEL/OIL HOT caution light remains on then\n5. Land as soon as possible;", "result": "Reduction in fuel/oil temperature rise and If the caution light extinguishes, the aircraft can proceed to a timely landing with reduced risk of engine flameout or damage.", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFUEL/OIL HOT caution light illumination.", "ifnot": "Nothing Stated\n\nLogical Event: \nContinue elevation of fuel/oil temperatures which increase risk of engine malfunctions and permanent engine damage or failure.\n\nEngine flameout may occur at low fuel flow\nrates when in a hot fuel situation", "notes": "consider a Simulated Flameout (SFO) landing if flameout risk is high)", "dev": "", "cust": ""}, {"id": "3.11", "event": "Fuel Quantity Indicator Failure", "category": "Fuel", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "3.12", "event": "Fuel Flow Indicator Failure", "category": "Fuel", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.1", "event": "Hydraulic System A Failure", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "Due to structural damage (e.g., blown tire, battle damage, midair collision, bird strike, fire, or hard landing),\n\nFailure of hydraulic System A components (pump, lines, actuators)\n\nAssociated failures that can operate with System A failure: main generator failure, FFP malfunction, or fuel imbalance (may create gravity-feed cases)", "effect": "Master caution light illumination.\n\nFLCS FAULT caution light illuminate\n\nHYD/OIL PRESS warning light illumination.\n\nISA ALL FAIL PFL message displayed on PFLD\n\nThe speedbrakes and FFP are inoperative.", "corrective": "1. Airspeed - 400 knots maximum (subsonic).\n\n2. Land as soon as practical.\n(Make smooth control inputs and plan to fly a straightin approach)\n\n3. System B HYD PRESS indicator - Monitor.\n\n4. Fuel balance - Monitor.\n\nFuel distribution must be controlled manually", "result": "Gravity feed from FWD and AFT Reservoirs to engine will maintain flight for some time until landing", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFLCS FAULT caution light illuminate\n\nHYD/OIL PRESS warning light illumination.\n\nISA ALL FAIL PFL message displayed on PFLD\n\nHydraulic system A indicator pressure drops below 1000", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "4.2", "event": "Hydraulic System B Failure", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "Due to structural damage (e.g., blown tire, battle damage, midair collision, bird strike, fire, or hard landing),\n\nFailure of hydraulic System B components\n\nFailure of electrical controls/indicators tied to hydraulic B pump monitoring.", "effect": "Master caution light illumination.\n\nFLCS FAULT caution light illuminate\n\nHYD/OIL PRESS warning light illumination.\n\nISA ALL FAIL PFL message displayed on PFLD\n\nThe FLCS ISAs are operating in the nonredundant mode and normal braking, NWS, AR door operation, gun operation, and normal LG extension are lost.\n\nLow hydraulic pressure may cause one or more LG actuators to remain locked in the LG up position.", "corrective": "1. Airspeed , Limit to 400 knots maximum (subsonic).\n\n2. Land as soon as practical; make smooth control inputs and plan a straight-in approach.\n\n3. System A HYD PRESS indicator, Monitor.\n\n4. LG handle, DN (use DN LOCK REL button if required).\n\nIF LG handle does not lower:\n5. Select BRAKES CHAN 2 and position ALT FLAPS switch to EXTEND.\n\n6. ALT GEAR handle , Pull \n\n\n7. HOOK switch,  DN (IF required for landing).\n\n8. After touchdown, stop straight ahead and engage parking brake (Do not attempt to taxi clear of the runway)", "result": "Airspeed limit and straight-in approach simplify handling with degraded FLCS.\n\nAerodynamic braking plus the brake/JFS accumulator application should provide sufficient deceleration to stop the aircraft if accumulators are charged.", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFLCS FAULT caution light illuminate\n\nHYD/OIL PRESS warning light illumination.\n\nISA ALL FAIL PFL message displayed on PFLD\n\nHydraulic system B indicator pressure drops below 1000", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Alternate LG extension can be used up to 300 kt, but the NLG may not fully extend until ~190 kt; minimize time above 190 kt to avoid pneumatic-line leak issues.\n\nDo not depress the ALT GEAR reset button while pulling the ALT GEAR handle.\n\nBraking, use aerodynamic braking to the maximum extent possible; apply a single, moderate, steady brake application (do not cycle antiskid). Avoid resting feet on the brake pedals to prevent depleting brake/JFS accumulator pressure. \n\nNWS is not available following alternate LG extension", "dev": "", "cust": ""}, {"id": "4.3", "event": "Single Hydraulic Failure \n(System A low pressure)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.4", "event": "Single Hydraulic Failure \n(System A slow leak)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.5", "event": "Single Hydraulic Failure \n(System A fast leak)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.6", "event": "Single Hydraulic Failure \n(System B low pressure)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.7", "event": "Single Hydraulic Failure \n(System B slow leak)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.8", "event": "Single Hydraulic Failure \n(System B fast leak)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "4.9", "event": "Dual Hydraulic System Failure", "category": "Hydraulic", "status": "DEFINED", "cause": "Simultaneous failure of both hydraulic systems (pump failures, major hydraulic fluid loss)\n\nBattle or impact to hydraulic components causing damage.", "effect": "Master Caution light illuminates\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nDecreasing pressure readings on both HYD PRESS indicators.\n\nSluggishness or lack of response to flight control inputs \n\nEPU run light illuminates (indication of EPU operation).\n\nPotential loss of multiple flight/landing systems and degraded handling until hydraulic pressure is restored.", "corrective": "IF EPU run light is off (EPU didn't run automatically)\n1. EPU switch, ON .\n\n2. System A HYD PRESS indicator, Check for pressure increasing.\n\nIF hydraulic pressure does NOT increase or control response is lost \n3. EJECT\n\nIF System A hydraulic pressure IS restored \n3. Airspeed 400 kt maximum (subsonic).\n\n4.EPU run light - Check light on at idle thrust.\nBefore landing, confirm that the EPU operates\n(EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle since underspeed of the EPU results in loss-of-control. Maintain throttle setting which keeps EPU run light on until after touchdown.\n\nIF hydrazine depletes or EPU run light goes off at low thrust then\n5. Go to ABNORMAL EPU OPERATION procedure.\n\n6. Land as soon as possible; make smooth control inputs and plan a straight-in approach\n\n7. LG handle, DN (use DN LOCK REL button if required).\n\nIF LG handle does not lower:\n8. Select BRAKES CHAN 2 and position ALT FLAPS switch to EXTEND.\n\n8. ALT GEAR handle , Pull \n\n9. HOOK switch,  DN (IF required for landing).\n\n10. After touchdown, stop straight ahead and engage parking brake (Do not attempt to taxi clear of the runway)\n\n11. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section", "result": "Turning the EPU ON should restore hydraulic pressure to System A. System A pressure rise will restore controllability and some hydraulic functions.", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nHydraulic system A & B indicator pressure drops\n\nEPU Light illuminates when both hydraulic system pressures drop below 1000 psi\n\nHydraulic system A pressure indicator start to increase again as pressure is restored\n\n===========================\n1- Drop hydraulic pressure A& B to 0 in 10 seconds.\n\n2- Turn On Master Caution light & FLCS caution light\n\nWhen hydraulic systems A & B drop below 1000 psi then\n--------------------------------------------\n- Turn OFF Engine Fire warning light\n\n- Turn OFF Overheat caution light\n- Turn ON HYD/OIL press warning light\n- Display \"ISA ALL FAIL\" on PFLD\n--------------------------------------------\nIncrease Hydraulic pressure A to 3000 psi", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Alternate LG extension can be used up to 300 kt, but the NLG may not fully extend until ~190 kt; minimize time above 190 kt to avoid pneumatic-line leak issues.\n\nDo not depress the ALT GEAR reset button while pulling the ALT GEAR handle.\n\nBraking, use aerodynamic braking to the maximum extent possible; apply a single, moderate, steady brake application (do not cycle antiskid). Avoid resting feet on the brake pedals to prevent depleting brake/JFS accumulator pressure. \n\nNWS is not available following alternate LG extension", "dev": "", "cust": ""}, {"id": "4.10", "event": "System B and Generator Failure (PTO Shaft Failure)", "category": "Hydraulic", "status": "NOT YET STARTED", "cause": "PTO (power take-off) shaft failure from gearbox,mechanical fault or battle damage\n\nFailure of hydraulic system B\n\nFailure of the main and standby generators\n\nFailure of the FLCS PMG.", "effect": "Master Caution light illuminates\n\nLoss of System B hydraulic pressure.\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nDecreasing pressure readings on both HYD PRESS B indicators.\n\nLoss of MAIN GEN and STBY GEN outputs; \nMAIN GEN and STBY GEN lights illuminate.\n\nFLCS PMG light illuminates (indicating FLCS PMG failure).\n\nEPU run light should come on automatically if the EPU starts; if it does not, the EPU run light will be OFF.\n\nADI may show OFF and/or AUX warning flags if inertial/attitude references are affected.\n\nFlight controls feel sluggish or may lose response until EPU restores System A pressure.\nNormal braking, NWS, AR door operation, gun operation, and normal LG extension will be lost \n\nPotential loss of HUD/MFDs or other instruments during generator loss.", "corrective": "IF EPU run light is off (EPU didn't run automatically)\n1. EPU switch, ON .\n\n2. Throttle, Do not retard below MIL if supersonic (stall protection may be lost; do not retard below MIL until subsonic).\n\nIF hydraulic pressure does NOT increase or control response is lost \n3. EJECT\n\nIF System A hydraulic pressure is restored \n3. Airspeed 400 kt maximum (subsonic).\n\n4. ADI, Check for OFF and/or AUX warning flags;\nIF warning flags are present, refer to TOTAL INS FAILURE procedure (if only AUX flag is in view, pitch/roll may be erroneous).\n\n5. Fuel balance — Monitor.\n\n6.EPU run light - Check light on at idle thrust.\nBefore landing, confirm that the EPU operates\n(EPU run light is on) with the throttle in IDLE.\nIf the EPU run light goes off, immediately advance the throttle since underspeed of the EPU results in loss-of-control. Maintain throttle setting which keeps EPU run light on until after touchdown.\n\nIF hydrazine depletes or EPU run light goes off at low thrust then\n7. Go to ABNORMAL EPU OPERATION procedure.\n\n8. Land as soon as possible; make smooth control inputs and plan a straight-in approach\n\n9. LG handle, DN (use DN LOCK REL button if required).\n\nIF LG handle does not lower:\n10. Select BRAKES CHAN 2 and position ALT FLAPS switch to EXTEND.\n\n10. ALT GEAR handle , Pull \n\n11. HOOK switch,  DN (IF required for landing).\n\n12. After touchdown, stop straight ahead and engage parking brake (Do not attempt to taxi clear of the runway)\n\n13. Refer to ACTIVATED EPU/HYDRAZINE LEAK,\nthis section", "result": "EPU ON should provide emergency hydraulic pressure to System A and emergency electrical power sufficient to restore essential flight controls and selected instruments, enabling controlled flight and landing.", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nHydraulic system B indicator pressure drops\n\nMAIN GEN and STBY GEN lights illuminate.\n\nFLCS PMG light illuminate\n\nEPU Light illuminates", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "Alternate LG extension can be used up to 300 kt, but the NLG may not fully extend until ~190 kt; minimize time above 190 kt to avoid pneumatic-line leak issues.\n\nDo not depress the ALT GEAR reset button while pulling the ALT GEAR handle.\n\nBraking, use aerodynamic braking to the maximum extent possible; apply a single, moderate, steady brake application (do not cycle antiskid). Avoid resting feet on the brake pedals to prevent depleting brake/JFS accumulator pressure. \n\nNWS is not available following alternate LG extension", "dev": "", "cust": ""}, {"id": "4.11", "event": "Hydraulic System Overpressure\n(Single)", "category": "Hydraulic", "status": "IN-PROGRESS", "cause": "NO causes stated.", "effect": "A steady state hydraulic pressure indication above 3250 psi.\n\nMaster Caution light illuminates\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD", "corrective": "IF one hydraulic system indicates overpressure:\n1. Land as soon as practical.\n\nIF both hydraulic systems indicate overpressure:\n2. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:\nincrease hydraulic pressure A indication to 3500 psi.\n\nWhen pressure reaches 3500 then\n------------------------------------------\n\nMaster Caution light illuminates\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nTurn OFF Engine Fire warning light\n\nTurn OFF Overheat Caution light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "4.12", "event": "Hydraulic System Overpressure\n(Dual)", "category": "Hydraulic", "status": "IN-PROGRESS", "cause": "NO causes stated.", "effect": "A steady state hydraulic pressure indication above 3250 psi.\n\nMaster Caution light illuminates\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD", "corrective": "IF one hydraulic system indicates overpressure:\n1. Land as soon as practical.\n\nIF both hydraulic systems indicate overpressure:\n2. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:\nincrease hydraulic pressure A & B indication to 3500 psi.\n\nWhen pressure reaches 3500 then\n------------------------------------------\n\nMaster Caution light illuminates\n\nHYD/OIL PRESS warning light illumination.\n\nFLCS FAULT caution light illuminate\n\nISA ALL FAIL PFL message displayed on PFLD\n\nTurn OFF Engine Fire warning light\n\nTurn OFF Overheat Caution light", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.1", "event": "Air Data Malfunction (Single ADC Failure) in Flight", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Contamination of the pitot probe, which causes blockage of the passage which provides total pressure signals.\n\nAn erroneously low airspeed value is used by FLCS", "effect": "Master Caution light illuminates\n\nFLCS FAULT caution light illumination.\n\nFLCS ADC FAIL PFL \n\nLow airspeed indications in the HUD\n\nLow airspeed/Mach number values in indicator\n\nThe Low airspeed value used by FLCS can cause pitch oscillations", "corrective": "IF BRK PWR DEGR PFL is also present, refer to FLCS\nSINGLE ELECTRONIC FAILURE, this section.\n\n1. Establish 1 g flight.\n\n2. FLCS RESET switch - RESET.\n\nIf failure indications go off:\n3. Continue normal operation.\n\nIf failure indications remain on:\n3. Land as soon as practical.\n\nIF icing is suspected, refer to AOA PROBE\nICING, this section.", "result": "The FLCS FAULT caution light:\nThis light goes off if the failure resets\n\n\nFor PFL:\nAll FLCS Failure indications removed \n(System code, PFL message)", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFLCS FAULT caution light illumination.\n\nFLCS ADC FAIL PFL message added to PFLD Based on PFLs priorities\n\nLow airspeed/Mach number values in indicator", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.2", "event": "Air Data Malfunction (Single ADC Failure) during Takeoff", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Contamination of the pitot probe, which causes blockage of the passage which provides total pressure signals.\n\nAn erroneously low airspeed value is used by FLCS", "effect": "Master Caution light illuminates\n\nFLCS FAULT caution light illumination.\n\nFLCS ADC FAIL PFL \n\nErroneously low airspeed indications are present both in\nthe HUD and on the airspeed/Mach indicator\n\nPitch oscillations may be experienced at higher speeds.", "corrective": "1. Consider Aborting\n\nIF Takeoff is continued:\n2.  Maintain airspeed below 210 knots (Cat I) or 275 knots (Cat III)\n\n3. Use INS groundspeed or wingman indications to determine airspeed\n\n4. Land as soon as practical\n\nIF oscillations are encountered, minimize stick commands and slow to less than 210 knots (Cat I) 275 knots (Cat III)", "result": "The FLCS FAULT caution light:\nThis light goes off if the failure resets\n\n\nFor PFL:\nAll FLCS Failure indications removed \n- FLCS ADC FAIL message removed\n- FLCS system code removed", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFLCS FAULT caution light illumination.\n\nFLCS ADC FAIL PFL message added to PFLD Based on PFLs priorities\n\nLow airspeed/Mach number values in indicator", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.3", "event": "Air Data Malfunction (Dual ADC Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Contamination of the pitot probe, which causes blockage of the passage which provides total pressure signals.\n\nAn erroneously low airspeed value is used by FLCS", "effect": "Master Caution light illuminates\n\nFLCS FAULT caution light illumination.\n\nFLCS warning light \n\nSTBY GAIN PFL message on PFD\n\nFLCS ADC FAIL PFL message on PFLD\n(Already present from first failure)\n\nFlying qualities in standby gains are degraded.", "corrective": "1. Establish 1 g flight with maximum of 12 degrees\nAOA.\n\nAirspeed 275-650 knots with LG up.\n\n2. FLCS RESET switch - RESET.\n\n3. Land as soon as practical.\n\nDo not slow below 275 knots with LG up if STBY\nGAIN PFL is still present.", "result": "The FLCS warning light goes off if the failure resets\n\nThe FLCS FAULT caution light:\nThis light goes off if the failure resets\n\nFor PFL:\nAll FLCS Failure indications removed \n- FLCS ADC FAIL message is latched and cannot be removed\n- STBY GAIN PFL message removed\n- FLCS system code removed", "embedded_ui": "Embedded:\nMaster caution light illumination.\n\nFLCS FAULT caution light illumination. st Failure in Rudder ISA\n- First Failure in Flaperon ISA\n\nISA RUD FAIL PFL message displayed on PFLD\n\nISA LF FAIL PFL message displayed on PFLD\n\nISA ALL FAIL PFL message displayed on PFLD", "corrective": "1. Airspeed - 400 knots maximum (subsonic).\n\n2. FLCS RESET switch - RESET.\n\nIF failure indications go off:\n3. Continue normal operation.\n\nIF failure indications remain on:\n3. Land as soon as practical.", "result": "If the servo(s) resets, a minor flight control transient may be felt.\n\nNo degradation in flying qualities is expected if the\nservo does not reset.\n\nIn both cases landing occurs safely", "embedded_ui": "Embedded:\nMaster Caution illuminates\n\nFLCS FAULT caution light illuminates\n\nBoth First Failure PFLs are displayed on PFLD\n\nThen ISA ALL FAIL PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.16", "event": "FLCS Electronic Malfunction \n(Branch A Power Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Branch A power supply problem", "effect": "Master Caution illuminates\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nBrake channel 1 degraded", "corrective": "1. Establish 1 g flight and airspeed less than 400 knots\n(subsonic).\n\n2. FLCS RESET switch - RESET.\n\nIF failure indications go off:\n3. Continue normal operation.\n\nIF failure indications remain on:\n3. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine brake and\nbrake channel affected. (in our case branch A light should NOT illuminate and brake channel 1 is affected)\n\n4. BRAKES channel switch - CHAN 2.\n\n5. Land as soon as practical.", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution illuminates\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nFLCS Branch A light should not illuminate when FLCS PWR TEST is done", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.17", "event": "FLCS Electronic Malfunction \n(Branch A & B Power Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Branch A power supply problem\n\nBranch B power supply problem", "effect": "Master Caution illuminates\n\nFLCS warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nFLCS DUAL FAIL PFL message displayed on PFLD", "corrective": "1. Establish 1 g flight and airspeed less than 400 knots\n(subsonic).\n\n2. ADV MODE switch - Depress.\n\n3. FLCS RESET switch - RESET.\nReset may clear the FLCS warning light; however, the\nsingle failure is still present.\n\nIF FLCS warning light goes off and NO FLCS PFLs are\npresent:\n4. Continue normal operation. Do not use ADV MODE switch.\n\nIF FLCS warning light goes off and a FLCS PFL is still\npresent:\n4. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine brake and brake channel affected. If branch A, B, or C FLCS  PWR light fails to illuminate,\n\n5. BRAKES channel switch - Change channels (if required).\n\n6. Land as soon as practical.\n\nIF FLCS warning light remains ON:\n4. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine brake and\nbrake channel affected. (in our case branches A & B lights should NOT illuminate and brake channels 1 & 2 are affected)\n\n5. BRAKES channel switch - Change channels (if required).\n(NO NEED TO CHANGE CHANNEL BOTH CHANNELS ARE DEGRADED)\n\n6. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution illuminates\n\nFLCS warning light illuminates\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nFLCS DUAL FAIL PFL message displayed on PFLD\n\nThe ATF NOT ENGAGED caution light may illuminate shortly after depressing the ADV MODE switch.", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\n• No significant flying qualities degradation should occur; however, with a FLCS dual failure, the FLCS has no redundancy.\n\n• Two minutes after WOW, the FLCS FAULT Caution light illuminates and a FLCS SNGL FAIL PFL occurs.\n\n A reset of a dual failure may be attempted. However, reset is only possible back to the single failure condition, since the single failure is latched if it still\nexisted at the time of the second failure", "dev": "", "cust": ""}, {"id": "5.18", "event": "FLCS Electronic Malfunction \n(Branch A & C Power Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Branch A power supply problem\n\nBranch C power supply problem", "effect": "Master Caution illuminates\n\nFLCS warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nFLCS DUAL FAIL PFL message displayed on PFLD", "corrective": "1. Establish 1 g flight and airspeed less than 400 knots\n(subsonic).\n\n2. ADV MODE switch - Depress.\n\n3. FLCS RESET switch - RESET.\nReset may clear the FLCS warning light; however, the\nsingle failure is still present.\n\nIF FLCS warning light goes off and NO FLCS PFLs are\npresent:\n4. Continue normal operation. Do not use ADV MODE switch.\n\nIF FLCS warning light goes off and a FLCS PFL is still\npresent:\n4. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine brake and brake channel affected. If branch A, B, or C FLCS  PWR light fails to illuminate,\n\n5. BRAKES channel switch - Change channels (if required).\n\n6. Land as soon as practical.\n\nIF FLCS warning light remains ON:\n4. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine brake and\nbrake channel affected. (in our case branches A & C lights should NOT illuminate and brake channel 1 is affected)\n\n5. BRAKES channel switch - CHAN 2\n\n6. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:\nMaster Caution illuminates\n\nFLCS warning light illuminates\n\nFLCS FAULT caution light illuminates\n\nBRK PWR DEGR PFL message displayed on PFLD\n\nFLCS DUAL FAIL PFL message displayed on PFLD\n\nThe ATF NOT ENGAGED caution light may illuminate shortly after depressing the ADV MODE switch.", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\n• No significant flying qualities degradation should occur; however, with a FLCS dual failure, the FLCS has no redundancy.\n\n• Two minutes after WOW, the FLCS FAULT Caution light illuminates and a FLCS SNGL FAIL PFL occurs.\n\n A reset of a dual failure may be attempted. However, reset is only possible back to the single failure condition, since the single failure is latched if it still\nexisted at the time of the second failure", "dev": "", "cust": ""}, {"id": "5.19", "event": "FLCS Electronic Malfunction \n(ADV MODE Switch Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "A single failure of the ADV MODE switch when attempting/during ATF operations.", "effect": "FLCS warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nFLCS DUAL FAIL PFL message displayed on PFLD", "corrective": "", "result": "", "embedded_ui": "Embedded:\n\nFLCS warning light illuminates\n\nFLCS DUAL FAIL PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "It is possible to receive FLCS dual fail indications following a single failure of the ADV MODE switch when attempting/during ATF operations. The dual-redundant switch has two outputs, each of which are split for use by the four-channel FLCS. If one side of the switch fails, the FLCS warning light illuminates and a FLCS DUAL FAIL PFL occurs. This dual failure can be reset as long as the ADV MODE switch is disengaged prior to reset.", "dev": "", "cust": ""}, {"id": "5.20", "event": "DBU ON Warning light \n(DBU Engaged)", "category": "Flight Controls", "status": "DONE", "cause": "Detection of a primary software fault.\n\nSoftware problems in the FLCC force a majority of the branches into a failed state.", "effect": "DBU mode is entered automatically \n\nDBU ON warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message", "corrective": "IF DBU ON warning light illuminates:\n1. Establish 1 g flight.\n\n2. Airspeed - 500 knots/0.9 Mach maximum.\nIf possible, slow to 300 knots.\n\n3. DIGITAL BACKUP switch - Cycle to BACKUP, then\nback to OFF.\n\nIF DBU ON warning light goes off:\n(Verify that DBU is no longer present on the FLCS page of\nthe MFD)\n4. FLCS RESET switch - RESET (if required).\n\n5. Land as soon as practical.\n\nDo not exceed 500 knots/0.9 Mach. Do not engage ATF.\n\nIF DBU ON warning light remains on:\n4. DIGITAL BACKUP switch - BACKUP.\n\n5. Airspeed - 500 knots/0.9 Mach maximum.\nIf possible, slow to 300 knots.\n\n6. Controllability - Check.\n\nLower LG at safe altitude and check handling qualities\nat 11-13 degrees AOA.\n\n7. FLCS PWR TEST switch - TEST.\n\nObserve FLCS PWR lights and determine status of toe\nbrakes. \n\n8. BRAKES channel switch - Change channels (if required).\n\n9. Land as soon as possible.", "result": "Landed Safely", "embedded_ui": "Embedded:", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.21", "event": "TF-FAIL Warning Light\n(SWIM NVP Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "When SWIM failures are detected by the FLCS.\n\nNVP data bad, AMUX wraparound failure, NVP self-mode\nfailure, or cyclic test problem monitor failure.", "effect": "TF FAIL warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nSWIM NVP FAIL PFL displayed on the PFLD", "corrective": "IF TF FAIL warning light illuminates:\n1. Altitude - As required.\n\n2. Paddle switch - Depress.\nThis action interrupts the fly-up in ATF or manual TF (if enabled).\n\n3. PFLD - Check.\n\nIF a SWIM PFL is displayed, the TF malfunction was detected by one or more SWIM monitors.\n\n4. CARA, INS, and FCC - Check for proper operation\n\nIF SWIM ATF FAIL, SWIM NVP FAIL, SWIM RALT FAIL,\nor SWIM SCP FAIL PFL is displayed:\n\n5. Paddle switch - Release.\n\nIF SWIM ATF FAIL, SWIM NVP FAIL, SWIM RALT FAIL,\nor SWIM SCP FAIL PFL does not clear or recurs:\n\n6. Discontinue TF operations.", "result": "Terrain following operations are discontinued", "embedded_ui": "Embedded:\n\nTF FAIL warning light illuminates\n\nSWIM NVP FAIL PFL displayed on the PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nIf the malfunction was detected by SWIM and\nthis malfunction is no longer present, releasing\nthe paddle switch resets the SWIM monitors,\ncancels the flyup, and extinguishes the TF\nFAIL warning light.", "dev": "", "cust": ""}, {"id": "5.22", "event": "TF-FAIL Warning Light\n(SWIM Velocity Failure)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "When SWIM failures are detected by the FLCS.\n\nINS failure", "effect": "TF FAIL warning light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nWARNING voice message\n\nSWIM NVP VEL PFL displayed on the PFLD", "corrective": "IF TF FAIL warning light illuminates:\n1. Altitude - As required.\n\n2. Paddle switch - Depress.\nThis action interrupts the fly-up in ATF or manual TF (if enabled).\n\n3. PFLD - Check.\n\nIF a SWIM PFL is displayed, the TF malfunction was detected by one or more SWIM monitors.\n\n4. CARA, INS, and FCC - Check for proper operation\n\nIF SWIM ATTD FAIL or SWIM VEL FAIL PFL is displayed:\n5. Paddle switch - Release.\n\n6. Discontinue TF operations.", "result": "Terrain following operations are discontinued", "embedded_ui": "Embedded:\n\nTF FAIL warning light illuminates\n\nSWIM NVP VEL PFL displayed on the PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "WARNING\nFurther TF operations should not be attempted\nafter the occurrence of a SWIM ATTD FAIL\nor SWIM VEL FAIL PFL", "dev": "", "cust": ""}, {"id": "5.23", "event": "LEF Malfunction (Symmetric)", "category": "Flight Controls", "status": "DONE", "cause": "One or both of the LEF branches have malfunctioned\n\nThe asymmetry brakes have been activated\n\nThe LEFs have been manually locked.", "effect": "FLCS Warning Light illuminates\n\nFlashing \"WARN\" is displayed on HUD\n\nFLCS LEF LOCK PFL message displayed on PFLD\n\nLEFs will stop and remain fixed in position.", "corrective": "IF a FLCS LEF LOCK PFL occurs\n1. AOA - 12 degrees maximum.\n\n2. FLCS RESET switch - RESET.\n\nIF FLCS warning light resets:\n3. Continue flight.\n\nIF the FLCS warning light does not reset\n4. Airspeed - Decelerate to subsonic flight if supersonic.\n\n5. After LG is down, LE FLAPS switch - LOCK.\n\n6. Land as soon as practical.\n\nDuring engine shutdown:\n7. MAIN PWR switch - Do not place to OFF until engine rpm has reached zero.", "result": "IF warning light extinguishes\nFlight mission continues normally\n\nIF Warning light remain ON\nAircraft landed safely\n\n========================================\nFailure Resets automatically after:\n2. FLCS RESET switch - RESET.", "embedded_ui": "Embedded:\nFLCS Warning Light illuminates\n\nFLCS LEF LOCK PFL message displayed on PFLD\n===========================\n- Turn OFF Engine Fire warning\n- Turn OFF Master Caution\n- Turn OFF Overheat Caution\n- FLCS Warning Light illuminates\n- FLCS LEF LOCK PFL message displayed on PFLD", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "NOTE\nThe LEFs may drift up after being locked manually.\n\nCAUTION\nPlacing MAIN PWR switch to OFF before hydraulic pressure is lost may cause damage to\ntwo LEF shafts.", "dev": "", "cust": ""}, {"id": "5.24", "event": "LEF Malfunction (Asymmetric)", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "Mechanical disconnect in one of the LEF drive trains\n\nAND\n\nA failure in the asymmetry brake.", "effect": "The main indication of asymmerty is an uncommanded roll.\n\nThe failed LEF may be as much as 90 degrees up or down.", "corrective": "IF LEF asymmetry occurs:\n1. AOA - 6-10 degrees.\n\n2. Lateral stick/roll trim - As required to recover uncommanded roll but Do not attempt to achieve coordinated flight.\n\n3. LE FLAPS switch - LOCK.\nLock operating LEF as near symmetrical as possible.\n\n4. Stores - Jettison (if required).\nConsider selective jettison of stores from the heavy\nwing as a means to reduce roll control requirements\n\n5. Fuel weight - Reduce (if feasible/required).\n\n6. Handling qualities - Check.\nLower LG at a safe altitude and check handling qualities at 6-8 degrees AOA.\n\n7. Land as soon as practical.\n\n8. Stick - Lower the nose immediately after touchdown\n\nIF departure-end arrestment is required:\n9. HOOK switch - DN", "result": "Landing occurs safely", "embedded_ui": "Embedded:\n\nThe effects are all related to the physics of the aircraft such as: the uncommanded roll; and there are no lights or any Embedded or UI effects.", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "WARNING\nMinimize rudder inputs. Use rudder as required to reduce sideslip when jettisoning stores or to aid in maintaining desired ground track during the final part of landing approach. Do not use\nrudder trim.\n\nCAUTION\nReduce fuel weight if fatigue is not a factor. Fuel flow is significantly higher with an LEF\nfailed full up or down and must be considered during recovery.", "dev": "", "cust": ""}, {"id": "5.25", "event": "Trim Malfunction", "category": "Flight Controls", "status": "DONE", "cause": "Ther is no specific cause stated", "effect": "An increase in stick pressure required to maintain the desired attitude\n\nA lack of response to stick trim inputs.", "corrective": "1. TRIM/AP DISC switch - DISC, then NORM.\n\nIF normal operation is not restored:\n2. TRIM/AP DISC switch - DISC.\nAutopilot cannot be engaged.\n\n3. ROLL and PITCH TRIM wheels - As required, through manual trim panel.", "result": "Trim is adjusted manually", "embedded_ui": "Embedded:", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "", "dev": "", "cust": ""}, {"id": "5.26", "event": "AOA Probe Icing", "category": "Flight Controls", "status": "DEFINED", "cause": "Harsh icing conditions causes ice accumulation on the AOA probes", "effect": "fixed AOA indication in the cockpit with no other failure indications.\n\nIce accumulation on the AOA probes", "corrective": "If AOA probe icing is suspected:\n1. Airspeed - 200 knots minimum until LG is down.\nMaintain approximately 1 g flight.\n\n2. PROBE HEAT switch - TEST, then PROBE HEAT.\nVerify proper probe heat monitor operation by observing PROBE HEAT light flashing 3-5 times per\nsecond during test.\n\n3. Airspeed - Increase (if practical).\n\n4. Icing conditions - Avoid.\nDescend below the freezing level (if possible).\n\nIF AOA indication returns to normal and FLCS AOA FAIL\nPFL is present:\n5. FLCS RESET switch - RESET.\n\n6. Land as soon as practical.\n\nIF AOA indication remains fixed:\n5. Fly final approach using computed final approach\nKCAS for 11 degrees AOA.\n\n6. Land as soon as practical", "result": "Landed Safely", "embedded_ui": "Embedded:", "ifnot": "Nothing Stated\n\nLogical Event:", "notes": "WARNING\nAOA probe icing should be suspected if flying\nthrough areas of known or suspected icing,\nicing on the aircraft is observed, or inlet icing\nis detected.", "dev": "", "cust": ""}, {"id": "5.27", "event": "Air Data Probes Heating Failure", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "", "effect": "", "corrective": "", "result": "", "embedded_ui": "", "ifnot": "", "notes": "", "dev": "", "cust": ""}, {"id": "5.28", "event": "FLCS Warning Light", "category": "Flight Controls", "status": "NOT YET STARTED", "cause": "A dual malfunction in the FLCC electronics, including the processors, power supplies, input commands or sensors, AOA, or air data inputs.\n\nIf the LEFs are /* team inference: embedded vs software from the technical column */
function teamOf(f){
  const t=(f.embedded_ui||'').toLowerCase();
  const hasEmb = t.includes('embedded') && /embedded:\s*\S/.test((f.embedded_ui||'').toLowerCase());
  const hasUI = /ui:\s*\S/.test((f.embedded_ui||'').toLowerCase());
  if(f.team) return f.team; // manual override
  if(hasEmb&&hasUI) return 'both';
  if(hasUI) return 'sw';
  if(hasEmb) return 'emb';
  return 'both';
}

async function initData(){

      // seed if empty
      const snap=await getDocs(failuresCol);
      if(snap.empty){
        await seedFirestore();
      }
      onSnapshot(failuresCol,s=>{
        failures=s.docs.map(d=>({_docid:d.id,...d.data()}));
        sortFailures();
        setSync(true);render();
      },err=>{setSync(false);console.error(err);});
      onSnapshot(tasksCol,s=>{
        tasks=s.docs.map(d=>({_docid:d.id,...d.data()}));
        render();
      });
    }catch(e){console.error(e);useLocal=true;setSync(false);loadLocal();}
  }else{
    useLocal=true;setSync(false);loadLocal();
  }
}

function loadLocal(){
  failures=lsLoad('viper_failures',null);
  if(!failures){failures=SEED_DATA.map(x=>({...x}));lsSave('viper_failures',failures);}
  tasks=lsLoad('viper_tasks',[]);
  sortFailures();render();
}
function persistLocal(){lsSave('viper_failures',failures);lsSave('viper_tasks',tasks);}

async function seedFirestore(){
  const batch=writeBatch(DB);
  SEED_DATA.forEach(f=>{batch.set(doc(failuresCol,f.id),f);});
  await batch.commit();
}

function sortFailures(){
  failures.sort((a,b)=>{
    const pa=a.id.split('.').map(Number),pb=b.id.split('.').map(Number);
    return (pa[0]-pb[0])||((pa[1]||0)-(pb[1]||0));
  });
}

/* writes */
async function updateFailure(id,patch){
  const f=failures.find(x=>x.id===id);if(f)Object.assign(f,patch);
  if(useLocal){persistLocal();render();}
  else{const ref=doc(failuresCol,f._docid||id);await updateDoc(ref,patch);}
}
async function addFailure(obj){
  if(useLocal){failures.push(obj);sortFailures();persistLocal();render();}
  else{await setDoc(doc(failuresCol,obj.id),obj);}
}
async function removeFailure(id){
  const f=failures.find(x=>x.id===id);
  if(useLocal){failures=failures.filter(x=>x.id!==id);persistLocal();render();}
  else{await deleteDoc(doc(failuresCol,f._docid||id));}
}
async function addTask(obj){
  if(useLocal){tasks.push(obj);persistLocal();render();}
  else{await setDoc(doc(tasksCol,obj.id),obj);}
}
async function updateTask(id,patch){
  const t=tasks.find(x=>x.id===id);if(t)Object.assign(t,patch);
  if(useLocal){persistLocal();render();}
  else{await updateDoc(doc(tasksCol,t._docid||id),patch);}
}
async function removeTask(id){
  const t=tasks.find(x=>x.id===id);
  if(useLocal){tasks=tasks.filter(x=>x.id!==id);persistLocal();render();}
  else{await deleteDoc(doc(tasksCol,t._docid||id));}
}

function setSync(ok){
  const d=$('#syncDot'),t=$('#syncTxt');
  if(useLocal){d.className='dot off';t.textContent='local only';}
  else if(ok){d.className='dot on';t.textContent='live · synced';}
  else{d.className='dot off';t.textContent='offline';}
}

/* ---------- PROGRESS ---------- */
function counts(){
  const c={total:0,DONE:0,'IN-PROGRESS':0,DEFINED:0,'NOT YET STARTED':0};
  failures.forEach(f=>{c.total++;c[f.status]=(c[f.status]||0)+1;});
  return c;
}
function renderProgress(){
  const c=counts();
  const done=c.DONE||0,prog=c['IN-PROGRESS']||0,def=c.DEFINED||0,tot=c.total||1;
  const pct=Math.round(done/tot*100);
  $('#progLabel').textContent=`${done} of ${tot} complete · ${prog} in progress`;
  $('#progPct').textContent=pct+'%';
  $('#barDone').style.width=(done/tot*100)+'%';
  $('#barProg').style.width=(prog/tot*100)+'%';
  $('#barDef').style.width=(def/tot*100)+'%';
}

/* ---------- RENDER ROUTER ---------- */
function render(){
  renderProgress();
  if(view==='failures')renderFailures();
  else if(view==='tasks')renderTasks();
  else if(view==='stats')renderStats();
  else if(view==='setup')renderSetup();
  $('#fab').style.display=(view==='failures')?'flex':'none';
}

function splitEmb(s){

  }
  return {emb:s.replace(/^Embedded:/i,'').trim(),ui:''};
}

  $('#nameSave').onclick=()=>{myName=$('#nameInput').value.trim();localStorage.setItem('viper_name',myName);toast('Name saved ✓');};
  $('#expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify({failures,tasks},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='viper_failures_backup.json';a.click();
  };
}

function promptName(){
  view='setup';switchTab('setup');render();
  toast('Set your name first');
}

/* ---------- TAB SWITCH ---------- */
function switchTab(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{switchTab(t.dataset.view);render();});
$('#fab').onclick=openAdd;
$('#overlay').onclick=closeSheet;

/* expose for inline */
window.__viper={openSheet,closeSheet};

/* ---------- PASSWORD GATE ---------- */
function startApp(){ document.getElementById('lockScreen').style.display='none'; initData(); }
function showLock(){
  const ls=document.getElementById('lockScreen');
  ls.style.display='flex';
  const inp=document.getElementById('lockInput');
  const btn=document.getElementById('lockBtn');
  const err=document.getElementById('lockErr');
  function tryUnlock(){
    if(inp.value===TEAM_PASSWORD){
      localStorage.setItem('viper_unlocked','1');
      startApp();
    }else{
      err.textContent='Wrong password';
      inp.value='';inp.focus();
    }
  }
  btn.onclick=tryUnlock;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
  inp.focus();
}

if(localStorage.getItem('viper_unlocked')==='1'){
  startApp();
}else{
  showLock();
}

</script>
